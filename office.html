<style>

<script>
/* =========================================================
   Chaleur Consignment Desk
   Data lives in this artifact's shared database:
   config/settings, config/counters, partners/*, products/*,
   prices/*, weeks/<partner>_<weekStart>, audits/*, alerts/latest
   ========================================================= */
const DEF = {
  company:{name:"Chaleur Atelier Patisserie", address:"Larkin, Johor Bahru, Johor", reg:"", phone:"", email:"chaleurpatisserie@gmail.com"},
  colours:[{name:"BLACK",hex:"#1e1e1e"},{name:"ORANGE",hex:"#f08a24"},{name:"YELLOW",hex:"#f2c53d"},{name:"GREEN",hex:"#3c9a52"},{name:"BLUE",hex:"#2f6fd0"},{name:"RED",hex:"#d63333"},{name:"PURPLE",hex:"#8b4fc6"}],
  mode:"testing", cutoffDate:"", prepLeadDays:0, graceMin:60, eveUplift:10, driveRootId:"1qA-hCdc19wlZNEyfNR3Nled45zHLwbK7",
  weekEndDay:0, prefixes:{DO:"DO",INV:"INV",CF:"CF",CN:"CN"}, cfRate:"original",
  fieldFormUrl:"https:\/\/script.google.com/macros/s/AKfycbyX_DH98Kfqa3SHKgM_XXCM7MIJaJokTbjuCq8Rcf6uueS7kSDy7wg2CmvXsOACtZfivw/exec?p=closing", auditFormUrl:"https:\/\/script.google.com/macros/s/AKfycbyX_DH98Kfqa3SHKgM_XXCM7MIJaJokTbjuCq8Rcf6uueS7kSDy7wg2CmvXsOACtZfivw/exec?p=audit", chaleurWhatsApp:"", reportDeadline:"23:30",
  checks:[{k:"display",l:"Display clean and tidy"},{k:"fifo",l:"Oldest colour at the front (FIFO)"},{k:"labels",l:"Every cake has its colour dot / label"},{k:"expired",l:"No overdue colour on display"},{k:"tags",l:"Price tags present on every cake"},{k:"setup",l:"Signage & setup as agreed"},{k:"menu_physical",l:"Physical menu correct (items, prices, photos)"},{k:"menu_qr",l:"QR ordering correct (items, prices, photos)"},{k:"packaging",l:"Boxes, sporks, bags stocked"},{k:"chiller",l:"Chiller closed, running, light on"}]
};
const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const S={db:null,dl:null,mcp:null,assets:null,calendar:{},drive:{folders:{}},cfg:{},counters:{},partners:{},products:{},prices:{},weeks:{},audits:{},alerts:null,loaded:new Set(),
  tab:"today",f:{},ui:{partner:"",date:"",week:"",setup:"partners",modal:null,confirm:null,paste:"",parsed:null,editDay:false,doEdit:null,auditDraft:null}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2=n=>Math.round((+n||0)*100+Number.EPSILON*100)/100;
const fm=n=>r2(n).toLocaleString("en-MY",{minimumFractionDigits:2,maximumFractionDigits:2});
const cfg=()=>({...DEF,...S.cfg,company:{...DEF.company,...(S.cfg.company||{})},prefixes:{...DEF.prefixes,...(S.cfg.prefixes||{})}});
/* ---------- dates (ISO yyyy-mm-dd, calendar arithmetic in UTC) ---------- */
const P=iso=>new Date(iso+"T00:00:00Z");
const ISO=d=>d.toISOString().slice(0,10);
const add=(iso,n)=>{const d=P(iso);d.setUTCDate(d.getUTCDate()+n);return ISO(d)};
const dow=iso=>P(iso).getUTCDay();
const diffDays=(a,b)=>Math.round((P(a)-P(b))/864e5);
function today(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function weekStartOf(iso){const st=(cfg().weekEndDay+1)%7;return add(iso,-((dow(iso)-st+7)%7))}
const nice=iso=>{const d=P(iso);return `${WD[d.getUTCDay()]} ${d.getUTCDate()} ${d.toLocaleString("en-GB",{month:"short",timeZone:"UTC"})}`};
const colourOf=iso=>cfg().colours[dow(iso)];
const hexOf=name=>(cfg().colours.find(c=>c.name===name)||{}).hex||"#999";
const thumb=(id,sz=32)=>{const p=prod(id);return p.photo?`<img src="${esc(photoSrc(p.photo))}" alt="" width="${sz}" height="${sz}" style="width:${sz}px;height:${sz}px;object-fit:cover;border-radius:8px;vertical-align:middle">`:`<span aria-hidden="true" style="display:inline-grid;place-items:center;width:${sz}px;height:${sz}px;border-radius:8px;background:var(--raise);box-shadow:inset 0 0 0 1px var(--line);font:600 ${Math.round(sz/2.6)}px var(--display);color:var(--faint);vertical-align:middle">${esc((p.name||"?").slice(0,2))}</span>`};
const cake=id=>`<span style="display:inline-flex;align-items:center;gap:8px">${thumb(id,30)}<span>${esc(prod(id).name)}</span></span>`;
const dayOfColour=name=>{const i=cfg().colours.findIndex(c=>c.name===name);return i<0?"":WD[i]};
const dot=name=>`<span class="dot"><i style="background:${hexOf(name)}"></i>${esc(name)}${dayOfColour(name)?`<span style="font-weight:500;color:var(--muted)">· ${dayOfColour(name)}</span>`:""}</span>`;
/* ---------- lookups ---------- */
const partners=(all)=>Object.values(S.partners).filter(p=>all||p.active!==false).sort((a,b)=>(a.name||"").localeCompare(b.name||""));
const products=(all)=>Object.values(S.products).filter(p=>all||p.active!==false).sort((a,b)=>(a.name||"").localeCompare(b.name||""));
const prod=id=>S.products[id]||{name:id,sku:id,retail:0,shelfDays:3};
const partner=id=>S.partners[id]||{name:id,code:id,pct:70};
const wid=(pid,ws)=>`${pid}_${ws}`;
/* outlet operating hours: {wkOpen,wkClose,weOpen,weClose,closed:[dow]} — weekend = Sat/Sun */
const hoursOf=(pid,iso)=>{const h=partner(pid).hours||{};const we=[0,6].includes(dow(iso));return {open:(we?h.weOpen:h.wkOpen)||"10:00",close:(we?h.weClose:h.wkClose)||"22:00"}};
const isClosed=(pid,iso)=>((partner(pid).hours||{}).closed||[]).map(Number).includes(dow(iso));
function reportDueAt(pid,iso){const {close}=hoursOf(pid,iso);const [h,m]=close.split(":").map(Number);const d=new Date(iso+"T00:00:00");d.setHours(h,m+(+cfg().graceMin||60),0,0);if(h<6)d.setDate(d.getDate()+1);return d}
const weekDoc=(pid,ws)=>S.weeks[wid(pid,ws)]||{partnerId:pid,weekStart:ws,dos:{},days:{},settlement:null};
function priceFor(pid,prodId,date){
  const c=Object.values(S.prices).filter(x=>x.partnerId===pid&&x.productId===prodId&&x.status==="Active"&&x.from<=date&&(!x.to||x.to>=date)).sort((a,b)=>b.from.localeCompare(a.from))[0];
  if(c) return {retail:+c.retail,pct:+c.pct,net:r2(c.net??c.retail*c.pct/100),approved:true,id:c.id};
  const p=prod(prodId),pa=partner(pid);
  return {retail:+p.retail||0,pct:+pa.pct||0,net:r2((+p.retail||0)*(+pa.pct||0)/100),approved:false};
}
/* ---------- core stock + settlement engine ---------- */
let memo=new Map();
function weekOpening(pid,ws,depth=0){
  const co=cfg().cutoffDate;
  const prev=(co&&ws<=weekStartOf(co))?null:S.weeks[wid(pid,add(ws,-7))];
  if(prev&&prev.settlement&&prev.settlement.cf){
    return {src:`${prev.settlement.cfNo} (carried forward)`,srcNo:prev.settlement.cfNo,lines:prev.settlement.cf.map(l=>({...l}))};
  }
  if(prev&&depth<10&&(Object.keys(prev.dos||{}).length||Object.keys(prev.days||{}).length)){
    const c=calcWeek(pid,add(ws,-7),depth+1);
    return {src:"previous week closing (not yet billed)",srcNo:"",unbilled:true,lines:Object.values(c.keys).filter(k=>k.close>0).map(k=>({productId:k.productId,colour:k.colour,qty:k.close,rate:k.rate,batchDate:k.batchDate}))};
  }
  const op=(partner(pid).opening||[]).filter(l=>+l.qty>0);
  return {src:op.length?"opening stock (set up)":"none",srcNo:"",lines:op.map(l=>({productId:l.productId,colour:l.colour,qty:+l.qty,rate:l.rate!=null&&l.rate!==""?+l.rate:priceFor(pid,l.productId,ws).net,batchDate:l.batchDate||""}))};
}
function calcWeek(pid,ws,depth=0){
  const mk=`${pid}|${ws}`; if(memo.has(mk)) return memo.get(mk);
  const w=weekDoc(pid,ws), t=today(), opening=weekOpening(pid,ws,depth);
  const keys={}, cur={}, K=(p,c)=>p+"|"+c;
  const ensure=(p,c)=>{const k=K(p,c); if(!keys[k]) keys[k]={key:k,productId:p,colour:c,open:0,recv:0,sold:0,waste:0,variance:0,close:0,openRate:null,recvRate:null,recvGroups:{},batchDate:""}; if(cur[k]==null) cur[k]=0; return keys[k]};
  for(const l of opening.lines){const k=ensure(l.productId,l.colour);k.open+=+l.qty;k.openRate=+l.rate;cur[k.key]+=+l.qty;if(l.batchDate)k.batchDate=l.batchDate;}
  const days=[], dos=Object.values(w.dos||{});
  for(let i=0;i<7;i++){
    const date=add(ws,i), co=cfg().cutoffDate;
    if(co&&date<co){days.push({date,rep:null,status:"pre",lines:[],stock:{...cur}});continue;}
    const rep=(w.days||{})[date], lines={};
    for(const d of dos.filter(d=>d.date===date&&d.status==="delivered")){
      for(const l of d.lines||[]){const q=+(l.accepted??l.qty)||0; if(!q) continue;
        const k=ensure(l.productId,d.colour), pr=priceFor(pid,l.productId,date);
        const L=lines[k.key]||(lines[k.key]={productId:l.productId,colour:d.colour,open:cur[k.key],recv:0,sold:0,waste:0,close:null,exp:0,var:0});
        L.recv+=q; k.recv+=q; cur[k.key]+=q; k.recvRate=pr.net; k.batchDate=d.batchDate||date;
        const g=k.recvGroups[pr.net]||(k.recvGroups[pr.net]={qty:0,rate:pr.net,dos:[],approved:pr.approved}); g.qty+=q; if(!g.dos.includes(d.no)) g.dos.push(d.no);
      }
    }
    let status=date>t?"future":(rep?"got":(isClosed(pid,date)?"closed":(date===t?"today":"missing")));
    if(rep){
      const seen=new Set();
      for(const r of rep.lines||[]){
        const k=ensure(r.productId,r.colour); seen.add(k.key);
        const L=lines[k.key]||(lines[k.key]={productId:r.productId,colour:r.colour,open:cur[k.key],recv:0,sold:0,waste:0,close:null,exp:0,var:0});
        // Outlets report waste + balance only. Sold = available − waste − balance,
        // unless the office keyed the POS sold figure (r.s), which then exposes any variance.
        const wv=+r.w||0,b=+r.b||0,avail=cur[k.key],pos=(r.s===""||r.s==null)?null:+r.s;
        const s=pos!=null?pos:Math.max(0,avail-wv-b);
        L.sold+=s;L.pos=pos;L.waste+=wv;L.exp=avail-s-wv;L.close=b;L.var=b-L.exp;
        k.sold+=s;k.waste+=wv;k.variance+=L.var;cur[k.key]=b;
      }
      for(const k in cur){ if(!seen.has(k)&&cur[k]>0){const kk=keys[k];const L=lines[k]||(lines[k]={productId:kk.productId,colour:kk.colour,open:cur[k],recv:0,sold:0,waste:0,close:null,exp:cur[k],var:0});L.unreported=true;L.exp=cur[k];}}
    } else { for(const k in lines){lines[k].exp=cur[k];} }
    for(const k in cur){ if(!lines[k]&&cur[k]>0){const kk=keys[k];lines[k]={productId:kk.productId,colour:kk.colour,open:cur[k],recv:0,sold:0,waste:0,close:rep?null:null,exp:cur[k],var:0,unreported:!!rep};}}
    days.push({date,rep,status,lines:Object.values(lines).sort(sortLine),stock:{...cur}});
  }
  for(const k in keys){keys[k].close=cur[k]; keys[k].rate=keys[k].recvRate??keys[k].openRate??priceFor(pid,keys[k].productId,ws).net;}
  const res={pid,ws,we:add(ws,6),opening,keys,days,week:w}; memo.set(mk,res); return res;
}
function sortLine(a,b){return prod(a.productId).name.localeCompare(prod(b.productId).name)||a.colour.localeCompare(b.colour)}
function buildSettlement(c,opts={}){
  const pa=partner(c.pid), warns=[], inv=[], cf=[], cn=[];
  for(const l of c.opening.lines.filter(l=>+l.qty>0)) inv.push({type:"B/F",productId:l.productId,colour:l.colour,qty:+l.qty,rate:+l.rate,ref:c.opening.srcNo||""});
  for(const k of Object.values(c.keys).sort(sortLine)) for(const g of Object.values(k.recvGroups)) inv.push({type:"NEW",productId:k.productId,colour:k.colour,qty:g.qty,rate:g.rate,ref:g.dos.join(", "),approved:g.approved});
  let shortQty=0,shortVal=0,soldVal=0,wasteCharged=0;
  for(const k of Object.values(c.keys).sort(sortLine)){
    if(k.close>0) cf.push({productId:k.productId,colour:k.colour,qty:k.close,rate:cfg().cfRate==="current"?priceFor(c.pid,k.productId,c.we).net:k.rate,batchDate:k.batchDate});
    soldVal+=k.sold*k.rate;
    if(k.waste>0){
      const rule=pa.wasteRule||"credit", retail=priceFor(c.pid,k.productId,c.we).retail;
      let cr=rule==="credit"?k.rate:rule==="half"?Math.max(0,r2(k.rate-0.5*retail)):0;
      if(cr>0) cn.push({reason:"Wastage",productId:k.productId,colour:k.colour,qty:k.waste,rate:cr});
      wasteCharged+=k.waste*(k.rate-cr);
    }
    if(k.variance<0){shortQty+=-k.variance;shortVal+=-k.variance*k.rate;
      if(opts.creditShort) cn.push({reason:"Shortage (agreed)",productId:k.productId,colour:k.colour,qty:-k.variance,rate:k.rate});}
    if(k.variance>0) warns.push(["warn",`${prod(k.productId).name} ${k.colour}: outlet counted ${k.variance} more than expected — check deliveries/reports.`]);
  }
  const sum=a=>r2(a.reduce((s,l)=>s+r2(l.qty*l.rate),0));
  const totals={inv:sum(inv),cf:sum(cf),cn:sum(cn)}; totals.net=r2(totals.inv-totals.cf-totals.cn);
  const miss=c.days.filter(d=>d.status==="missing"), pend=c.days.filter(d=>d.status==="today"||d.status==="future");
  if(pend.length) warns.unshift(["info",`Week still running — reports still to come: ${pend.map(d=>nice(d.date)).join(", ")}. Bill after the week closes.`]);
  if(miss.length) warns.unshift(["bad",`Missing closing reports: ${miss.map(d=>nice(d.date)).join(", ")}. Stock for those days is assumed unchanged — chase the outlet before billing.`]);
  if(c.opening.unbilled) warns.push(["warn","The previous week was never billed; its closing stock is used as opening. Bill weeks in order."]);
  if(shortQty>0) warns.push(["warn",`${shortQty} unit(s) missing without a sale or wastage record (RM ${fm(shortVal)}). ${opts.creditShort?"Credited on the CN as agreed.":"Currently charged to the outlet — tick 'Credit shortage' if agreed otherwise."}`]);
  const unap=inv.filter(l=>l.type==="NEW"&&!l.approved);
  if(unap.length) warns.push(["warn",`${unap.length} line(s) use the default ${pa.pct}% of retail because no Active price is approved in the price register.`]);
  if(!inv.length) warns.push(["info","No stock movement for this outlet in this week."]);
  return {inv,cf,cn,totals,warns,soldVal:r2(soldVal),shortQty,shortVal:r2(shortVal),wasteCharged:r2(wasteCharged)};
}

/* ---- attention items (shared by Today tab and Claude's check) ---- */
function attention(){
  if(S.loaded.size<NCOL) return [];
  const t=today(), items=[];
  for(const p of partners()){
    // missing reports in the last 7 days (before today)
    const miss=[], noPhoto=[], now=new Date();
    for(let i=7;i>=0;i--){const d=add(t,-i); if(isClosed(p.id,d)) continue; if(i===0&&now<reportDueAt(p.id,d)) continue;
      const w=S.weeks[wid(p.id,weekStartOf(d))]; const r=w&&w.days&&w.days[d]; if(!r) miss.push(d); else if(!(r.photos||[]).length) noPhoto.push(d);}
    // only chase dates after the outlet started (first data) and after the go-live cutoff
    const first=Object.values(S.weeks).filter(w=>w.partnerId===p.id).map(w=>w.weekStart).sort()[0];
    const co=cfg().cutoffDate||"";
    const realMiss=first?miss.filter(d=>d>=first&&d>=co):[];
    if(noPhoto.length) items.push({sev:"warn",kind:"photo",pid:p.id,text:`<b>${esc(p.name)}</b> — closing report without photos: ${noPhoto.map(nice).join(", ")}`,action:`<a class="btn sm wa" href="${esc(wa(p.phone,`Hi ${p.contact||p.name} team, please send the closing photos (chiller + waste) for ${noPhoto.map(nice).join(", ")}. Thank you!`))}" target="_blank" rel="noopener">Ask for photos</a>`,go:{tab:"daily",date:noPhoto[noPhoto.length-1]}});
    if(realMiss.length) items.push({sev:"bad",kind:"report",pid:p.id,text:`<b>${esc(p.name)}</b> — no closing report for ${realMiss.map(nice).join(", ")} <span class="muted small">(closes ${hoursOf(p.id,realMiss[realMiss.length-1]).close})</span>`,action:`<a class="btn sm wa" href="${esc(wa(p.phone,chaseText(p,realMiss)))}" target="_blank" rel="noopener">Chase on WhatsApp</a>`});
    // current stock age
    const c=calcWeek(p.id,weekStartOf(t)); const lastDay=[...c.days].reverse().find(d=>d.date<=t);
    if(lastDay){ for(const k of Object.values(c.keys)){ const q=lastDay.stock[k.key]; if(!(q>0)||!k.batchDate) continue;
      const age=diffDays(t,k.batchDate), life=+prod(k.productId).shelfDays||3;
      if(age>=life) items.push({sev:"bad",kind:"expiry",pid:p.id,text:`<b>${esc(p.name)}</b> — ${q} × ${esc(prod(k.productId).name)} ${dot(k.colour)} is day ${age+1} (shelf life ${life} days): remove from display and record as wastage`});
      else if(age===life-1) items.push({sev:"warn",kind:"expiry",pid:p.id,text:`<b>${esc(p.name)}</b> — ${q} × ${esc(prod(k.productId).name)} ${dot(k.colour)} on its last day: sell first`});
    }}
    // variances last 7 days
    for(const ws of [weekStartOf(add(t,-7)),weekStartOf(t)].filter((v,i,a)=>a.indexOf(v)===i)){
      for(const d of calcWeek(p.id,ws).days){ if(d.date<add(t,-7)||d.date>t) continue;
        for(const l of d.lines) if(l.close!=null&&l.var!==0) items.push({sev:l.var<0?"warn":"info",kind:"variance",pid:p.id,text:`<b>${esc(p.name)}</b> ${nice(d.date)} — ${esc(prod(l.productId).name)} ${dot(l.colour)} count ${l.var>0?"+":""}${l.var} vs expected`,go:{tab:"daily",date:d.date}});
      }
    }
    // unbilled finished weeks & unpaid
    const cur=weekStartOf(t);
    for(const w of Object.values(S.weeks).filter(w=>w.partnerId===p.id)){
      if(w.weekStart<cur&&!w.settlement&&(Object.keys(w.dos||{}).length||Object.keys(w.days||{}).length))
        items.push({sev:"warn",kind:"bill",pid:p.id,text:`<b>${esc(p.name)}</b> — week ${nice(w.weekStart)}–${nice(add(w.weekStart,6))} ended and is not billed yet`,go:{tab:"billing",week:w.weekStart}});
      if(w.settlement&&!w.settlement.paid){const age=diffDays(t,w.settlement.issuedAt.slice(0,10)); if(age>=(+p.terms||14)) items.push({sev:"warn",kind:"ar",pid:p.id,text:`<b>${esc(p.name)}</b> — ${esc(w.settlement.invNo)} net RM ${fm(w.settlement.totals.net)} unpaid for ${age} days`,go:{tab:"billing",week:w.weekStart}});}
    }
  }
  for(const a of Object.values(S.audits)){ if(a.date<add(t,-14)) continue; const ev=evalAudit(a);
    if(ev.priceBad.length) items.push({sev:"warn",kind:"audit",pid:a.partnerId,text:`<b>${esc(partner(a.partnerId).name)}</b> audit ${nice(a.date)} — wrong sell price: ${ev.priceBad.map(x=>`${esc(x.name)} RM${fm(x.shown)} (should be RM${fm(x.approved)})`).join(", ")}`,go:{tab:"audits"}});
    if(ev.fails.length) items.push({sev:"warn",kind:"audit",pid:a.partnerId,text:`<b>${esc(partner(a.partnerId).name)}</b> audit ${nice(a.date)} — failed: ${ev.fails.map(esc).join(", ")}`,go:{tab:"audits"}});
  }
  const order={bad:0,warn:1,info:2}; return items.sort((a,b)=>order[a.sev]-order[b.sev]);
}

    <div class="row"><button class="btn" data-act="parse">Read message</button>${parsed?`<span class="small muted">${esc(parsed.summary)}</span>`:""}</div>
    ${parsed&&parsed.errors.length?`<div class="warns">${parsed.errors.map(e=>`<div class="bad">${esc(e)}</div>`).join("")}</div>`:""}
    ${parsed&&parsed.ok?`<div class="tw">${parsed.type==="report"?`<table><thead><tr><th>Cake</th><th>Batch</th><th class="r">Waste</th><th class="r">Balance</th></tr></thead><tbody>${parsed.lines.map(l=>`<tr><td>${cake(l.productId)}</td><td>${dot(l.colour)}</td><td class="r mono">${l.w}</td><td class="r mono">${l.b}</td></tr>`).join("")}</tbody></table>`:`<table><tbody><tr><td>Audit by ${esc(parsed.audit.by)} · ${parsed.audit.prices?Object.keys(parsed.audit.prices).length:0} prices · ${parsed.audit.counts.length} counts</td></tr></tbody></table>`}</div>
      <div class="row">${parsed.exists?`<span class="pill warn">A report for this outlet/date already exists — saving replaces it</span>`:""}<button class="btn pri" data-act="savePaste">Save ${parsed.type==="report"?`report for ${esc(partner(parsed.partnerId).name)}, ${nice(parsed.date)}`:"audit"}</button></div>`:""}
  </div>`;
  const lines=editing?editLines(day):day.lines;
  const tbl=lines.length?`<div class="tw"><table><thead><tr><th>Cake</th><th>Batch</th><th class="r">Age</th><th class="r">Opening</th><th class="r">Delivered</th><th class="r">Waste</th><th class="r">Balance</th><th class="r">Sold</th><th class="r">POS sold</th><th class="r">Variance</th></tr></thead><tbody>
    ${lines.map(l=>{const k=c.keys[l.productId+"|"+l.colour]||{};const age=k.batchDate?diffDays(date,k.batchDate)+1:"";const life=+prod(l.productId).shelfDays||3;
      const agePill=age===""?"":(age>life?`<span class="pill bad">day ${age}</span>`:age===life?`<span class="pill warn">day ${age}</span>`:`<span class="mono">day ${age}</span>`);
      const avail=(l.open??0)+(l.recv||0);
      if(editing){const key=`${l.productId}|${l.colour}`;const v=S.ui.dayDraft[key]||{};
        const has=v.b!==""&&v.b!=null; const sold=v.s!==""&&v.s!=null?+v.s:Math.max(0,avail-(+v.w||0)-(+v.b||0));
        const vr=has?(+v.b)-(avail-sold-(+v.w||0)):"";
        return `<tr><td>${cake(l.productId)}</td><td>${dot(l.colour)}</td><td class="r">${agePill}</td><td class="r mono">${l.open??0}</td><td class="r mono">${l.recv||0}</td>
        <td class="r"><input type="number" min="0" id="e-${key}-w" data-dd="${key}" data-k="w" value="${esc(v.w??"")}"></td><td class="r"><input type="number" min="0" id="e-${key}-b" data-dd="${key}" data-k="b" value="${esc(v.b??"")}"></td>
        <td class="r mono muted">${has?sold:""}</td><td class="r"><input type="number" min="0" id="e-${key}-s" data-dd="${key}" data-k="s" value="${esc(v.s??"")}" placeholder="opt."></td><td class="r mono ${vr<0?"neg":vr>0?"pos":""}">${vr===""||vr===0?"":(vr>0?"+":"")+vr}</td></tr>`;}
      return `<tr><td>${cake(l.productId)}</td><td>${dot(l.colour)}</td><td class="r">${agePill}</td><td class="r mono">${l.open??0}</td><td class="r mono">${l.recv||""}</td><td class="r mono">${rep&&l.close!=null?l.waste:""}</td>
        <td class="r mono">${l.close??(l.unreported?`<span class="pill warn">not counted</span>`:"—")}</td><td class="r mono">${rep&&l.close!=null?l.sold:""}</td><td class="r mono muted">${l.pos??""}</td>
        <td class="r mono ${l.var<0?"neg":l.var>0?"pos":""}">${l.close!=null&&l.var?(l.var>0?"+":"")+l.var:""}</td></tr>`}).join("")}

  return `<div class="head"><div><h1>Daily reports</h1><p class="lede">Outlets send <b>waste and balance</b> for each colour dot. Sold is worked out: opening + delivered − waste − balance. Key in the <b>POS sold</b> figure from their own closing report to cross-check. Any difference shows as a variance (missing or unrecorded cakes).</p></div></div>
    ${pasteBox}
    <div class="panel">
      <div class="spread"><div class="row">${partnerSelect("d-p",pid)}<button class="btn sm" data-day="-1" aria-label="Previous day">‹</button><input type="date" id="d-d" data-ui="date" value="${date}"><button class="btn sm" data-day="1" aria-label="Next day">›</button></div>
        <div class="row">${rep?`<span class="pill ok">Reported${rep.by?` by ${esc(rep.by)}`:""} · ${esc(rep.source||"")}</span>`:day.status==="missing"?`<span class="pill bad">Missing</span><a class="btn sm wa" target="_blank" rel="noopener" href="${esc(wa(p.phone,chaseText(p,[date])))}">Chase on WhatsApp</a>`:`<span class="pill mute">${day.status==="today"?"Due at closing":"Upcoming"}</span>`}
        ${editing?`<button class="btn sm" data-act="cancelDay">Cancel</button><button class="btn sm pri" data-act="saveDay">Save report</button>`:(c.week.settlement?`<span class="pill info">Week billed — locked</span>`:`<button class="btn sm" data-act="editDay">${rep?"Correct report":"Enter report"}</button>`)}</div></div>
      ${editing?`<div class="row"><label class="f">Reported by<input id="dd-by" data-ui="dayBy" value="${esc(S.ui.dayBy||"")}"></label><label class="f">Add a cake/colour<span class="row"><select id="dd-ap">${products().map(x=>opt(x.id,x.name,"")).join("")}</select><select id="dd-ac">${cfg().colours.map(x=>opt(x.name,x.name,"")).join("")}</select><button class="btn sm" data-act="addDayLine">Add</button></span></label></div>`:""}
      ${tbl}
      ${rep&&rep.note?`<p class="small" style="margin:0"><b>Outlet note:</b> ${esc(rep.note)}</p>`:""}
      ${rep?`<div class="spread" style="border-top:1px solid var(--line);padding-top:12px"><h3>Closing photos ${(rep.photos||[]).length?`<span class="pill ok">${rep.photos.length}</span>`:`<span class="pill bad">required — none yet</span>`}</h3>
        <div class="row">${S.assets?`<label class="btn sm">Add photos from WhatsApp<input type="file" accept="image/&#42;" multiple data-repphoto="${pid}|${date}" hidden></label>`:""}${rep.drive?driveLink(rep.drive):(S.mcp?`<button class="btn sm" data-act="fileDaily">File report + photos to Drive</button>`:"")}</div></div>
        ${(rep.photos||[]).length?`<div class="photos">${rep.photos.map(id=>`<a href="${esc(photoLink(id))}" target="_blank" rel="noopener"><img src="${esc(photoSrc(id))}" alt="Closing photo"></a>`).join("")}</div>`:`<p class="small muted" style="margin:0">Save the outlet's WhatsApp photos to your phone/computer, then add them here so they're kept with this report.</p>`}`:""}
    </div>`;
}
function editLines(day){
  const base=day.lines.map(l=>({...l}));
  for(const key of Object.keys(S.ui.dayDraft)) if(!base.find(l=>l.productId+"|"+l.colour===key)){const [pId,col]=key.split("|");base.push({productId:pId,colour:col,open:0,recv:0,exp:0,var:0});}
  return base.sort(sortLine);
}
/* parse WhatsApp text */
function parseMsg(txt){
  const out={errors:[],lines:[],ok:false}; const T=txt.replace(/\r/g,"");
  const get=re=>{const m=T.match(re);return m?m[1].trim():""};
  const code=get(/Outlet:\s*([A-Za-z0-9-]+)/i).toUpperCase(), date=get(/Date:\s*(\d{4}-\d{2}-\d{2})/i), by=get(/By:\s*(.+)/i);
  const p=partners(true).find(x=>(x.code||"").toUpperCase()===code);
  if(!p) out.errors.push(code?`Outlet code "${code}" is not set up.`:"Couldn't find 'Outlet:' in the message.");
  if(!date) out.errors.push("Couldn't find 'Date: yyyy-mm-dd' in the message.");
  const bySku=sku=>products(true).find(x=>(x.sku||"").toUpperCase()===sku.toUpperCase());
  const colOk=c=>cfg().colours.some(x=>x.name===c.toUpperCase());
  out.partnerId=p&&p.id; out.date=date; out.by=by;
  out.note=get(/Note:\s*(.+)/i).replace(/^-$/,"");
  if(/#AU1|SPOT AUDIT/i.test(T)){
    out.type="audit"; const a={partnerId:out.partnerId,date,by,time:get(/Time:\s*(\S+)/i),checks:{},prices:{},counts:[],temp:get(/TEMP:\s*([\d.]+)/i),note:out.note,source:"whatsapp"};
    for(const m of T.matchAll(/CHECK\s+(\w+):\s*(PASS|FAIL|NA)/gi)) a.checks[m[1]]=m[2].toUpperCase();
    for(const m of T.matchAll(/PRICE\s+([A-Za-z0-9-]+):\s*([\d.]+)/gi)){const pr=bySku(m[1]); if(pr) a.prices[pr.id]=+m[2]; else out.errors.push(`Unknown cake code ${m[1]}`);}
    for(const m of T.matchAll(/COUNT\s+([A-Za-z0-9-]+)\s+([A-Za-z]+):\s*(\d+)/gi)){const pr=bySku(m[1]); if(pr&&colOk(m[2])) a.counts.push({productId:pr.id,colour:m[2].toUpperCase(),n:+m[3]}); else out.errors.push(`Couldn't read count line: ${m[0]}`);}
    out.audit=a; out.summary=`Spot audit · ${p?p.name:"?"} · ${date||"?"}`;
  } else {
    out.type="report";
    for(const m of T.matchAll(/^\s*([A-Za-z0-9-]+)\s*\|\s*([A-Za-z]+)\s*\|\s*(?:S\s*(\d+)\s*)?W\s*(\d+)\s*B\s*(\d+)/gim)){
      const pr=bySku(m[1]); if(!pr){out.errors.push(`Unknown cake code "${m[1]}" — add it in Setup › Products or fix the message.`);continue;}
      if(!colOk(m[2])){out.errors.push(`Unknown colour "${m[2]}".`);continue;}
      out.lines.push({productId:pr.id,colour:m[2].toUpperCase(),w:+m[4],b:+m[5],...(m[3]!=null?{s:+m[3]}:{})});
    }
    if(!out.lines.length&&!/no stock counted/i.test(T)) out.errors.push("No cake lines found (format: SKU | COLOUR | W0 B0).");
    out.summary=`Closing report · ${p?p.name:"?"} · ${date?nice(date):"?"} · ${out.lines.length} line(s)`;
    if(p&&date){const w=S.weeks[wid(p.id,weekStartOf(date))]; out.exists=!!(w&&w.days&&w.days[date]); out.locked=!!(w&&w.settlement); if(out.locked) out.errors.push("That week is already billed. Void the bill first to change its reports.");}
  }
  out.ok=!out.errors.length||(out.type==="report"&&out.lines.length&&p&&date&&!out.locked);
  return out;
}

/* ---- BILLING ---- */
function vBilling(){
  const pid=curPartner(); if(!pid) return `<div class="empty">Add an outlet in Setup first.</div>`;
  const t=today(); const ws=S.ui.week||weekStartOf(add(t,-7)); const p=partner(pid);
  const c=calcWeek(pid,ws), w=c.week, st=w.settlement;
  const live=buildSettlement(c,{creditShort:!!S.f["creditShort_"+wid(pid,ws)]});
  const s=st||live;
  const ended=add(ws,6)<t;
  const recon=`<div class="tw"><table><thead><tr><th>Cake</th><th>Batch</th><th class="r">B/F</th><th class="r">Delivered</th><th class="r">Sold</th><th class="r">Waste</th><th class="r">Variance</th><th class="r">C/F</th><th class="r">Rate</th><th class="r">Sold value</th></tr></thead><tbody>
    ${Object.values(c.keys).sort(sortLine).map(k=>`<tr><td>${cake(k.productId)}</td><td>${dot(k.colour)}</td><td class="r mono">${k.open||""}</td><td class="r mono">${k.recv||""}</td><td class="r mono">${k.sold||""}</td><td class="r mono">${k.waste||""}</td><td class="r mono ${k.variance<0?"neg":k.variance>0?"pos":""}">${k.variance?(k.variance>0?"+":"")+k.variance:""}</td><td class="r mono">${k.close||""}</td><td class="r mono">${fm(k.rate)}</td><td class="r mono">${fm(k.sold*k.rate)}</td></tr>`).join("")||`<tr><td colspan="10" class="muted">No stock this week.</td></tr>`}
    </tbody></table></div>`;
  const cards=`<div class="docs">
    <div class="doccard"><h3>Invoice</h3><span class="code">${st?esc(st.invNo):"issued as "+esc(cfg().prefixes.INV)+"-…"}</span><span class="amt">RM ${fm(s.totals.inv)}</span><span class="small muted">B/F stock rebilled + this week's deliveries</span>${st?`<button class="btn sm" data-doc="inv">View</button>`:""}</div>
    <div class="doccard"><h3>Carry forward (credit)</h3><span class="code">${st?esc(st.cfNo):esc(cfg().prefixes.CF)+"-…"}</span><span class="amt">− RM ${fm(s.totals.cf)}</span><span class="small muted">Unsold stock, rebilled next week at the same rate</span>${st?`<button class="btn sm" data-doc="cf">View</button>`:""}</div>
    <div class="doccard"><h3>Credit note</h3><span class="code">${st?(st.cnNo?esc(st.cnNo):"not needed"):esc(cfg().prefixes.CN)+"-…"}</span><span class="amt">− RM ${fm(s.totals.cn)}</span><span class="small muted">Wastage per ${esc(p.name)}'s terms${s.cn.some(l=>l.reason!=="Wastage")?" + agreed shortage":""}</span>${st&&st.cnNo?`<button class="btn sm" data-doc="cn">View</button>`:""}</div>
    <div class="doccard" style="background:var(--accent-soft)"><h3>Net payable by outlet</h3><span class="code">${p.pct}% terms</span><span class="amt">RM ${fm(s.totals.net)}</span><span class="small muted">= sold RM ${fm(s.soldVal)}${s.wasteCharged?` + waste charged RM ${fm(s.wasteCharged)}`:""}${s.shortVal&&!(st?st.shortageCredited:S.f["creditShort_"+wid(pid,ws)])?` + shortage RM ${fm(s.shortVal)}`:""}</span></div>
  </div>`;
  const conf=S.ui.confirm;
  let actions="";
  if(!st){
    actions=`<div class="row"><label class="row small"><input type="checkbox" id="cs" data-f="creditShort_${wid(pid,ws)}" ${S.f["creditShort_"+wid(pid,ws)]?"checked":""} style="width:auto"> Credit shortage (outlet not charged for missing units)</label></div>
      ${conf==="issue"?`<div class="confirm">Issue ${esc(cfg().prefixes.INV)}, ${esc(cfg().prefixes.CF)}${live.cn.length?` and ${esc(cfg().prefixes.CN)}`:""} for ${esc(p.name)}? Numbers are assigned and the week's reports lock.<button class="btn sm pri" data-act="issue">Issue documents</button><button class="btn sm" data-act="noconfirm">Cancel</button></div>`
      :`<div class="row"><button class="btn pri" data-act="askIssue" ${live.inv.length?"":"disabled"}>Issue invoice, CF${live.cn.length?" and CN":""}</button>${!ended?`<span class="pill warn">Week still running</span>`:""}</div>`}`;
  } else {
    const nextBilled=(S.weeks[wid(pid,add(ws,7))]||{}).settlement;
    actions=`<div class="fgrid">
      <label class="f">Bukku invoice no.<input id="bk-inv" data-bk="inv" value="${esc(st.bukku?.inv||"")}" placeholder="e.g. INV-2609012"></label>
      <label class="f">Bukku CF / CN no.<input id="bk-cf" data-bk="cf" value="${esc(st.bukku?.cf||"")}"></label>
      <label class="f">Paid on<input id="pd-d" type="date" data-bk="paidDate" value="${esc(st.paid?.date||"")}"></label>

      <div class="row"><button class="btn pri" data-act="saveBk">Save Bukku refs & payment</button>${st.drive&&st.drive.inv?`${driveLink(st.drive.inv)}`:(S.mcp?`<button class="btn" data-act="fileWeek">File INV, CF${st.cnNo?", CN":""} + DOs to Drive</button>`:"")}
      ${conf==="void"?`<span class="confirm">Void these documents? They are kept in history and the week reopens.<button class="btn sm danger" data-act="void">Void</button><button class="btn sm" data-act="noconfirm">Keep</button></span>`:(nextBilled?`<span class="small muted">Next week is billed, so this week can't be voided.</span>`:`<button class="btn danger" data-act="askVoid">Void & reopen week</button>`)}
      ${st.paid&&st.paid.amount!=null&&st.paid.amount!==""?(Math.abs(+st.paid.amount-st.totals.net)<0.005?`<span class="pill ok">Paid in full</span>`:`<span class="pill warn">Paid RM ${fm(st.paid.amount)} — difference RM ${fm(st.totals.net-(+st.paid.amount))}</span>`):""}</div>
      ${Math.abs(live.totals.net-st.totals.net)>0.004?`<div class="warns"><div class="bad">Reports or deliveries changed after issue: live figures now give net RM ${fm(live.totals.net)} vs issued RM ${fm(st.totals.net)}. Void and reissue, or raise a separate adjustment.</div></div>`:""}`;
  }

/* ---- AUDITS ---- */
function evalAudit(a){
  const priceBad=[],fails=[],counts=[];
  for(const [pid,shown] of Object.entries(a.prices||{})){const ap=priceFor(a.partnerId,pid,a.date).retail; if(ap&&Math.abs(+shown-ap)>0.004) priceBad.push({name:prod(pid).name,shown:+shown,approved:ap});}
  const labels=Object.fromEntries(cfg().checks.map(c=>[c.k,c.l]));
  for(const [k,v] of Object.entries(a.checks||{})) if(v==="FAIL") fails.push(labels[k]||k);
  if(a.temp!==""&&a.temp!=null&&(+a.temp>5||+a.temp<0)) fails.push(`chiller at ${a.temp}°C`);
  const c=calcWeek(a.partnerId,weekStartOf(a.date)); const d=c.days.find(x=>x.date===a.date); const prevStock=d?(()=>{const i=c.days.indexOf(d);return i>0?c.days[i-1].stock:Object.fromEntries(c.opening.lines.map(l=>[l.productId+"|"+l.colour,l.qty]))})():{};
  for(const x of a.counts||[]){const recv=d?(d.lines.find(l=>l.productId===x.productId&&l.colour===x.colour)||{}).recv||0:0; const sys=(prevStock[x.productId+"|"+x.colour]||0)+recv; counts.push({...x,sys});}
  const n=Object.values(a.checks||{}).filter(v=>v!=="NA").length, pass=Object.values(a.checks||{}).filter(v=>v==="PASS").length;
  return {priceBad,fails,counts,score:n?Math.round(pass/n*100):null};
}
function suggestAudit(){
  const ps=partners(); if(!ps.length) return null;
  const last=pid=>Object.values(S.audits).filter(a=>a.partnerId===pid).map(a=>a.date).sort().pop()||"2000-01-01";
  const weights=ps.map(p=>Math.max(1,diffDays(today(),last(p.id))));
  let r=Math.random()*weights.reduce((a,b)=>a+b,0), pick=ps[0];
  for(let i=0;i<ps.length;i++){r-=weights[i]; if(r<=0){pick=ps[i];break;}}
  const pr=[...products()].sort(()=>Math.random()-.5).slice(0,3);
  return {partnerId:pick.id,products:pr.map(p=>p.id),lastDate:last(pick.id)};
}

/* ---------- planning engine: history → forecast → next delivery → kitchen prep ---------- */
const evList=()=>Object.values(S.calendar).sort((a,b)=>a.date.localeCompare(b.date));
const dayEvents=iso=>evList().filter(e=>iso>=e.date&&iso<=(e.end||e.date));
function dayFactor(iso){
  let f=1; const ev=dayEvents(iso); for(const e of ev) f*=1+(+e.uplift||0)/100;
  if(!ev.some(e=>e.type==="public")&&dayEvents(add(iso,1)).some(e=>e.type==="public")) f*=1+(+cfg().eveUplift||0)/100;
  return f;
}
const tradesLikeWeekend=iso=>[5,6,0].includes(dow(iso)); // Fri–Sun
function salesHistory(pid,days=28){
  const t=today(), from=add(t,-days), out={}, seen=new Set();
  for(let d=from; d<t; d=add(d,1)){ const ws=weekStartOf(d); if(seen.has(ws)) continue; seen.add(ws);
    for(const day of calcWeek(pid,ws).days){ if(day.date<from||day.date>=t||!day.rep) continue;
      const per={}; for(const l of day.lines){ if(l.close==null) continue; const x=per[l.productId]||(per[l.productId]={sold:0,waste:0,recv:0,close:0}); x.sold+=l.sold; x.waste+=l.waste; x.recv+=l.recv||0; x.close+=l.close; }
      for(const [pr,v] of Object.entries(per)) (out[pr]||(out[pr]=[])).push({date:day.date,...v,stockout:v.close===0&&v.sold>0});
    }}
  return out;
}
function forecastFor(pid,prodId,hist){
  const h=hist[prodId]||[], base=h.map(x=>({...x,b:x.sold/dayFactor(x.date)}));
  const avg=a=>a.length?a.reduce((s,x)=>s+x.b,0)/a.length:null;
  const all=avg(base); let aw=avg(base.filter(x=>!tradesLikeWeekend(x.date))), ae=avg(base.filter(x=>tradesLikeWeekend(x.date)));
  const par=+partner(pid).parDay||3, source=h.length>=5?"history":(h.length?"thin history":"starting par");
  if(aw==null) aw=all!=null?all/1.15:par; if(ae==null) ae=all!=null?all*1.25:par*1.3;
  if(h.length<5&&h.length){aw=(aw+par)/2; ae=(ae+par*1.3)/2;}
  const so=h.length?h.filter(x=>x.stockout).length/h.length:0;
  const sold=h.reduce((s,x)=>s+x.sold,0), waste=h.reduce((s,x)=>s+x.waste,0), wr=(sold+waste)?waste/(sold+waste):0;
  const boost=so>.3?1.15:1;
  return {aw,ae,so,wr,n:h.length,sold,waste,source,per:iso=>(tradesLikeWeekend(iso)?ae:aw)*dayFactor(iso)*boost};
}
function nextDeliveries(pid,from){const dd=(partner(pid).deliveryDays||[1,3,5]).map(Number);const r=[];for(let i=0;i<28&&r.length<2;i++){const d=add(from,i);if(dd.includes(dow(d))&&!isClosed(pid,d))r.push(d);}return r;}
function planOutlet(pid){
  const t=today(), p=partner(pid), hist=salesHistory(pid,28), [d1,d2]=nextDeliveries(pid,add(t,1));
  if(!d1) return {pid,lines:[],note:"No delivery days set for this outlet (Setup › Outlets)."};
  const c=calcWeek(pid,weekStartOf(t)); const ref=[...c.days].reverse().find(d=>d.date<=t&&d.rep)||[...c.days].reverse().find(d=>d.date<t)||c.days[0];
  const stock={}; for(const k of Object.values(c.keys)){const q=ref?ref.stock[k.key]:0; if(q>0)(stock[k.productId]||(stock[k.productId]=[])).push({colour:k.colour,qty:q,batch:k.batchDate||ref.date});}
  const planned=Object.values(weekDoc(pid,weekStartOf(d1)).dos||{}).filter(d=>d.date===d1);
  const ids=new Set([...Object.keys(hist),...Object.keys(stock),...Object.values(S.prices).filter(x=>x.partnerId===pid&&x.status==="Active").map(x=>x.productId),...(p.carries||[])]);
  const lines=[];
  for(const id of [...ids].filter(id=>S.products[id]&&S.products[id].active!==false).sort((a,b)=>prod(a).name.localeCompare(prod(b).name))){
    const f=forecastFor(pid,id,hist), life=+prod(id).shelfDays||3;
    let lots=(stock[id]||[]).map(x=>({...x})).sort((a,b)=>a.batch.localeCompare(b.batch));
    const stockNow=lots.reduce((s,x)=>s+x.qty,0);
    for(let d=add(ref?ref.date:t,1); d<d1; d=add(d,1)){ lots=lots.filter(x=>diffDays(d,x.batch)<life); let need=f.per(d); for(const x of lots){const u=Math.min(x.qty,need);x.qty-=u;need-=u;} }
    const span=Math.max(1,Math.min(d2?diffDays(d2,d1):life,life));
    const usable=Math.floor(lots.filter(x=>diffDays(d1,x.batch)<life-1).reduce((s,x)=>s+x.qty,0));
    let demand=0; for(let i=0;i<span;i++) demand+=f.per(add(d1,i));
    const buffer=f.wr>.15?0:(f.so>.3?.2:.1);
    const suggest=Math.max(0,Math.ceil(demand*(1+buffer)-usable));
    const notes=[]; if(f.source!=="history") notes.push(f.source==="starting par"?`no sales yet — using starting par ${p.parDay||3}/day`:`only ${f.n} days of data`);
    if(f.wr>.15) notes.push(`waste ${Math.round(f.wr*100)}% — no buffer`); if(f.so>.3) notes.push(`sold out ${Math.round(f.so*100)}% of days — +15%`);
    if(d2&&diffDays(d2,d1)>life) notes.push(`gap to next delivery (${diffDays(d2,d1)}d) is longer than shelf life`);
    lines.push({productId:id,aw:f.aw,ae:f.ae,stockNow,usable,demand,buffer,suggest,notes,wr:f.wr,n:f.n});
  }
  const hol=[]; for(let i=0;i<(d2?diffDays(d2,d1):3);i++){for(const e of dayEvents(add(d1,i))) if(!hol.includes(e)) hol.push(e);}
  return {pid,d1,d2,lines,planned,hol,prepDate:add(d1,-(+cfg().prepLeadDays||0))};
}
function wasteStats(pid,days=28){
  const h=salesHistory(pid,days); let sold=0,waste=0,recv=0,wasteRM=0,soldRM=0; const byProd=[];
  for(const [id,arr] of Object.entries(h)){const s=arr.reduce((a,x)=>a+x.sold,0),w=arr.reduce((a,x)=>a+x.waste,0),r=arr.reduce((a,x)=>a+x.recv,0),rate=priceFor(pid,id,today()).net;
    sold+=s;waste+=w;recv+=r;wasteRM+=w*rate;soldRM+=s*rate; byProd.push({id,s,w,rate});}
  return {sold,waste,recv,wasteRM,soldRM,rate:(sold+waste)?waste/(sold+waste):0,byProd:byProd.sort((a,b)=>b.w-a.w)};
}

  for(const name of parts){ path+=(path?"/":"")+name; if(cache[path]){parent=cache[path];continue;}
    const q=`title = '${name.replace(/\\/g,"\\\\").replace(/'/g,"\\'")}' and parentId = '${parent}' and mimeType = 'application/vnd.google-apps.folder'`;
    const r=await S.mcp.callTool(DRIVE,"search_files",{query:q,excludeContentSnippets:true,pageSize:5},{cache:false});
    let id=((r.payload&&r.payload.files)||[])[0]?.id;
    if(!id){const c=await S.mcp.callTool(DRIVE,"create_file",{title:name,parentId:parent,contentMimeType:"application/vnd.google-apps.folder"}); id=c.payload&&c.payload.id;}
    if(!id) throw {code:"tool_error",message:"Drive did not return a folder id"};
    cache[path]=id; parent=id; changed=true;

async function shrink(file,max=900){
  const img=await createImageBitmap(file); const k=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height); return await new Promise(r=>c.toBlob(r,"image/jpeg",.85));
}

    const no=m.kind==="do"?m.doc.no:m.st[m.kind+"No"], iso=m.kind==="do"?m.doc.date:m.st.issuedAt.slice(0,10);
    const css=[...document.querySelectorAll("style")].map(s=>s.textContent).join("\n");
    const html=`<html><head><meta charset="utf-8"><style>${css} body{background:#fff} .paper{max-width:800px;margin:0 auto}</style></head><body>${m.html}</body></html>`;
    try{const r=await GS("saveDocPdf",m.pid,m.kind,iso,`${no} — ${partner(m.pid).name}`,html); m.drive=r.url; toast(`${no} saved as PDF in the partner's Drive folder`); render();}
    catch(e){b.disabled=false; toast("Couldn't save the PDF — "+(e.message||"try again"));} return;}
  case "newAudit":{const s=S.ui.suggest||suggestAudit(); S.ui.auditDraft={partnerId:s?s.partnerId:curPartner(),date:t,time:new Date().toTimeString().slice(0,5),by:"",temp:"",checks:{},prices:{},counts:[],note:"",focus:s?s.products:[]}; render(); return;}
  case "pickAudit": S.ui.suggest=suggestAudit(); render(); return;
  case "startSuggested": return act("newAudit");
  case "cancelAudit": S.ui.auditDraft=null; render(); return;
  case "addCount":{const n=$("#au-cn").value; if(n===""){toast("Enter the counted quantity");return;} S.ui.auditDraft.counts.push({productId:$("#au-cp").value,colour:$("#au-cc").value,n:+n}); render(); return;}
  case "saveAudit":{const d=S.ui.auditDraft; const id=newId(); const prices={}; for(const [k,v] of Object.entries(d.prices)) if(v!==""&&v!=null) prices[k]=+v;
    await put(`audits/${id}`,{id,partnerId:d.partnerId,date:d.date,time:d.time,by:d.by,temp:d.temp,checks:d.checks,prices,counts:d.counts,note:d.note,source:"desk"}); S.ui.auditDraft=null; S.ui.suggest=null; toast("Audit saved"); return;}
  case "newPartner": S.ui.pEdit={id:"",code:"",name:"",pct:75,termsStatus:"Proposed",wasteRule:"credit",terms:14,active:true}; render(); return;
  case "cancelPartner": S.ui.pEdit=null; render(); return;
  case "savePartner":{const e=S.ui.pEdit; e.parDay=+e.parDay||3; e.deliveryDays=(e.deliveryDays||[1,3,5]).map(Number); e.code=(e.code||"").toUpperCase().replace(/[^A-Z0-9-]/g,""); if(!e.code||!e.name){toast("Code and name are required");return;}
    if(partners(true).some(p=>p.code===e.code&&p.id!==e.id)){toast("That code is already used");return;}
    const id=e.id||e.code.toLowerCase(); await put(`partners/${id}`,{...e,id,pct:+e.pct||0,terms:+e.terms||14,active:String(e.active)!=="false"}); S.ui.pEdit=null; toast("Outlet saved"); return;}
  case "newProduct": S.ui.prEdit={id:"",sku:"",name:"",retail:"",shelfDays:3,active:true}; render(); return;
  case "cancelProduct": S.ui.prEdit=null; render(); return;
  case "saveProduct":{const e=S.ui.prEdit; e.sku=(e.sku||"").toUpperCase().replace(/[^A-Z0-9-]/g,""); if(!e.sku||!e.name){toast("SKU and name are required");return;}
    if(products(true).some(p=>p.sku===e.sku&&p.id!==e.id)){toast("That SKU is already used");return;}
    const id=e.id||e.sku.toLowerCase(); await put(`products/${id}`,{...e,id,retail:+e.retail||0,shelfDays:+e.shelfDays||3,active:String(e.active)!=="false"}); S.ui.prEdit=null; toast("Product saved"); return;}
  case "addPrice":{const n=S.ui.priceNew||{}; if(!n.partnerId||!n.productId||!(+n.retail)||!(+n.pct)){toast("Fill outlet, product, retail and %");return;}
    const id=newId(), st=b.dataset.status; const row={id,partnerId:n.partnerId,productId:n.productId,retail:+n.retail,pct:+n.pct,net:r2(+n.retail*+n.pct/100),from:n.from||t,status:"Proposed",approvedBy:n.approvedBy||"",note:n.note||"",createdAt:t};
    await put(`prices/${id}`,row);
    if(st==="Active"){ for(const o of Object.values(S.prices)) if(o.id!==id&&o.partnerId===row.partnerId&&o.productId===row.productId&&o.status==="Active"&&o.from<=row.from) await put(`prices/${o.id}`,{...o,to:add(row.from,-1)});
      await put(`prices/${id}`,{...row,status:"Active",approvedBy:row.approvedBy||"Owner",approvedAt:t}); }
    S.ui.priceNew={partnerId:n.partnerId}; toast(st==="Active"?"Price activated":"Price saved as proposed"); return;}
  case "opAdd": S.ui.opDraft.lines.push({productId:(products()[0]||{}).id,colour:colourOf(t).name,qty:"",rate:"",batchDate:t}); render(); return;
  case "opSave":{const pid=S.ui.opDraft.pid; const lines=S.ui.opDraft.lines.filter(l=>+l.qty>0).map(l=>({productId:l.productId,colour:l.colour,qty:+l.qty,rate:l.rate===""||l.rate==null?null:+l.rate,batchDate:l.batchDate||""}));
    await put(`partners/${pid}`,{...S.partners[pid],opening:lines}); toast("Opening stock saved"); return;}
  case "saveGeneral":{const g=S.ui.gen; const num=(v,d)=>v===""||v==null||isNaN(+v)?d:+v;
    if(g.mode==="live"&&!g.cutoffDate){toast("Set the cutoff date before going live");return;}
    await put("config/settings",{mode:g.mode||"testing",cutoffDate:g.cutoffDate||"",prepLeadDays:num(g.prepLeadDays,0),graceMin:num(g.graceMin,60),eveUplift:num(g.eveUplift,10),driveRootId:g.driveRootId||DEF.driveRootId,company:g.company,colours:g.colours,weekEndDay:+g.weekEndDay,prefixes:g.prefixes,cfRate:g.cfRate,fieldFormUrl:g.fieldFormUrl,auditFormUrl:g.auditFormUrl,chaleurWhatsApp:g.chaleurWhatsApp,reportDeadline:g.reportDeadline,checks:g.checks}); S.ui.gen=null; toast("Settings saved"); return;}
  case "clearSample":{for(const w of Object.values(S.weeks)) if(w.sample) await del(`weeks/${wid(w.partnerId,w.weekStart)}`);
    for(const p of Object.values(S.partners)) if(p.sample) await del(`partners/${p.id}`);
    for(const x of Object.values(S.prices)) if(x.sample) await del(`prices/${x.id}`);
    for(const a of Object.values(S.audits)) if(a.sample) await del(`audits/${a.id}`);
    if(S.alerts&&S.alerts.sample) await del("alerts/latest"); S.ui.confirm=null; toast("Sample data removed"); return;}
  }
}
/* ---------- boot (Google Apps Script backend) ---------- */
const AUTH={pin:null,name:"",role:""};
const GS=(fn,...a)=>new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej({code:"unavailable",message:(e&&e.message)||String(e)}))[fn](AUTH.pin,...a));
const photoSrc=id=>!id?"":(/^https?:/.test(id)?id:"https:\/\/drive.google.com/thumbnail?id="+encodeURIComponent(id)+"&sz=w400");
const photoLink=id=>!id?"":(/^https?:/.test(id)?id:"https:\/\/drive.google.com/file/d/"+encodeURIComponent(id)+"/view");
const DBX={cache:{},subs:[]};
function snapFor(col){const docs=Object.entries(DBX.cache[col]||{}).map(([id,d])=>({id,exists:true,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}}));return {docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false},docChanges:()=>[]};}
function fire(col){for(const s of DBX.subs) if(!col||s.col===col) s.fn(snapFor(s.col));}
const shimDB={
  collection(col){return {onSnapshot(fn){DBX.subs.push({col,fn});setTimeout(()=>fn(snapFor(col)),0);return ()=>{};}};},
  doc(path){const [col,id]=path.split("/");return {
    get:async()=>{const d=(DBX.cache[col]||{})[id];return {id,exists:!!d,data:()=>d};},
    set:async(data)=>{const c=JSON.parse(JSON.stringify(data));(DBX.cache[col]=DBX.cache[col]||{})[id]=c;fire(col);await GS("dbPut",col,id,c);},
    update:async(data)=>{const c={...((DBX.cache[col]||{})[id]||{}),...JSON.parse(JSON.stringify(data))};(DBX.cache[col]=DBX.cache[col]||{})[id]=c;fire(col);await GS("dbPut",col,id,c);},
    delete:async()=>{if(DBX.cache[col])delete DBX.cache[col][id];fire(col);await GS("dbDel",col,id);}
  };}
};
const shimAssets={upload:async(blob)=>{const du=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob);});const r=await GS("uploadPhoto",du,"photo");return {id:r.id,url:r.url};}};
function vStaff(){
  if(!MGR()) return `<div class="empty">Only managers can manage staff.</div>`;
  if(!S.team){ if(!S.teamLoading){S.teamLoading=true; GS("teamList").then(r=>{S.team=r;S.teamLoading=false;render();}).catch(e=>{S.teamLoading=false;S.team=[];toast(e.message);});} return `<div class="empty">Loading staff…</div>`; }
  const ed=S.ui.stEdit, roleTxt={owner:"Owner — full access",manager:"Manager — full access + staff",office:"Office — edit desk + audits",auditor:"Team — view desk + audits"};
  const form=ed?`<div class="panel"><div class="spread"><h2>${ed.row?"Edit staff":"Add staff"}</h2><button class="btn sm" data-stcancel="1">Cancel</button></div>
    <div class="fgrid"><label class="f">Name<input id="st-name" data-st="name" value="${esc(ed.name||"")}" autocomplete="off"></label>
      <label class="f">Login code (FeedMe staff code)<input id="st-code" data-st="code" inputmode="numeric" maxlength="6" value="${esc(ed.code||"")}" autocomplete="off"></label>
      <label class="f">Access<select id="st-role" data-st="role">${["auditor","office","manager"].map(r=>`<option value="${r}" ${ed.role===r?"selected":""}>${roleTxt[r]}</option>`).join("")}</select></label>
      <label class="f">Notes<input id="st-notes" data-st="notes" value="${esc(ed.notes||"")}"></label></div>
    <div class="row"><button class="btn pri" data-stsave="1">Save</button><span class="small">They can sign in as soon as you save.</span></div></div>`:"";
  const rows=S.team.map(x=>`<tr><td><b>${esc(x.name)}</b>${x.notes?`<div class="small">${esc(x.notes)}</div>`:""}</td><td>${esc(x.code)}</td><td>${esc(roleTxt[x.role]||x.role)}</td>
    <td>${x.active?`<span class="pill ok">Active</span>`:`<span class="pill mute">Inactive</span>`}</td>
    <td class="r">${x.role==="owner"?`<span class="small">Owner</span>`:`<button class="btn sm" data-stedit="${x.row}">Edit</button> <button class="btn sm" data-sttog="${x.row}">${x.active?"Deactivate":"Activate"}</button>`}</td></tr>`).join("");
  return `<h1>Staff</h1><p class="lede">Who can sign in. Team members can view the desk (prep, deliveries, reports) and do spot audits; office staff can also edit; managers can also manage staff. Deactivate someone to stop their login — their past records stay.</p>
    ${form}<div class="panel"><div class="spread"><h2>Team</h2>${ed?"":`<button class="btn pri sm" data-stnew="1">+ Add staff</button>`}</div>
    <div class="tw"><table><thead><tr><th>Name</th><th>Code</th><th>Access</th><th>Status</th><th></th></tr></thead><tbody>${rows||`<tr><td colspan="5" class="small">No staff yet.</td></tr>`}</tbody></table></div></div>`;
}
async function stSave(rec){ try{ S.team=await GS("teamSave",rec); S.ui.stEdit=null; toast("Staff saved"); render(); }catch(e){ toast(e.message); } }
document.addEventListener("input",e=>{const k=e.target&&e.target.dataset&&e.target.dataset.st; if(k&&S.ui.stEdit) S.ui.stEdit[k]=e.target.value;});
async function reload(){try{DBX.cache=await GS("dbLoadAll");fire();}catch(e){toast("Couldn't refresh — "+e.message);}}
function showLogin(msg){
  $("#main").innerHTML=`<div class="panel" style="max-width:380px;margin:40px auto"><h1 style="font-size:30px">Office login</h1><p class="lede">Enter your office PIN. Outlet and audit staff use their own links.</p>
    <label class="f">PIN<input id="lg-pin" type="password" inputmode="numeric" autocomplete="off"></label>
    <div class="row"><button class="btn pri" id="lg-go">Sign in</button><span class="small neg">${esc(msg||"")}</span></div></div>`;
  const go=async()=>{AUTH.pin=$("#lg-pin").value.trim(); if(!AUTH.pin) return; $("#lg-go").disabled=true;
    try{const u=await GS("login"); AUTH.name=u.name; AUTH.role=u.role; try{sessionStorage.setItem("chaleur.pin",AUTH.pin)}catch(_){} start();}
    catch(e){AUTH.pin=null; showLogin(e.message);}};
  $("#lg-go").onclick=go; $("#lg-pin").addEventListener("keydown",e=>{if(e.key==="Enter")go();}); setTimeout(()=>{const x=$("#lg-pin");x&&x.focus()},50);
}
async function start(){
  $("#main").innerHTML=`<div class="empty">Loading consignment data…</div>`;
  try{DBX.cache=await GS("dbLoadAll");}catch(e){AUTH.pin=null;try{sessionStorage.removeItem("chaleur.pin")}catch(_){} return showLogin(e.message);}
  S.db=shimDB; S.assets=shimAssets; S.dl=null; S.mcp=null;
  const sub=(col,fn)=>shimDB.collection(col).onSnapshot(snap=>{fn(snap);S.loaded.add(col);render();});
  const into=(key)=>s=>{const o={};for(const d of s.docs)o[d.id]={...d.data(),id:d.data().id||d.id};S[key]=o;};
  sub("config",s=>{S.cfg={};S.counters={};S.drive={folders:{}};for(const d of s.docs){if(d.id==="settings")S.cfg=d.data()||{};if(d.id==="counters")S.counters=d.data()||{};}});
  sub("calendar",into("calendar"));
  sub("partners",into("partners")); sub("products",into("products")); sub("prices",into("prices"));
  sub("weeks",into("weeks")); sub("audits",into("audits"));
  sub("alerts",s=>{const d=s.docs.find(x=>x.id==="latest");S.alerts=d?d.data():null;});
  setInterval(()=>{const a=document.activeElement; if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)) return; reload();},90000);
  render();
}
(function boot(){
  let saved=null; try{saved=sessionStorage.getItem("chaleur.pin")}catch(_){}
  if(saved){AUTH.pin=saved; GS("login").then(u=>{AUTH.name=u.name;AUTH.role=u.role;start();}).catch(()=>{AUTH.pin=null;showLogin();});}
  else showLogin();
})();
