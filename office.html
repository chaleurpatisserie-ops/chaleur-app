<script>
/* Chaleur sign-in (phone + PIN, remember me, log out) and the in-app helper. Shared by the office desk, kitchen and audit pages. */
const CA=(function(){
  const K="chaleur.s", ROLE={owner:"Owner",manager:"Manager",office:"Office",supervisor:"Kitchen supervisor",kitchen:"Kitchen",auditor:"Team"};
  const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const rd=st=>{try{const v=st.getItem(K);return v?JSON.parse(v):null}catch(e){return null}};
  function clear(){try{localStorage.removeItem(K)}catch(e){} try{sessionStorage.removeItem(K)}catch(e){} try{sessionStorage.removeItem("chaleur.pin")}catch(e){}}
  function get(){const s=rd(sessionStorage)||rd(localStorage); if(s&&(!s.t||(s.exp&&Date.now()>s.exp))){clear();return null;} return s;}
  function save(s){clear(); try{(s.remember?localStorage:sessionStorage).setItem(K,JSON.stringify(s));}catch(e){}}
  /* v20: access ticks. Old saved sign-ins (before v20) only know their role: use that role's usual ticks until the page refreshes them. */
  const LEG={owner:"kitchen kapprove todo qc deliv doedit chase audit view money reports setup bills problems staff admin",manager:"kitchen kapprove todo qc deliv doedit chase audit view money reports setup bills problems staff admin",
    office:"kitchen todo deliv doedit chase audit view money reports setup problems",supervisor:"kitchen kapprove todo qc deliv doedit chase",kitchen:"kitchen qc deliv",auditor:"kitchen audit view money"};
  const LEGA={owner:"office",manager:"office",office:"office",supervisor:"kitchen",kitchen:"kitchen",auditor:"outlets"};
  const permsOf=s=>s?(Array.isArray(s.perms)?s.perms:String(LEG[s.role]||LEG.auditor).split(" ")):[];
  const labelOf=s=>s?(s.label||ROLE[s.role]||s.role||""):"";
  const areaOf=s=>s?(s.area||LEGA[s.role]||"outlets"):"";
  const can=p=>permsOf(get()).includes(p);
  /* keep the saved sign-in in step with the server (access can change while someone is signed in) */
  function update(u){ const c=get(); if(!c||!u) return c; const n=Object.assign({},c,{name:u.name||c.name,role:u.role||c.role,perms:u.perms||c.perms,label:u.label||c.label,area:u.area||c.area,as:u.as!=null?u.as:c.as}); save(n); return n; }
  const run=(fn,...a)=>new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e instanceof Error?e:new Error((e&&e.message)||String(e))))[fn](...a));
  const isAuthErr=e=>/sign in again|expired/i.test((e&&e.message)||"");
  function loginForm(el,opt,done){
    opt=opt||{}; let last=""; try{last=localStorage.getItem("chaleur.lastid")||"";}catch(e){}
    el.innerHTML=`<div class="ca-login"><h2>${esc(opt.title||"Sign in")}</h2><p>${esc(opt.lede||"Use your phone number and your staff PIN.")}</p>
      <label>Phone number (or name)<input id="ca-id" type="text" autocomplete="username" autocapitalize="characters" spellcheck="false" placeholder="012-345 6789" value="${esc(last)}"></label>
      <label>PIN<input id="ca-pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="6"></label>
      <label class="ca-rem"><input id="ca-rem" type="checkbox"> Remember me on this phone for 30 days</label>
      <button class="ca-go" id="ca-go" type="button">Sign in</button><div class="ca-err" id="ca-err" role="alert">${esc(opt.msg||"")}</div>
      <p style="font-size:12.5px;margin-top:8px">No phone number set up yet? Type your name instead. Don't tick "Remember me" on a shared phone or computer.</p></div>`;
    const q=s=>el.querySelector(s), btn=q("#ca-go"), err=q("#ca-err");
    const go=async()=>{const id=q("#ca-id").value.trim(), pin=q("#ca-pin").value.trim(), rem=q("#ca-rem").checked;
      if(!id||!pin){err.textContent="Enter your phone number and PIN.";return;}
      btn.disabled=true; err.textContent="Signing in…";
      try{const r=await run("login",id,pin,rem); const s={t:r.token,name:r.name,role:r.role,exp:r.exp,remember:!!r.remember,perms:r.perms,label:r.label,area:r.area}; save(s);
        try{ if(rem) localStorage.setItem("chaleur.lastid",id); else localStorage.removeItem("chaleur.lastid"); }catch(e){}
        el.innerHTML=""; done(s);}
      catch(e){btn.disabled=false; err.textContent=(e&&e.message)||"Couldn't sign in."; q("#ca-pin").value=""; q("#ca-pin").focus();}};
    btn.onclick=go; q("#ca-pin").addEventListener("keydown",e=>{if(e.key==="Enter")go();}); q("#ca-id").addEventListener("keydown",e=>{if(e.key==="Enter")q("#ca-pin").focus();});
    setTimeout(()=>{const x=q(last?"#ca-pin":"#ca-id"); x&&x.focus();},50);
  }
  const HOME="index.html";
  /* One sign-in page for everything: other pages send you to the home page and it brings you back. */
  function toLogin(msg){ const here=(location.pathname.split("/").pop()||HOME)+location.search+location.hash; location.replace(HOME+"?next="+encodeURIComponent(here)+(msg?"&msg="+encodeURIComponent(msg):"")); }
  function logout(){const s=get(); clear(); if(s){try{run("logout",s.t).catch(()=>{});}catch(e){}} setTimeout(()=>location.replace(HOME),150);}
  /* Owner: "View as" any team member, to see exactly what they see without signing out */
  let VAL=null, VALP=null;
  const canView=()=>{ const c=get(); return !!(c&&(c.as||c.role==="owner")); };
  function loadVA(){ const c=get(); if(!c||VALP) return VALP; VALP=run("viewList",c.t).then(r=>{ VAL=r||[]; document.querySelectorAll("select[data-ca-viewas]").forEach(el=>{ el.innerHTML=vaOpts(); }); return VAL; }).catch(()=>{ VALP=null; }); return VALP; }
  const vaOpts=()=>{ const c=get()||{}; const cur=c.as||""; const list=VAL||[];
    return `<option value="owner" ${!cur?"selected":""}>${cur?"Back to Owner":"View as…"}</option>`+(VAL?"":`<option disabled>Loading the team…</option>`)+list.map(x=>`<option value="${esc(x.name)}" ${cur&&cur.toUpperCase()===String(x.name).toUpperCase()?"selected":""}>${esc(x.name)} · ${esc(x.label)}</option>`).join(""); };
  const vaSelect=()=>{ if(canView()) setTimeout(loadVA,0); return `<select class="ca-va" data-ca-viewas="1" aria-label="See the app as a team member">${vaOpts()}</select>`; };
  const chip=s=>s?`<span class="ca-chip"><span class="ca-si">Signed in as </span><b>${esc(s.name)}</b><span class="ca-rl"> · ${esc(labelOf(s))}</span>${canView()?" "+vaSelect():""} <button type="button" data-ca-logout="1">Log out</button></span>`:"";
  async function switchView(who){ const c=get(); if(!c) return; document.body.style.opacity=".5";
    try{ const r=await run("viewAs",c.t,who); save({t:r.token,name:r.name,role:r.role,exp:r.exp,remember:!!r.remember,as:r.as||"",perms:r.perms,label:r.label,area:r.area}); location.reload(); }
    catch(e){ document.body.style.opacity=""; alertBar((e&&e.message)||"Couldn't switch."); } }
  function alertBar(m){ const d=document.createElement("div"); d.className="ca-vabar"; d.setAttribute("role","alert"); d.textContent=m; document.body.prepend(d); setTimeout(()=>d.remove(),5000); }
  document.addEventListener("change",e=>{ const t=e.target; if(t&&t.matches&&t.matches("[data-ca-viewas]")) switchView(t.value); });
  document.addEventListener("click",e=>{ const b=e.target&&e.target.closest&&e.target.closest("[data-ca-viewback]"); if(b){ e.preventDefault(); switchView("owner"); } });
  /* While viewing as another role, a strip at the top of every page says so */
  function vaStrip(){ const c=get(); if(!c||!c.as||document.getElementById("ca-vastrip")) return; const d=document.createElement("div"); d.id="ca-vastrip"; d.className="ca-vabar";
    d.innerHTML=`<span>👁 You're seeing the app as <b>${esc(c.as)}</b> (${esc(labelOf(c))}). Changes you make are recorded as ${esc(c.name)}.</span><span class="ca-vact">${vaSelect()}<button type="button" data-ca-viewback="1">Back to Owner</button></span>`; document.body.prepend(d);
    const fit=()=>document.documentElement.style.setProperty("--vah",d.offsetHeight+"px"); fit(); if(window.ResizeObserver) new ResizeObserver(fit).observe(d); window.addEventListener("resize",fit); }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",vaStrip); else setTimeout(vaStrip,0);
  /* Where a "what to do next" item goes: page + tab (#hash) + kitchen team */
  const nextHref=g=>g?(g.page+(g.team?"?team="+encodeURIComponent(g.team):"")+(g.hash?"#"+g.hash:"")):"";
  const nextList=(items,links)=>`<ul class="ca-next">${(items||[]).map(x=>`<li><i class="${esc(x.sev)}"></i><span>${links&&x.go?`<a href="${esc(nextHref(x.go))}">${esc(x.text)}</a>`:esc(x.text)}</span></li>`).join("")}</ul>`;
  document.addEventListener("click",e=>{const b=e.target&&e.target.closest&&e.target.closest("[data-ca-logout]"); if(b){e.preventDefault(); b.disabled=true; logout();}});
  /* Report a problem: what's wrong (same list as the server). Short names are used in My reports. */
  const FBK=[["app","App not working","App problem"],["numbers","Wrong numbers","Wrong numbers"],["equipment","Equipment broken","Equipment"],["stock","Stock / ingredients","Stock"],["safety","Food safety","Food safety"],["idea","Idea / other","Idea"]];
  const fbl=k=>(FBK.find(x=>x[0]===k)||["","Other","Other"]);
  const FBS={open:"New",doing:"Being fixed",done:"✓ Done"};
  /* Photo for a report: made smaller (max 1280 px, JPEG) so it sends fast on a phone */
  const shrink=file=>new Promise((res,rej)=>{ const r=new FileReader(); r.onerror=()=>rej(new Error("Couldn't read the photo.")); r.onload=()=>{ const im=new Image(); im.onerror=()=>rej(new Error("Couldn't read the photo."));
    im.onload=()=>{ const k=Math.min(1,1280/Math.max(im.width,im.height)), c=document.createElement("canvas"); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext("2d").drawImage(im,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",.8)); };
    im.src=r.result; }; r.readAsDataURL(file); });
  let openHelp=()=>{};
  /* Sent with every report, so we know where it happened: the page, the link, the phone, and the last message on screen */
  const LAST={t:"",at:0};
  const note=t=>{ t=String(t||"").replace(/\s+/g," ").trim(); if(t&&!/^(Saving|Sending|Loading|Signing in|Checking)/i.test(t)){ LAST.t=t.slice(0,200); LAST.at=Date.now(); } };
  function watchMsgs(){ if(watchMsgs.on||!document.body) return; watchMsgs.on=1;
    window.addEventListener("error",e=>note("Error: "+(e.message||""))); window.addEventListener("unhandledrejection",e=>note("Error: "+((e.reason&&e.reason.message)||e.reason||"")));
    try{ new MutationObserver(ms=>{ for(const m of ms){ const n=m.target.nodeType===1?m.target:m.target.parentElement; const el=n&&n.closest&&n.closest("#toast,#status,[role=alert],[role=status],.err"); if(el&&!el.closest(".ca-hp")&&!el.hidden) note(el.textContent); } }).observe(document.body,{childList:true,subtree:true,characterData:true}); }catch(e){} }
  const device=()=>{ const u=navigator.userAgent||""; return [/iPhone|iPad|iPod/.test(u)?"iPhone/iPad":/Android/.test(u)?"Android":/Mac/.test(u)?"Mac":/Windows/.test(u)?"Windows":"Other",
    /Edg\//.test(u)?"Edge":/CriOS|Chrome\//.test(u)?"Chrome":/FxiOS|Firefox/.test(u)?"Firefox":/Safari/.test(u)?"Safari":"Browser", (window.innerWidth||0)+"px"].join(" · "); };
  const recent=()=>LAST.t&&Date.now()-LAST.at<15*60*1000?LAST.t:"";
  const cap=w=>w?w.charAt(0).toUpperCase()+w.slice(1).toLowerCase():"";
  const hm=iso=>{ try{ return new Date(iso).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:"Asia/Kuala_Lumpur"}); }catch(e){ return ""; } };
  const dayTxt=iso=>{ try{ const f=d=>d.toLocaleDateString("en-CA",{timeZone:"Asia/Kuala_Lumpur"}), d=new Date(iso), t=new Date(), y=new Date(Date.now()-864e5);
    return f(d)===f(t)?"today "+hm(iso):f(d)===f(y)?"yesterday "+hm(iso):d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",timeZone:"Asia/Kuala_Lumpur"}); }catch(e){ return ""; } };
  function helper(opt){
    if(document.getElementById("ca-hbtn")) return;
    watchMsgs();
    const b=document.createElement("button"); b.id="ca-hbtn"; b.className="ca-hbtn"; b.type="button"; b.textContent="? Ask"; b.setAttribute("aria-label","Ask the helper a question or report a problem"); b.setAttribute("aria-expanded","false");
    document.body.appendChild(b);
    let panel=null, bd=null, H=[], busy=false, VIEW="ask";
    const R0=()=>({type:"",text:"",photo:"",urgent:false,busy:false,err:"",sent:null});
    let FB=R0(), MINE=null, MINEB=false;
    const hi=opt.hello||"Hi! Ask me how to do anything in this app. For example: “How do I send the closing report?” or “Why can't I mark the delivery as delivered?” You can write in English, Malay or Chinese.";
    let NX=null, NXB=false;
    const tok=()=>{ const au=opt.auth&&opt.auth(); return au&&/^s1\./.test(String(au))?au:(au||""); };
    const plain=t=>String(t||"").replace(/\*\*(.+?)\*\*/g,"$1").replace(/^#+\s*/gm,"").replace(/^\s*[-*]\s+/gm,"• ").replace(/\n{3,}/g,"\n\n").trim();
    const first=()=>{ const s0=get(); return cap(String((s0&&s0.name)||(NX&&NX.name)||"").split(" ")[0]); };
    const pageName=()=>opt.page?opt.page():document.title;
    function loadMine(force){ const au=tok(); if(!au||MINEB||(MINE&&!force)) return; MINEB=true; run("feedbackMine",au).then(r=>{MINE=r||[];}).catch(()=>{MINE=MINE||[];}).then(()=>{MINEB=false; paint();}); }
    function mineCount(){ if(!MINE||!MINE.length) return ""; const d=MINE.filter(x=>x.status==="doing").length, n=MINE.filter(x=>x.status==="open").length; return [d?d+" being fixed":"",n?n+" new":""].filter(Boolean).join(" · ")||MINE.length+" done"; }
    function head(){ if(VIEW==="mine") return `<div class="ca-hd" style="justify-content:flex-start;gap:12px"><button type="button" class="ca-back" data-hv="fb" aria-label="Back">‹</button><div class="ca-ttl" style="flex:1"><small>Helper</small>My reports</div><button type="button" class="ca-x" aria-label="Close helper">✕</button></div>`;
      return `<div class="ca-hd"><span class="ca-ttl">Helper</span><button type="button" class="ca-x" aria-label="Close helper">✕</button></div>
        ${opt.noReport?"":`<div class="ca-tabs" role="tablist"><button type="button" role="tab" data-hv="ask" aria-selected="${VIEW==="ask"}">Ask a question</button><button type="button" role="tab" data-hv="fb" aria-selected="${VIEW==="fb"}">Report a problem</button></div>`}`; }
    function askHtml(){
      const nx=NX&&NX.items&&NX.items.length?`<div class="ca-m ca-a"><b>Hi ${esc(cap(String(NX.name||"").split(" ")[0]))}! Next for you:</b>${nextList(NX.items,true)}<div style="margin-top:6px">Tap an item to go there, or ask me how to do it.</div></div>`:(NXB?`<div class="ca-m ca-a">Checking what's next for you…</div>`:"");
      return `<div class="ca-body"><div class="ca-msgs" aria-live="polite">${nx}<div class="ca-m ca-a">${esc(hi)}${opt.noReport?"":`<div style="margin-top:6px"><a class="ca-lnk" href="index.html#guide">Open the how-to guide ›</a></div>`}</div>${H.map(x=>x.q!=null?`<div class="ca-m ca-q">${esc(x.q)}</div>`:`<div class="ca-m ca-a" style="white-space:pre-wrap">${esc(plain(x.a))}</div>`).join("")}${busy?`<div class="ca-m ca-a">Thinking…</div>`:""}</div></div>
        <div class="ca-foot"><form class="ca-askf"><textarea rows="1" placeholder="Ask a question…" aria-label="Your question"></textarea><button type="submit">Send</button></form></div>`; }
    function fbHtml(){
      if(FB.sent){ const x=FB.sent;
        return `<div class="ca-body"><div class="ca-done" role="status"><span class="ca-tick" aria-hidden="true">✓</span><div class="ca-thx">Thanks, ${esc(first()||"there")}. We got it.</div>
          <div style="font-size:15px;color:var(--muted,#6f5f62);line-height:1.5">Your report <b style="color:var(--ink,#2b1b1e)">#${esc(x.ref)}</b> went to the office. ${x.urgent?"Marked urgent: your supervisor gets a WhatsApp now.":"You'll see replies in My reports."}</div>
          <div class="ca-sum"><div style="font-weight:600">${esc(fbl(x.type)[1])}${x.urgent?" · Urgent":""}</div><div style="color:var(--muted,#6f5f62);margin-top:2px;white-space:pre-wrap">${esc(x.text||(x.photo?"No description, photo only":"No description"))}</div><div style="color:var(--muted,#6f5f62);font-size:12px;margin-top:6px">From: ${esc(x.page)} · ${esc(hm(x.at))}</div></div>
          <button type="button" class="ca-lnk" data-hv="mine">See my reports ›</button></div></div>
          <div class="ca-foot"><button type="button" class="ca-sec56" data-fbreset="1">Report something else</button><button type="button" class="ca-pri56" data-fbclose="1">Back to my work</button></div>`; }
      const lm=recent(), mc=mineCount();
      return `<div class="ca-body">
        <div><div class="ca-eb">What's wrong?</div><div class="ca-types">${FBK.map(([k,l])=>`<button type="button" data-fbt="${k}" aria-pressed="${FB.type===k}">${esc(l)}</button>`).join("")}</div></div>
        <div><div class="ca-eb">Tell us in one line (any language)</div><textarea class="ca-ft" placeholder="e.g. Freezer 2 door doesn't close / Send button stuck" aria-label="What happened">${esc(FB.text)}</textarea></div>
        <div class="ca-ph"><div class="ca-thumb">${FB.photo?`<img src="${esc(FB.photo)}" alt="Your photo"><button type="button" data-fbnophoto="1" aria-label="Remove photo">✕</button>`:"photo"}</div><label class="ca-phb">${FB.photo?"Change photo":"Add photo / screenshot"}<input type="file" accept="image/*" class="ca-fp" hidden></label></div>
        <button type="button" class="ca-urg" data-fburg="1" aria-pressed="${FB.urgent}"><i aria-hidden="true">${FB.urgent?"✓":""}</i><span><b>Urgent</b>: it stops my work right now</span></button>
        <p class="ca-note">We attach the page you were on (<b>${esc(pageName())}</b>) and your name, so you don't need to explain where.${lm?` We also attach the last message on your screen: “${esc(lm)}”.`:""}</p>
        ${FB.err?`<p class="ca-err" role="alert">${esc(FB.err)}</p>`:""}
        ${mc?`<button type="button" class="ca-lnk" data-hv="mine">My reports · ${esc(mc)} ›</button>`:""}</div>
        <div class="ca-foot"><button type="button" class="ca-go60" data-fbsend="1" ${!FB.type||FB.busy?"disabled":""}>${FB.busy?"Sending…":FB.type?"Send report":"Pick what's wrong first"}</button></div>`; }
    function mineHtml(){
      const list=MINE==null?`<p class="ca-note">Loading your reports…</p>`:!MINE.length?`<p class="ca-note">No reports yet. When you report a problem, you'll see here what happens to it.</p>`:
        MINE.map(x=>`<div class="ca-rc ${x.status==="done"?"done":""}"><div class="ca-rt"><b>${esc(fbl(x.kind)[2])}${x.urgent?" · Urgent":""}</b><span class="ca-pill ${esc(x.status)}">${esc(FBS[x.status]||x.status)}</span></div>

function buildSettlement(c,opts={}){

  const tally=cakeTally(c), decided=(c.week&&c.week.tally)||{}; let openTally=0;
  for(const o of Object.values(tally).sort((a,b)=>prod(a.productId).name.localeCompare(prod(b.productId).name))){ if(!o.extra) continue; const dcs=decided[o.productId];
    if(dcs&&dcs.decision==="bill"){ const k=Object.values(c.keys).find(k=>k.productId===o.productId), rate=(k&&k.rate)||priceFor(c.pid,o.productId,c.we).net, col=(o.extras[0]&&o.extras[0].cols[0])||(k&&k.colour)||"";
      inv.push({type:"NEW",productId:o.productId,colour:col,qty:o.extra,rate,ref:"Counted at outlet · "+o.extras.map(x=>x.ref||nice(x.date)).join(", "),approved:true,tally:true}); }

  let shortQty=0,shortVal=0,soldVal=0,wasteCharged=0;
  for(const k of Object.values(c.keys).sort(sortLine)){
    if(k.close>0) cf.push({productId:k.productId,colour:k.colour,qty:k.close,rate:cfg().cfRate==="current"?priceFor(c.pid,k.productId,c.we).net:k.rate,batchDate:k.batchDate});

  }

  const tallyLines=Object.values(tally).filter(o=>o.extra>0);
  const miss=c.days.filter(d=>d.status==="missing"), pend=c.days.filter(d=>d.status==="today"||d.status==="future");
  if(pend.length) warns.unshift(["info",`Week still running — reports still to come: ${pend.map(d=>nice(d.date)).join(", ")}. Bill after the week closes.`]);
  if(miss.length) warns.unshift(["bad",`Missing closing reports: ${miss.map(d=>nice(d.date)).join(", ")}. Stock for those days is assumed unchanged — chase the outlet before billing.`]);
  if(c.opening.unbilled) warns.push(["warn","The previous week was never billed; its closing stock is used as opening. Bill weeks in order."]);
  if(shortQty>0) warns.push(["warn",`${shortQty} unit(s) missing without a sale or wastage record (RM ${fm(shortVal)}). ${opts.creditShort?"Credited on the CN as agreed.":"Currently charged to the outlet — tick 'Credit shortage' if agreed otherwise."}`]);

  if(!inv.length) warns.push(["info","No stock movement for this outlet in this week."]);
  return {inv,cf,cn,totals,warns,soldVal:r2(soldVal),shortQty,shortVal:r2(shortVal),wasteCharged:r2(wasteCharged),tally:tallyLines,tallyDecided:decided};
}

function colourFixes(day){ const out=[], byP={}; for(const l of day.lines){ (byP[l.productId]||(byP[l.productId]=[])).push(l); }
  const note=String((day.rep||{}).note||""), claim=(pid,col)=>new RegExp(String(prod(pid).name).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+":? outlet says the sticker is "+col,"i").test(note);
  for(const l of day.lines){ const avail=(l.open??0)+(l.recv||0), n=(l.close||0)+(l.waste||0); if(avail>0||!n||l.close==null) continue;
    const cands=(byP[l.productId]||[]).filter(x=>x!==l&&((x.open??0)+(x.recv||0))>0);
    const empty=cands.find(x=>!(x.close||0)&&!(x.waste||0)), to=empty||cands.slice().sort((a,b)=>((b.open??0)+(b.recv||0))-((a.open??0)+(a.recv||0)))[0]||null, said=claim(l.productId,l.colour);
    out.push({from:{productId:l.productId,colour:l.colour,b:l.close||0,w:l.waste||0},claim:said,to:to?{productId:to.productId,colour:to.colour,sure:!!empty&&!said}:null}); }
  return out; }

/* ---- v22.6 Numbers · made & waste (Alfred 29 Sep: "a page to see all the numbers, including wastages, prepared … mainly to track wastage and produced").

function nmState(){ const u=S.ui.nm||(S.ui.nm={mode:"week",anchor:today(),who:""}); if(!u.anchor) u.anchor=today(); return u; }

      const has=((prev||{})[id]||{}).b||0, sold=has+(+m[id]||0)-out-per[id].w-per[id].b; r.hqSold=(r.hqSold||0)+Math.max(0,sold); r.hqSoldDays++; } }

    .filter(r=>r.toMake||r.made||r.waste||r.sold||r.hqLeft||r.oLeftAll).sort((a,b)=>(CATS.indexOf(catOf(prod(a.id)))-CATS.indexOf(catOf(prod(b.id))))||prod(a.id).name.localeCompare(prod(b.id).name));

/* one outlet, one cake, over a range (for the outlet-only view) */
function calcOne(pid,id,from,to){ let sold=0,waste=0,rej=0; const weeks=[...new Set((()=>{const a=[];for(let d=from;d<=to;d=add(d,1)) a.push(weekStartOf(d));return a;})())];
  for(const ws of weeks){ const c=calcWeek(pid,ws); for(const dd of c.days){ if(dd.date<from||dd.date>to||!dd.rep) continue; for(const L of dd.lines) if(L.productId===id){ sold+=+L.sold||0; waste+=+L.waste||0; } }
    for(const o of Object.values(weekDoc(pid,ws).dos||{})){ if(o.status!=="delivered"||o.date<from||o.date>to) continue; for(const l of o.lines||[]) if(l.productId===id) rej+=Math.max(0,(+l.qty||0)-(+(l.accepted??l.qty)||0)); } }
  return {sold,waste,rej}; }
function calcOneTotal(pid,from,to){ let waste=0; for(const id of Object.keys(S.products)) waste+=calcOne(pid,id,from,to).waste; return {waste}; }

function billCards(ws,cur){

function evalAudit(a){
  const priceBad=[],fails=[],counts=[];
  for(const [pid,shown] of Object.entries(a.prices||{})){const ap=priceFor(a.partnerId,pid,a.date).retail; if(ap&&Math.abs(+shown-ap)>0.004) priceBad.push({name:prod(pid).name,shown:+shown,approved:ap});}
  const labels=Object.fromEntries(cfg().checks.map(c=>[c.k,c.l]));
  for(const [k,v] of Object.entries(a.checks||{})) if(v==="FAIL") fails.push(labels[k]||k);
  if(a.temp!==""&&a.temp!=null&&(+a.temp>5||+a.temp<0)) fails.push(`chiller at ${a.temp}°C`);
  const c=calcWeek(a.partnerId,weekStartOf(a.date)); const d=c.days.find(x=>x.date===a.date); const prevStock=d?(()=>{const i=c.days.indexOf(d);return i>0?c.days[i-1].stock:Object.fromEntries(c.opening.lines.map(l=>[l.productId+"|"+l.colour,l.qty]))})():{};
  for(const x of a.counts||[]){const recv=d?(d.lines.find(l=>l.productId===x.productId&&l.colour===x.colour)||{}).recv||0:0; const sys=(prevStock[x.productId+"|"+x.colour]||0)+recv; counts.push({...x,sys});}
  const n=Object.values(a.checks||{}).filter(v=>v!=="NA").length, pass=Object.values(a.checks||{}).filter(v=>v==="PASS").length;
  return {priceBad,fails,counts,score:n?Math.round(pass/n*100):null};
}
function suggestAudit(){
  const ps=partners().filter(p=>!p.internal); if(!ps.length) return null;
  const last=pid=>Object.values(S.audits).filter(a=>a.partnerId===pid).map(a=>a.date).sort().pop()||"2000-01-01";
  const weights=ps.map(p=>Math.max(1,diffDays(today(),last(p.id))));
  let r=Math.random()*weights.reduce((a,b)=>a+b,0), pick=ps[0];
  for(let i=0;i<ps.length;i++){r-=weights[i]; if(r<=0){pick=ps[i];break;}}
  const pr=[...products()].sort(()=>Math.random()-.5).slice(0,3);
  return {partnerId:pick.id,products:pr.map(p=>p.id),lastDate:last(pick.id)};
}

r if one exists, otherwise it is used when the DOs are drafted (a changed number is underlined; the suggestion stays in the tooltip). When To make or Made is lower than the suggestion, online orders are filled first; then every outlet gets at least one of each flavour it carries and the rest goes to the place that sells it faster ("→N" beside a box shows the new number). When it is higher, the extra goes to the HQ display. Whole cakes follow each outlet's whole-cake setting in Setup › Outlets (usually Fri–Sun, 1–2 kinds, 1 of each, every ticked whole cake taking its turn). Mark every prepared/thawed cake with the dot of the prep day. Lead time: ${+cfg().prepLeadDays||0} day(s) before delivery (change in Setup › Go-live & rules). ${(+cfg().prepLeadDays||0)>0?"":`Until ${+(cfg().planSwitchHour??14)}:00 this page shows today's delivery; after that, the next one.`}</p>

const DRIVE="Google Drive";
const TYPE_FOLDER={inv:"Invoices",cf:"Carry Forward",cn:"Credit Notes",do:"Delivery Orders",daily:"Daily Reports",audit:"Audits",photo:"Photos"};
function driveErr(e){const c=e&&e.code;return c==="server_not_connected"?"Connect Google Drive in claude.ai Settings → Connectors, then try again.":c==="needs_reauth"?"Reconnect Google Drive in claude.ai Settings → Connectors.":c==="not_in_manifest"?"Google Drive access is turned off for this page — allow it and try again.":c==="selection_required"?"Choose which Google Drive account to use in the prompt, then try again.":c==="not_granted"||c==="capability_disabled"?"Drive filing isn't available in this view.":`Drive said: ${(e&&e.message)||"unknown error"}`}
async function driveFolder(parts){
  if(!S.mcp) throw {code:"capability_disabled"};
  let parent=cfg().driveRootId, path=""; const cache={...(S.drive.folders||{})}; let changed=false;
  for(const name of parts){ path+=(path?"/":"")+name; if(cache[path]){parent=cache[path];continue;}
    const q=`title = '${name.replace(/\\/g,"\\\\").replace(/'/g,"\\'")}' and parentId = '${parent}' and mimeType = 'application/vnd.google-apps.folder'`;
    const r=await S.mcp.callTool(DRIVE,"search_files",{query:q,excludeContentSnippets:true,pageSize:5},{cache:false});
    let id=((r.payload&&r.payload.files)||[])[0]?.id;
    if(!id){const c=await S.mcp.callTool(DRIVE,"create_file",{title:name,parentId:parent,contentMimeType:"application/vnd.google-apps.folder"}); id=c.payload&&c.payload.id;}
    if(!id) throw {code:"tool_error",message:"Drive did not return a folder id"};
    cache[path]=id; parent=id; changed=true;
  }
  if(changed){S.drive.folders=cache; await put("config/drive",{...S.drive,folders:cache});}
  return parent;
}
function drivePath(pid,iso,kind){const p=partner(pid);return [p.legalName||p.name,`${p.name} (${p.code})`,iso.slice(0,7),TYPE_FOLDER[kind]]}
async function driveUploadHtml(pid,iso,kind,title,html){
  const parent=await driveFolder(drivePath(pid,iso,kind));
  const r=await S.mcp.callTool(DRIVE,"create_file",{title,parentId:parent,textContent:`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title></head><body>${html}</body></html>`,contentMimeType:"text/html"});
  return r.payload&&(r.payload.viewUrl||r.payload.id)||"";
}
async function driveUploadPhoto(pid,iso,title,assetId){
  const parent=await driveFolder(drivePath(pid,iso,"photo"));
  const blob=await (await fetch("/_blob/"+assetId)).blob();
  const b64=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(",")[1]);fr.onerror=rej;fr.readAsDataURL(blob);});
  const r=await S.mcp.callTool(DRIVE,"create_file",{title,parentId:parent,base64Content:b64,contentMimeType:blob.type||"image/jpeg",disableConversionToGoogleType:true});
  return r.payload&&(r.payload.viewUrl||r.payload.id)||"";
}

async function shrink(file,max=900){
  const img=await createImageBitmap(file); const k=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);

}

function cardify(root){ if(!root) return; root.querySelectorAll("table").forEach(tb=>{ if(tb.dataset.cf||tb.closest(".nocard")) return; const hs=[...tb.querySelectorAll("thead th")]; if(hs.length<3) return;

   shown as cards; on a bigger screen a table that is wider than its frame becomes cards too, instead of hiding columns off to the side. */
function fitTables(root){ if(!root) return; const phone=matchMedia("(max-width:640px)").matches;
  const tbs=[...root.querySelectorAll("table.cf, table[data-fit]")]; tbs.forEach(tb=>tb.classList.remove("cards"));
  for(const tb of tbs){ if(phone){ tb.classList.add("cards"); continue; } const w=tb.parentElement; if(!w||!tb.offsetWidth) continue;
    if(tb.offsetWidth>w.clientWidth+2||w.scrollWidth>w.clientWidth+2) tb.classList.add("cards"); } }
{ let ft=null; const refit=()=>{ clearTimeout(ft); ft=setTimeout(()=>{ fitTables(document.getElementById("main")); fitTables(document.getElementById("modal")); },120); };
  window.addEventListener("resize",refit); window.addEventListener("orientationchange",refit);
  document.addEventListener("toggle",e=>{ if(e.target&&e.target.tagName==="DETAILS"&&e.target.open) fitTables(e.target); },true);

  const sub=(col,fn)=>shimDB.collection(col).onSnapshot(snap=>{fn(snap);S.loaded.add(col);render();});
  const into=(key)=>s=>{const o={};for(const d of s.docs)o[d.id]={...d.data(),id:d.data().id||d.id};S[key]=o;};
  sub("config",s=>{S.cfg={};S.counters={};S.orders={};S.drive={folders:{}};for(const d of s.docs){if(d.id==="settings")S.cfg=d.data()||{};if(d.id==="counters")S.counters=d.data()||{};if(d.id==="handled")S.handled=d.data()||{};if(d.id==="prep")S.prep=d.data()||{};if(d.id==="orders")S.orders=d.data()||{};}});
  sub("calendar",into("calendar"));
  sub("partners",into("partners")); sub("products",into("products")); sub("prices",into("prices"));
  sub("weeks",into("weeks")); sub("audits",into("audits"));
  sub("alerts",s=>{const d=s.docs.find(x=>x.id==="latest");S.alerts=d?d.data():null;});
  setInterval(()=>{ if(!AUTH.pin) return; const a=document.activeElement; if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)) return; reload();},90000);
  render();
}
