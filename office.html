<script>
/* Chaleur sign-in (phone + PIN, remember me, log out) and the in-app helper. Shared by the office desk, kitchen and audit pages. */
const CA=(function(){
  const K="chaleur.s", ROLE={owner:"Owner",manager:"Manager",office:"Office",supervisor:"Kitchen supervisor",kitchen:"Kitchen",auditor:"Team"};
  const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const rd=st=>{try{const v=st.getItem(K);return v?JSON.parse(v):null}catch(e){return null}};
  function clear(){try{localStorage.removeItem(K)}catch(e){} try{sessionStorage.removeItem(K)}catch(e){} try{sessionStorage.removeItem("chaleur.pin")}catch(e){}}
  function get(){const s=rd(sessionStorage)||rd(localStorage); if(s&&(!s.t||(s.exp&&Date.now()>s.exp))){clear();return null;} return s;}
  function save(s){clear(); try{(s.remember?localStorage:sessionStorage).setItem(K,JSON.stringify(s));}catch(e){}}
  const run=(fn,...a)=>new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e instanceof Error?e:new Error((e&&e.message)||String(e))))[fn](...a));
  const isAuthErr=e=>/sign in again|expired/i.test((e&&e.message)||"");
  function loginForm(el,opt,done){
    opt=opt||{}; let last=""; try{last=localStorage.getItem("chaleur.lastid")||"";}catch(e){}
    el.innerHTML=`<div class="ca-login"><h2>${esc(opt.title||"Sign in")}</h2><p>${esc(opt.lede||"Use your phone number and your staff PIN.")}</p>
      <label>Phone number (or name)<input id="ca-id" type="text" autocomplete="username" autocapitalize="characters" spellcheck="false" placeholder="012-345 6789" value="${esc(last)}"></label>
      <label>PIN<input id="ca-pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="6"></label>
      <label class="ca-rem"><input id="ca-rem" type="checkbox"> Remember me on this phone for 30 days</label>
      <button class="ca-go" id="ca-go" type="button">Sign in</button><div class="ca-err" id="ca-err" role="alert">${esc(opt.msg||"")}</div>
      <p style="font-size:12.5px;margin-top:8px">No phone number set up yet? Type your name instead. Don't tick "Remember me" on a shared phone or computer.</p></div>`;
    const q=s=>el.querySelector(s), btn=q("#ca-go"), err=q("#ca-err");
    const go=async()=>{const id=q("#ca-id").value.trim(), pin=q("#ca-pin").value.trim(), rem=q("#ca-rem").checked;
      if(!id||!pin){err.textContent="Enter your phone number and PIN.";return;}
      btn.disabled=true; err.textContent="Signing in…";
      try{const r=await run("login",id,pin,rem); const s={t:r.token,name:r.name,role:r.role,exp:r.exp,remember:!!r.remember}; save(s);
        try{ if(rem) localStorage.setItem("chaleur.lastid",id); else localStorage.removeItem("chaleur.lastid"); }catch(e){}
        el.innerHTML=""; done(s);}
      catch(e){btn.disabled=false; err.textContent=(e&&e.message)||"Couldn't sign in."; q("#ca-pin").value=""; q("#ca-pin").focus();}};
    btn.onclick=go; q("#ca-pin").addEventListener("keydown",e=>{if(e.key==="Enter")go();}); q("#ca-id").addEventListener("keydown",e=>{if(e.key==="Enter")q("#ca-pin").focus();});
    setTimeout(()=>{const x=q(last?"#ca-pin":"#ca-id"); x&&x.focus();},50);
  }
  const HOME="index.html";
  /* One sign-in page for everything: other pages send you to the home page and it brings you back. */
  function toLogin(msg){ const here=(location.pathname.split("/").pop()||HOME)+location.search+location.hash; location.replace(HOME+"?next="+encodeURIComponent(here)+(msg?"&msg="+encodeURIComponent(msg):"")); }
  function logout(){const s=get(); clear(); if(s){try{run("logout",s.t).catch(()=>{});}catch(e){}} setTimeout(()=>location.replace(HOME),150);}
  /* Owner: "View as" another role, to see each person's screens without signing out */
  const VA=[["owner","Owner (you)"],["manager","Manager"],["office","Office"],["supervisor","Kitchen supervisor"],["kitchen","Kitchen"],["auditor","Team"]];
  const canView=()=>{ const c=get(); return !!(c&&(c.as||c.role==="owner")); };
  const vaSelect=()=>{ const c=get()||{}; return `<select class="ca-va" data-ca-viewas="1" aria-label="See the app as">${VA.map(([v,l])=>`<option value="${v}" ${(c.as||"owner")===v?"selected":""}>${v==="owner"?l:"View as "+l}</option>`).join("")}</select>`; };
  const chip=s=>s?`<span class="ca-chip"><span class="ca-si">Signed in as </span><b>${esc(s.name)}</b><span class="ca-rl"> · ${esc(ROLE[s.role]||s.role)}</span>${canView()?" "+vaSelect():""} <button type="button" data-ca-logout="1">Log out</button></span>`:"";
  async function switchView(role){ const c=get(); if(!c) return; document.body.style.opacity=".5";
    try{ const r=await run("viewAs",c.t,role); save({t:r.token,name:r.name,role:r.role,exp:r.exp,remember:!!r.remember,as:r.as||""}); location.reload(); }
    catch(e){ document.body.style.opacity=""; alertBar((e&&e.message)||"Couldn't switch."); } }
  function alertBar(m){ const d=document.createElement("div"); d.className="ca-vabar"; d.setAttribute("role","alert"); d.textContent=m; document.body.prepend(d); setTimeout(()=>d.remove(),5000); }
  document.addEventListener("change",e=>{ const t=e.target; if(t&&t.matches&&t.matches("[data-ca-viewas]")) switchView(t.value); });
  document.addEventListener("click",e=>{ const b=e.target&&e.target.closest&&e.target.closest("[data-ca-viewback]"); if(b){ e.preventDefault(); switchView("owner"); } });
  /* While viewing as another role, a strip at the top of every page says so */
  function vaStrip(){ const c=get(); if(!c||!c.as||document.getElementById("ca-vastrip")) return; const d=document.createElement("div"); d.id="ca-vastrip"; d.className="ca-vabar";
    d.innerHTML=`<span>👁 You're seeing the app as <b>${esc(ROLE[c.as]||c.as)}</b>. Changes you make are recorded as ${esc(c.name)}.</span><span class="ca-vact">${vaSelect()}<button type="button" data-ca-viewback="1">Back to Owner</button></span>`; document.body.prepend(d); }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",vaStrip); else setTimeout(vaStrip,0);
  /* Where a "what to do next" item goes: page + tab (#hash) + kitchen team */
  const nextHref=g=>g?(g.page+(g.team?"?team="+encodeURIComponent(g.team):"")+(g.hash?"#"+g.hash:"")):"";
  const nextList=(items,links)=>`<ul class="ca-next">${(items||[]).map(x=>`<li><i class="${esc(x.sev)}"></i><span>${links&&x.go?`<a href="${esc(nextHref(x.go))}">${esc(x.text)}</a>`:esc(x.text)}</span></li>`).join("")}</ul>`;
  document.addEventListener("click",e=>{const b=e.target&&e.target.closest&&e.target.closest("[data-ca-logout]"); if(b){e.preventDefault(); b.disabled=true; logout();}});
  /* Report a problem: what's wrong (same list as the server). Short names are used in My reports. */
  const FBK=[["app","App not working","App problem"],["numbers","Wrong numbers","Wrong numbers"],["equipment","Equipment broken","Equipment"],["stock","Stock / ingredients","Stock"],["safety","Food safety","Food safety"],["idea","Idea / other","Idea"]];
  const fbl=k=>(FBK.find(x=>x[0]===k)||["","Other","Other"]);
  const FBS={open:"New",doing:"Being fixed",done:"✓ Done"};
  /* Photo for a report: made smaller (max 1280 px, JPEG) so it sends fast on a phone */
  const shrink=file=>new Promise((res,rej)=>{ const r=new FileReader(); r.onerror=()=>rej(new Error("Couldn't read the photo.")); r.onload=()=>{ const im=new Image(); im.onerror=()=>rej(new Error("Couldn't read the photo."));

          <div style="font-size:15px;color:var(--muted,#6f5f62);line-height:1.5">Your report <b style="color:var(--ink,#2b1b1e)">#${esc(x.ref)}</b> went to the office. ${x.urgent?"Marked urgent: your supervisor gets a WhatsApp now.":"You'll see replies in My reports."}</div>

        <div><div class="ca-eb">Tell us in one line (any language)</div><textarea class="ca-ft" placeholder="e.g. Freezer 2 door doesn't close / Send button stuck" aria-label="What happened">${esc(FB.text)}</textarea></div>

  colours:[{name:"BLACK",hex:"#1e1e1e"},{name:"ORANGE",hex:"#f08a24"},{name:"YELLOW",hex:"#f2c53d"},{name:"GREEN",hex:"#3c9a52"},{name:"BLUE",hex:"#2f6fd0"},{name:"RED",hex:"#d63333"},{name:"PURPLE",hex:"#8b4fc6"}],

};

const P=iso=>new Date(iso+"T00:00:00Z");

const products=(all)=>Object.values(S.products).filter(p=>all||p.active!==false).sort((a,b)=>(a.name||"").localeCompare(b.name||""));

const CATS=["Petit gâteau","Cheesecake","Whole cake","Whole cheesecake"], CATL={"Petit gâteau":"Petit gâteau","Cheesecake":"Cheesecake (slice)","Whole cake":"Whole cake (entremet)","Whole cheesecake":"Whole cheesecake"};

function wholeOf(p){const d=wholeDef(p), w={...d,...((p&&p.whole)||{})}, num=(v,dv)=>{v=Math.round(+v); return isFinite(v)?v:dv;};
  w.max=Math.max(0,Math.min(6,num(w.max,d.max))); w.min=Math.max(0,Math.min(w.max,num(w.min,d.min))); w.each=Math.max(1,Math.min(5,num(w.each,d.each)));
  if(!WHOLE_MODES.some(m=>m[0]===w.mode)) w.mode=d.mode; return w;}
const wholeDaysOf=p=>((p&&p.wholeDays)||cfg().wholeDays||[5,6,0]).map(Number);
const daysTxt=a=>{const o=[1,2,3,4,5,6,0].filter(i=>a.includes(i)); return o.length===7?"every day":o.length?o.map(i=>WD[i]).join(" "):"no days";};

const seedR=(...a)=>{let h=2166136261; for(const ch of a.join("|")){h^=ch.charCodeAt(0); h=Math.imul(h,16777619)>>>0;} h^=h>>>15; h=Math.imul(h,2246822507)>>>0; h^=h>>>13; h=Math.imul(h,3266489909)>>>0; h^=h>>>16; return (h>>>0)/4294967296;};

function wholeSent(pid,before){const last={}; let ld="";
  for(const w of Object.values(S.weeks)){ if(w.partnerId!==pid) continue;

function sortLine(a,b){return prod(a.productId).name.localeCompare(prod(b.productId).name)||a.colour.localeCompare(b.colour)}
function buildSettlement(c,opts={}){

const plain=h=>String(h||"").replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim();
function missingCause(pid,date,productId,qty,rep){
  const life=+prod(productId).shelfDays||3;
  const dos=allDOs().filter(d=>d.partnerId===pid&&d.date<=date&&d.date>=add(date,-2)&&(d.lines||[]).some(l=>l.productId===productId&&+l.qty));
  const open=dos.filter(d=>d.status!=="delivered");
  if(open.length) return {kind:"do",text:`Delivery ${open.map(d=>esc(d.no)).join(", ")} is not marked delivered. Check the outlet really received all of them (Deliveries › Mark delivered with the accepted count).`};
  const c=calcWeek(pid,weekStartOf(date)), day=c.days.find(x=>x.date===date), exp=[];
  if(day) for(const l of day.lines){ if(l.productId!==productId) continue; const k=c.keys[l.productId+"|"+l.colour]; if(k&&k.batchDate&&diffDays(date,k.batchDate)>=life&&!(l.waste>0)) exp.push(l.colour); }
  if(exp.length) return {kind:"waste",text:`${exp.join(", ")} was past shelf life that day but no waste was entered, so it was probably thrown away. Choose Wasted.`};
  const odd=((rep&&rep.lines)||[]).filter(l=>l.productId===productId&&(()=>{const k=c.keys[l.productId+"|"+l.colour];return !k||!(k.open||k.recv);})());
  if(odd.length) return {kind:"colour",text:`${odd.map(l=>esc(l.colour)).join(", ")} was counted but we have no record of sending it. Colour dots may be mixed up; ask the outlet to recount by colour.`};
  return {kind:"none",none:true,text:"No clear cause found, so it is billed as sold."};
}
function attention(){

    for(let i=7;i>=0&&!hq;i--){const d=add(t,-i); if(isClosed(p.id,d)) continue; if(i===0&&now<reportDueAt(p.id,d)) continue;
      const w=S.weeks[wid(p.id,weekStartOf(d))]; const r=w&&w.days&&w.days[d]; if(!r) miss.push(d); else if(!(r.photos||[]).length) noPhoto.push(d);}
    const first=Object.values(S.weeks).filter(w=>w.partnerId===p.id).map(w=>w.weekStart).sort()[0];

    if(noPhoto.length) push({sev:"warn",kind:"photo",key:`photo|${p.id}|${noPhoto.join(",")}`,pid:p.id,text:`<b>${esc(p.name)}</b> — closing report without photos: ${noPhoto.map(nice).join(", ")}`,action:`<a class="btn sm wa" href="${esc(wa(p.phone,`Hi ${p.contact||p.name} team, please send the closing photos (chiller + waste) for ${noPhoto.map(nice).join(", ")}. Thank you!`))}" target="_blank" rel="noopener">Ask for photos</a>`,go:{tab:"daily",date:noPhoto[noPhoto.length-1]}});
    if(realMiss.length) push({sev:"bad",kind:"report",key:`report|${p.id}|${realMiss.join(",")}`,pid:p.id,text:`<b>${esc(p.name)}</b> — no closing report for ${realMiss.map(nice).join(", ")} <span class="muted small">(closes ${hoursOf(p.id,realMiss[realMiss.length-1]).close})</span>`,action:`<a class="btn sm wa" href="${esc(wa(p.phone,chaseText(p,realMiss)))}" target="_blank" rel="noopener">Chase on WhatsApp</a>`});
    for(let i=7;i>=0&&!hq;i--){const dd=add(t,-i); const ww=S.weeks[wid(p.id,weekStartOf(dd))]; const rr=ww&&ww.days&&ww.days[dd]; if(rr&&(rr.photoCheck||[]).some(x=>!x.ok)) push({sev:"warn",kind:"photocheck",key:`pchk|${p.id}|${dd}`,pid:p.id,text:`<b>${esc(p.name)}</b> ${nice(dd)} — photo doesn't look right: ${rr.photoCheck.filter(x=>!x.ok).map(x=>`${esc(x.label)} (${esc(x.why)})`).join(", ")}`,go:{tab:"daily",date:dd}});
      if(!rr||!rr.check) continue;
      if(rr.readOk){ for(const c of rr.check.filter(c=>c.diff)){ const nm=esc(prod(c.productId).name);
          if(c.diff>0){ const cause=missingCause(p.id,dd,c.productId,c.diff,rr);
            push({sev:"warn",kind:"missing",key:`miss|${p.id}|${dd}|${c.productId}`,pid:p.id,text:`<b>${esc(p.name)}</b> ${nice(dd)} — ${c.diff} × ${nm} not accounted for (sales photo vs count)`,tip:`<b>Likely cause:</b> ${cause.text} Choose where the ${c.diff>1?"cakes":"cake"} went: <b>Sold</b> (billed, the default), <b>Wasted</b> (thrown away but not entered) or <b>Remaining</b> (still in the chiller, miscounted).`,fix:{pid:p.id,date:dd,productId:c.productId,qty:c.diff,kind:"missing",opts:["sold","wasted","remaining"]},go:{tab:"daily",date:dd}}); }
          else push({sev:"info",kind:"extra",key:`extra|${p.id}|${dd}|${c.productId}`,pid:p.id,text:`<b>${esc(p.name)}</b> ${nice(dd)} — ${nm}: ${-c.diff} more counted than we sent`,go:{tab:"daily",date:dd}});
        } }
      else if((rr.salesPhotos||[]).length) push({sev:"info",kind:"salesread",key:`sread|${p.id}|${dd}`,pid:p.id,text:`<b>${esc(p.name)}</b> ${nice(dd)} — sales photo not read automatically: open the report and check it`,go:{tab:"daily",date:dd}});}
    const c=calcWeek(p.id,weekStartOf(t)); const lastDay=[...c.days].reverse().find(d=>d.date<=t);
    if(lastDay){ for(const k of Object.values(c.keys)){ const q=lastDay.stock[k.key]; if(!(q>0)||!k.batchDate) continue;
      const age=diffDays(t,k.batchDate), life=+prod(k.productId).shelfDays||3;
      if(age>=life) push({sev:"bad",kind:"expiry",key:`exp|${p.id}|${t}|${k.productId}|${k.colour}`,pid:p.id,text:`<b>${esc(p.name)}</b> — ${q} × ${esc(prod(k.productId).name)} ${dot(k.colour)} is day ${age+1} (shelf life ${life} days): remove from display and record as wastage`,fix:{pid:p.id,date:t,productId:k.productId,colour:k.colour,qty:q,kind:"expiry",opts:["wasted","sold","remaining"]}});
      else if(age===life-1) push({sev:"warn",kind:"last",key:`last|${p.id}|${t}|${k.productId}|${k.colour}`,pid:p.id,text:`<b>${esc(p.name)}</b> — ${q} × ${esc(prod(k.productId).name)} ${dot(k.colour)} on its last day: sell first`});
    }}
    for(const ws of [weekStartOf(add(t,-7)),weekStartOf(t)].filter((v,i,a)=>a.indexOf(v)===i)){
      for(const d of calcWeek(p.id,ws).days){ if(d.date<add(t,-7)||d.date>t) continue;
        for(const l of d.lines) if(l.close!=null&&l.var!==0) push({sev:l.var<0?"warn":"info",kind:l.var>0?"extra":"variance",key:`var|${p.id}|${d.date}|${l.productId}|${l.colour}`,pid:p.id,text:`<b>${esc(p.name)}</b> ${nice(d.date)} — ${esc(prod(l.productId).name)} ${dot(l.colour)} count ${l.var>0?"+":""}${l.var} vs expected`,go:{tab:"daily",date:d.date}});
      }
    }
    const cur=weekStartOf(t);
    for(const w of Object.values(S.weeks).filter(w=>w.partnerId===p.id&&!hq)){
      if(w.weekStart<cur&&!w.settlement&&(Object.keys(w.dos||{}).length||Object.keys(w.days||{}).length))
        push({sev:"warn",kind:"bill",key:`bill|${p.id}|${w.weekStart}`,pid:p.id,text:`<b>${esc(p.name)}</b> — week ${nice(w.weekStart)}–${nice(add(w.weekStart,6))} ended: the bill is drafted and waiting for approval`,go:{tab:"billing",week:w.weekStart}});
      if(w.settlement&&(w.afterBill||[]).length){const ab=w.afterBill; push({sev:"warn",kind:"afterbill",key:`afterbill|${p.id}|${w.weekStart}|${ab.length}`,pid:p.id,text:`<b>${esc(p.name)}</b> — week ${nice(w.weekStart)}–${nice(add(w.weekStart,6))} was changed after the bill was issued (${ab.length} change${ab.length>1?"s":""}, last by ${esc(ab[ab.length-1].by||"")})`,go:{tab:"billing",week:w.weekStart}});}
      for(const lr of (w.lateReports||[]).filter(x=>x.date>=add(t,-30))) push({sev:"warn",kind:"late",key:`late|${p.id}|${lr.recId||lr.date}`,pid:p.id,text:`<b>${esc(p.name)}</b> — report for ${nice(lr.date)} arrived after the week was billed${lr.by?` (by ${esc(lr.by)})`:""}`,go:{tab:"billing",week:w.weekStart}});
      if(w.settlement&&!w.settlement.paid){const age=diffDays(t,w.settlement.issuedAt.slice(0,10)); if(age>=(+p.terms||14)) push({sev:"warn",kind:"ar",key:`ar|${p.id}|${w.weekStart}`,pid:p.id,text:`<b>${esc(p.name)}</b> — ${esc(w.settlement.invNo)} net RM ${fm(w.settlement.totals.net)} unpaid for ${age} days`,go:{tab:"billing",week:w.weekStart}});}
    }
  }
  for(const a of Object.values(S.audits)){ if(a.date<add(t,-14)) continue; const ev=evalAudit(a);
    if(ev.priceBad.length) push({sev:"warn",kind:"audit",key:`auditp|${a.id}`,pid:a.partnerId,text:`<b>${esc(partner(a.partnerId).name)}</b> audit ${nice(a.date)} — wrong sell price: ${ev.priceBad.map(x=>`${esc(x.name)} RM${fm(x.shown)} (should be RM${fm(x.approved)})`).join(", ")}`,go:{tab:"audits"}});
    if(ev.fails.length) push({sev:"warn",kind:"audit",key:`auditf|${a.id}`,pid:a.partnerId,text:`<b>${esc(partner(a.partnerId).name)}</b> audit ${nice(a.date)} — failed: ${ev.fails.map(esc).join(", ")}`,go:{tab:"audits"}});
  }

  return items.filter(a=>!KIT()||KOK.includes(a.kind)).sort((a,b)=>order[a.sev]-order[b.sev]);
}
async function setHandled(key,val){const cur={...(S.handled||{})}; const lim=new Date(Date.now()-45*864e5).toISOString(); for(const k in cur) if(!cur[k]||String(cur[k].at||"")<lim) delete cur[k]; if(val) cur[key]={...val,by:AUTH.name||"",at:new Date().toISOString()}; else delete cur[key]; await put("config/handled",cur);}
function findRepLine(pid,productId,colour,upto,needB){
  for(let i=0;i<14;i++){const d=add(upto,-i), w=S.weeks[wid(pid,weekStartOf(d))], r=w&&w.days&&w.days[d]; if(!r) continue;
    const ls=(r.lines||[]).map((l,ix)=>({l,ix})).filter(x=>x.l.productId===productId&&(!colour||x.l.colour===colour)&&(!needB||+x.l.b>0));
    if(ls.length) return {w,date:d,ls};}
  return null;}
async function resolveAtt(a,as){
  const f=a.fix; if(!f) return false; if(as==="sold"&&f.kind==="missing") return true; if(as==="remaining"&&f.kind==="expiry") return true;
  const hit=f.kind==="expiry"?findRepLine(f.pid,f.productId,f.colour,f.date,true):findRepLine(f.pid,f.productId,null,f.date,false);
  if(!hit){toast("Couldn't find the report line to change — fix it in Daily reports");return false;}
  const w=clone(hit.w), r=w.days[hit.date], life=+prod(f.productId).shelfDays||3;
  const ages=hit.ls.map(x=>({ix:x.ix,age:(dow(hit.date)-cfg().colours.findIndex(c=>c.name===x.l.colour)+7)%7})).sort((a,b)=>b.age-a.age);
  const L=r.lines[ages[0].ix]; const q=+f.qty||0;
  if(f.kind==="expiry"){const take=Math.min(q,+L.b||0); if(as==="wasted"){L.w=(+L.w||0)+take;} L.b=(+L.b||0)-take;}
  else { if(as==="wasted") L.w=(+L.w||0)+q; else if(as==="remaining") L.b=(+L.b||0)+q; }
  r.history=[...(r.history||[]).slice(-4),{at:new Date().toISOString(),by:AUTH.name||"",change:`${as}: ${q} × ${prod(f.productId).name} ${L.colour} (from Needs attention)`}];
  r._reason=`Needs attention: booked as ${as}`;
  await saveWeek(w); return true;}

function doText(d){return `*${cfg().company.name}* — ${d.no}\nDelivery ${nice(d.date)} to ${partner(d.partnerId).name}\nColour dot: ${doColours(d).join(" + ")||d.colour}\n`+(d.lines||[]).filter(l=>+l.qty).map(l=>`• ${prod(l.productId).name} (${l.colour||d.colour}) × ${d.status==="delivered"?(l.accepted??l.qty):l.qty}`).join("\n")+`\nPlease count on arrival and reply with any shortfall or damage.`}

      <div class="row">${parsed.exists?`<span class="pill warn">A report for this outlet/date already exists — saving replaces it</span>`:""}${parsed.billed?`<span class="pill warn">That week is billed: the change will be flagged on the bill</span>`:""}<button class="btn pri" data-act="savePaste">Save ${parsed.type==="report"?`report for ${esc(partner(parsed.partnerId).name)}, ${nice(parsed.date)}`:"audit"}</button></div>`:""}
  </div>`;
  const lines=editing?editLines(day):day.lines;
  const tbl=lines.length?`<div class="tw"><table><thead><tr><th>Cake</th><th>Batch</th><th class="r">Age</th><th class="r">Opening</th><th class="r">Delivered</th><th class="r">Waste</th><th class="r">Balance</th><th class="r">Sold</th><th class="r">POS sold</th><th class="r">Variance</th></tr></thead><tbody>
    ${lines.map(l=>{const k=c.keys[l.productId+"|"+l.colour]||{};const age=k.batchDate?diffDays(date,k.batchDate)+1:"";const life=+prod(l.productId).shelfDays||3;
      const agePill=age===""?"":(age>life?`<span class="pill bad">day ${age}</span>`:age===life?`<span class="pill warn">day ${age}</span>`:`<span class="mono">day ${age}</span>`);
      const avail=(l.open??0)+(l.recv||0);

        const has=v.b!==""&&v.b!=null; const sold=v.s!==""&&v.s!=null?+v.s:Math.max(0,avail-(+v.w||0)-(+v.b||0));
        const vr=has?(+v.b)-(avail-sold-(+v.w||0)):"";
        return `<tr><td>${cake(l.productId)}</td><td>${dot(l.colour)}</td><td class="r">${agePill}</td><td class="r mono">${l.open??0}</td><td class="r mono">${l.recv||0}</td>
        <td class="r"><input type="number" min="0" id="e-${key}-w" data-dd="${key}" data-k="w" value="${esc(v.w??"")}"></td><td class="r"><input type="number" min="0" id="e-${key}-b" data-dd="${key}" data-k="b" value="${esc(v.b??"")}"></td>
        <td class="r mono muted">${has?sold:""}</td><td class="r"><input type="number" min="0" id="e-${key}-s" data-dd="${key}" data-k="s" value="${esc(v.s??"")}" placeholder="opt."></td><td class="r mono ${vr<0?"neg":vr>0?"pos":""}">${vr===""||vr===0?"":(vr>0?"+":"")+vr}</td></tr>`;}
      return `<tr><td>${cake(l.productId)}</td><td>${dot(l.colour)}</td><td class="r">${agePill}</td><td class="r mono">${l.open??0}</td><td class="r mono">${l.recv||""}</td><td class="r mono">${rep&&l.close!=null?l.waste:""}</td>

        <td class="r mono ${l.var<0?"neg":l.var>0?"pos":""}">${l.close!=null&&l.var?(l.var>0?"+":"")+l.var:""}</td></tr>`}).join("")}
    </tbody></table></div>`:`<div class="empty">No stock recorded at ${esc(p.name)} on this day.</div>`;
  return `<div class="head"><div><h1>Outlet reports</h1><p class="lede">Outlets send <b>waste and balance</b> for each colour dot. Sold is worked out: opening + delivered − waste − balance. Key in the <b>POS sold</b> figure from their own closing report to cross-check. Any difference shows as a variance (missing or unrecorded cakes).</p></div></div>

        <div class="row">${rep&&(rep.edits||[]).length?`<span class="pill warn" title="See the change log below">Changed ${rep.edits.length}× · last by ${esc(rep.edits[rep.edits.length-1].by||"")}</span>`:""}${rep?`<span class="pill ok">Reported${rep.by?` by ${esc(rep.by)}`:""} · ${esc(rep.source||"")}</span>`:day.status==="missing"?`<span class="pill bad">Missing</span>${p.internal?`<a class="btn sm" href="kitchen.html#closing">Kitchen closing report</a>`:`<a class="btn sm wa" target="_blank" rel="noopener" href="${esc(wa(p.phone,chaseText(p,[date])))}">Chase on WhatsApp</a>`}`:`<span class="pill mute">${day.status==="today"?"Due at closing":"Upcoming"}</span>`}

      ${tbl}

        <div class="row">${S.assets?`<label class="btn sm">Add photos from WhatsApp<input type="file" accept="image/&#42;" multiple data-repphoto="${pid}|${date}" hidden></label>`:""}${rep.drive?driveLink(rep.drive):(S.mcp?`<button class="btn sm" data-act="fileDaily">File report + photos to Drive</button>`:"")}</div></div>
        ${(rep.photos||[]).length?`<div class="photos">${rep.photos.map(id=>`<a href="${esc(photoLink(id))}" target="_blank" rel="noopener"><img src="${esc(photoSrc(id))}" alt="Closing photo"></a>`).join("")}</div>`:`<p class="small muted" style="margin:0">Save the outlet's WhatsApp photos to your phone/computer, then add them here so they're kept with this report.</p>`}`:""}
    </div>`;
}
const WHY=["Recount: cakes found or miscounted","Missing cake: confirmed sold","Missing cake: thrown away","Wrong colour dot entered","Delivery short or damaged","Outlet sent numbers by WhatsApp or phone","Sales photo read wrongly","Other"];
const fmtTs=iso=>{try{return new Date(iso).toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"});}catch(e){return String(iso||"");}};
const locDay=iso=>{const d=new Date(iso);return isNaN(d)?"":`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;};
const roleName=r=>({owner:"Owner",manager:"Manager",office:"Office",auditor:"Team",outlet:"Outlet"})[r]||r||"";
const chgTxt=c=>{const v=x=>x==null||x===""?"–":esc(x);
  if(!c.productId) return `${esc(c.field)}${c.field==="Report entered by office"?`: ${v(c.to)}`:`: “${v(c.from)}” → “${v(c.to)}”`}`;
  return `${esc(prod(c.productId).name)}${c.colour?" "+dot(c.colour):""} · ${esc(c.field)} <b class="mono">${v(c.from)} → ${v(c.to)}</b>`;};
function soldEditor(day,rep){
  const ids=[...new Set([...day.lines.map(l=>l.productId),...Object.keys(S.ui.dayDraft||{}).map(k=>k.split("|")[0]),...Object.keys((rep&&rep.sold)||{})])].filter(Boolean);

function photoFlags(rep){const pc=(rep&&rep.photoCheck)||[]; if(!pc.length) return ""; const bad=pc.filter(x=>!x.ok);
  return bad.length?`<div class="warns"><div class="bad"><b>Photo check:</b> ${bad.map(x=>`${esc(x.label)}: ${esc(x.why)}`).join(" · ")}</div></div>`:`<p class="small muted" style="margin:0">✓ Photo check: the photos look right.</p>`;}
function afterBillBanner(w,st,live){ if(!st) return ""; const ab=w.afterBill||[], dn=Math.round(((live.totals.net||0)-(st.totals.net||0))*100)/100; if(!ab.length&&Math.abs(dn)<0.005) return "";
  return `<div class="warns"><div class="bad"><b>Changed after this bill was issued.</b> ${ab.length?`${ab.length} change${ab.length>1?"s":""}; last: ${esc(ab[ab.length-1].what||"")} by ${esc(ab[ab.length-1].by||"")} (${esc(fmtTs(ab[ab.length-1].at))}). `:""}${Math.abs(dn)>=0.005?`With today's numbers the net would be <b>RM ${fm(live.totals.net)}</b> instead of RM ${fm(st.totals.net)} (difference RM ${fm(dn)}). To bill the new amount, Alfred or Joscelyn voids this bill and issues it again.`:"The net amount has not changed, so the issued bill is still right."}</div></div>`;}
function dayLog(rep){ const E=(rep&&rep.edits)||[]; if(!E.length&&!(rep&&rep.orig)) return "";

    ${o?`<details class="help"><summary>What was there before the first change${o.by?` (counted by ${esc(o.by)}`:" ("}${o.at?`${o.by?", ":""}${esc(fmtTs(o.at))}`:""}${o.source?` · ${esc(o.source)}`:""})</summary><div class="tw" style="margin-top:8px"><table><thead><tr><th>Cake</th><th>Batch</th><th class="r">Waste</th><th class="r">Left</th></tr></thead><tbody>${(o.lines||[]).map(l=>`<tr><td>${esc(prod(l.productId).name)}</td><td>${dot(l.colour)}</td><td class="r mono">${l.w??0}</td><td class="r mono">${l.b??0}</td></tr>`).join("")||`<tr><td colspan="4" class="small">No cakes counted.</td></tr>`}</tbody></table></div>${o.sold?`<p class="small muted" style="margin:6px 0 0">Sold (sales photo): ${Object.entries(o.sold).map(([k,v])=>`${esc(prod(k).name)} ${esc(v)}`).join(", ")||"none"}</p>`:""}</details>`:""}</div>`;}
function editRows(){const out=[]; for(const w of Object.values(S.weeks)) for(const [d,r] of Object.entries(w.days||{})) for(const e of (r.edits||[])) out.push({pid:w.partnerId,date:d,...e}); return out.sort((a,b)=>String(b.at).localeCompare(String(a.at)));}

/* parse WhatsApp text */
function parseMsg(txt){
  const out={errors:[],lines:[],ok:false}; const T=txt.replace(/\r/g,"");
  const get=re=>{const m=T.match(re);return m?m[1].trim():""};
  const code=get(/Outlet:\s*([A-Za-z0-9-]+)/i).toUpperCase(), date=get(/Date:\s*(\d{4}-\d{2}-\d{2})/i), by=get(/By:\s*(.+)/i);
  const p=partners(true).find(x=>(x.code||"").toUpperCase()===code);
  if(!p) out.errors.push(code?`Outlet code "${code}" is not set up.`:"Couldn't find 'Outlet:' in the message.");
  if(!date) out.errors.push("Couldn't find 'Date: yyyy-mm-dd' in the message.");
  const bySku=sku=>products(true).find(x=>(x.sku||"").toUpperCase()===sku.toUpperCase());
  const colOk=c=>cfg().colours.some(x=>x.name===c.toUpperCase());
  out.partnerId=p&&p.id; out.date=date; out.by=by;
  out.note=get(/Note:\s*(.+)/i).replace(/^-$/,"");
  if(/#AU1|SPOT AUDIT/i.test(T)){
    out.type="audit"; const a={partnerId:out.partnerId,date,by,time:get(/Time:\s*(\S+)/i),checks:{},prices:{},counts:[],temp:get(/TEMP:\s*([\d.]+)/i),note:out.note,source:"whatsapp"};
    for(const m of T.matchAll(/CHECK\s+(\w+):\s*(PASS|FAIL|NA)/gi)) a.checks[m[1]]=m[2].toUpperCase();
    for(const m of T.matchAll(/PRICE\s+([A-Za-z0-9-]+):\s*([\d.]+)/gi)){const pr=bySku(m[1]); if(pr) a.prices[pr.id]=+m[2]; else out.errors.push(`Unknown cake code ${m[1]}`);}
    for(const m of T.matchAll(/COUNT\s+([A-Za-z0-9-]+)\s+([A-Za-z]+):\s*(\d+)/gi)){const pr=bySku(m[1]); if(pr&&colOk(m[2])) a.counts.push({productId:pr.id,colour:m[2].toUpperCase(),n:+m[3]}); else out.errors.push(`Couldn't read count line: ${m[0]}`);}
    out.audit=a; out.summary=`Spot audit · ${p?p.name:"?"} · ${date||"?"}`;
  } else {
    out.type="report";
    for(const m of T.matchAll(/^\s*([A-Za-z0-9-]+)\s*\|\s*([A-Za-z]+)\s*\|\s*(?:S\s*(\d+)\s*)?W\s*(\d+)\s*B\s*(\d+)/gim)){
      const pr=bySku(m[1]); if(!pr){out.errors.push(`Unknown cake code "${m[1]}" — add it in Setup › Products or fix the message.`);continue;}
      if(!colOk(m[2])){out.errors.push(`Unknown colour "${m[2]}".`);continue;}
      out.lines.push({productId:pr.id,colour:m[2].toUpperCase(),w:+m[4],b:+m[5],...(m[3]!=null?{s:+m[3]}:{})});
    }
    if(!out.lines.length&&!/no stock counted/i.test(T)) out.errors.push("No cake lines found (format: SKU | COLOUR | W0 B0).");
    out.summary=`Closing report · ${p?p.name:"?"} · ${date?nice(date):"?"} · ${out.lines.length} line(s)`;
    if(p&&date){const w=S.weeks[wid(p.id,weekStartOf(date))]; out.exists=!!(w&&w.days&&w.days[date]); out.locked=false; out.billed=!!(w&&w.settlement);}
  }
  out.ok=!out.errors.length||(out.type==="report"&&out.lines.length&&p&&date&&!out.locked);
  return out;
}

function docHTML(kind,pid,ws,st){

  const T={inv:"INVOICE",cf:"CARRY FORWARD NOTE",cn:"CREDIT NOTE",do:"DELIVERY ORDER"}[kind];

    rows=(st.lines||[]).filter(l=>+l.qty).map((l,i)=>`<tr><td>${i+1}</td><td>${esc(prod(l.productId).name)} <span style="color:#777">${esc(prod(l.productId).sku)}</span></td><td>${dot(l.colour||st.colour)}</td><td class="r">${l.qty}</td><td class="r">${st.status==="delivered"?(l.accepted??l.qty):""}</td></tr>`).join("");

  }
  no=st[kind+"No"]; lines=st[kind];
  rows=lines.map((l,i)=>`<tr><td>${i+1}</td><td>${esc(prod(l.productId).name)}${l.type==="B/F"?` <span style="color:#777">B/F ${esc(l.ref||"")}</span>`:l.type==="NEW"?` <span style="color:#777">${esc(l.ref||"")}</span>`:l.reason?` <span style="color:#777">${esc(l.reason)}</span>`:""}</td><td>${dot(l.colour)}</td><td class="r">${l.qty}</td><td class="r">${fm(l.rate)}</td><td class="r">${fm(l.qty*l.rate)}</td></tr>`).join("");
  const total=st.totals[kind];
  const tot=`<div class="tot"><table>${kind==="inv"?`<tr><td>Subtotal</td><td class="r">${fm(total)}</td></tr><tr><td>Less CF ${esc(st.cfNo)}</td><td class="r">− ${fm(st.totals.cf)}</td></tr>${st.cnNo?`<tr><td>Less CN ${esc(st.cnNo)}</td><td class="r">− ${fm(st.totals.cn)}</td></tr>`:""}<tr class="g"><td>Net payable (RM)</td><td class="r">${fm(st.totals.net)}</td></tr>`:`<tr class="g"><td>Total credit (RM)</td><td class="r">${fm(total)}</td></tr>`}</table></div>`;
  if(kind==="inv") notes=`Consignment period ${nice(ws)} – ${nice(we)}. Charged at ${p.pct}% of retail per agreed terms. Lines marked B/F were carried forward and are rebilled at their original rate; unsold stock is credited on ${esc(st.cfNo)} and carried to next week.`;
  if(kind==="cf") notes=`<span class="stamp">CF · CARRIED FORWARD</span><br>Unsold stock at close of ${nice(we)} (counted balance by colour dot). This credit offsets ${esc(st.invNo)}. The same quantities, colours and rates are rebilled on the next weekly invoice. Stock stays at the outlet; original make dates and shelf life still apply.`;
  if(kind==="cn") notes=`Credit against ${esc(st.invNo)} for the period ${nice(ws)} – ${nice(we)}, per agreed wastage terms.`;

function evalAudit(a){
  const priceBad=[],fails=[],counts=[];
  for(const [pid,shown] of Object.entries(a.prices||{})){const ap=priceFor(a.partnerId,pid,a.date).retail; if(ap&&Math.abs(+shown-ap)>0.004) priceBad.push({name:prod(pid).name,shown:+shown,approved:ap});}
  const labels=Object.fromEntries(cfg().checks.map(c=>[c.k,c.l]));
  for(const [k,v] of Object.entries(a.checks||{})) if(v==="FAIL") fails.push(labels[k]||k);
  if(a.temp!==""&&a.temp!=null&&(+a.temp>5||+a.temp<0)) fails.push(`chiller at ${a.temp}°C`);
  const c=calcWeek(a.partnerId,weekStartOf(a.date)); const d=c.days.find(x=>x.date===a.date); const prevStock=d?(()=>{const i=c.days.indexOf(d);return i>0?c.days[i-1].stock:Object.fromEntries(c.opening.lines.map(l=>[l.productId+"|"+l.colour,l.qty]))})():{};
  for(const x of a.counts||[]){const recv=d?(d.lines.find(l=>l.productId===x.productId&&l.colour===x.colour)||{}).recv||0:0; const sys=(prevStock[x.productId+"|"+x.colour]||0)+recv; counts.push({...x,sys});}
  const n=Object.values(a.checks||{}).filter(v=>v!=="NA").length, pass=Object.values(a.checks||{}).filter(v=>v==="PASS").length;
  return {priceBad,fails,counts,score:n?Math.round(pass/n*100):null};
}
function suggestAudit(){
  const ps=partners().filter(p=>!p.internal); if(!ps.length) return null;
  const last=pid=>Object.values(S.audits).filter(a=>a.partnerId===pid).map(a=>a.date).sort().pop()||"2000-01-01";
  const weights=ps.map(p=>Math.max(1,diffDays(today(),last(p.id))));
  let r=Math.random()*weights.reduce((a,b)=>a+b,0), pick=ps[0];
  for(let i=0;i<ps.length;i++){r-=weights[i]; if(r<=0){pick=ps[i];break;}}
  const pr=[...products()].sort(()=>Math.random()-.5).slice(0,3);
  return {partnerId:pick.id,products:pr.map(p=>p.id),lastDate:last(pick.id)};
}

/* ---------- planning engine: history → forecast → next delivery → kitchen prep ---------- */
const evList=()=>Object.values(S.calendar).sort((a,b)=>a.date.localeCompare(b.date));
const dayEvents=iso=>evList().filter(e=>iso>=e.date&&iso<=(e.end||e.date));
const effUp=e=>{const u=+e.uplift||0; if(u<=0) return u; return Math.min(u,e.type==="school"?+(cfg().schoolUplift??5):+(cfg().holUplift??10));};
function dayFactor(iso){
  let f=1; const ev=dayEvents(iso); for(const e of ev) f*=1+effUp(e)/100;
  if(!ev.some(e=>e.type==="public")&&dayEvents(add(iso,1)).some(e=>e.type==="public")) f*=1+(+cfg().eveUplift||0)/100;
  return Math.max(0.1,Math.min(f,1+(+(cfg().holUplift??10))/100));
}
const tradesLikeWeekend=iso=>[5,6,0].includes(dow(iso)); // Fri–Sun
function salesHistory(pid,days=28){
  const t=today(), from=add(t,-days), out={}, seen=new Set();
  for(let d=from; d<t; d=add(d,1)){ const ws=weekStartOf(d); if(seen.has(ws)) continue; seen.add(ws);
    for(const day of calcWeek(pid,ws).days){ if(day.date<from||day.date>=t||!day.rep) continue;
      const per={}; for(const l of day.lines){ if(l.close==null) continue; const x=per[l.productId]||(per[l.productId]={sold:0,waste:0,recv:0,close:0}); x.sold+=l.sold; x.waste+=l.waste; x.recv+=l.recv||0; x.close+=l.close; }
      for(const [pr,v] of Object.entries(per)) (out[pr]||(out[pr]=[])).push({date:day.date,...v,stockout:v.close===0&&v.sold>0});
    }}
  return out;
}
function forecastFor(pid,prodId,hist){
  const h=hist[prodId]||[], base=h.map(x=>({...x,b:x.sold/dayFactor(x.date)}));
  const avg=a=>a.length?a.reduce((s,x)=>s+x.b,0)/a.length:null;
  const all=avg(base); let aw=avg(base.filter(x=>!tradesLikeWeekend(x.date))), ae=avg(base.filter(x=>tradesLikeWeekend(x.date)));
  const par=+partner(pid).parDay||3, source=h.length>=5?"history":(h.length?"thin history":"starting par");
  if(aw==null) aw=all!=null?all/1.15:par; if(ae==null) ae=all!=null?all*1.25:par*1.3;
  if(h.length<5&&h.length){aw=(aw+par)/2; ae=(ae+par*1.3)/2;}
  const so=h.length?h.filter(x=>x.stockout).length/h.length:0;
  const sold=h.reduce((s,x)=>s+x.sold,0), waste=h.reduce((s,x)=>s+x.waste,0), wr=(sold+waste)?waste/(sold+waste):0;
  const boost=so>.3?1.15:1;
  return {aw,ae,so,wr,n:h.length,sold,waste,source,per:iso=>(tradesLikeWeekend(iso)?ae:aw)*dayFactor(iso)*boost};
}
function nextDeliveries(pid,from){const dd=(partner(pid).deliveryDays||[1,3,5]).map(Number);const r=[];for(let i=0;i<28&&r.length<2;i++){const d=add(from,i);if(dd.includes(dow(d))&&!isClosed(pid,d))r.push(d);}return r;}
function planOutlet(pid,taken){
  const t=today(), p=partner(pid), hist=salesHistory(pid,28), [d1,d2]=nextDeliveries(pid,add(t,((+cfg().prepLeadDays||0)>0||new Date().getHours()>=+(cfg().planSwitchHour??14))?1:0));
  if(!d1) return {pid,lines:[],note:"No delivery days set for this outlet (Setup › Outlets)."};
  const c=calcWeek(pid,weekStartOf(t)); const ref=[...c.days].reverse().find(d=>d.date<=t&&d.rep)||[...c.days].reverse().find(d=>d.date<t)||c.days[0];
  const stock={}; for(const k of Object.values(c.keys)){const q=ref?ref.stock[k.key]:0; if(q>0)(stock[k.productId]||(stock[k.productId]=[])).push({colour:k.colour,qty:q,batch:k.batchDate||ref.date});}
  const planned=Object.values(weekDoc(pid,weekStartOf(d1)).dos||{}).filter(d=>d.date===d1);
  const carries=(p.carries||[]).filter(id=>S.products[id]), known=[...Object.keys(hist),...Object.keys(stock)];
  const ids=new Set(carries.length?carries:(known.length?known:Object.values(S.prices).filter(x=>x.partnerId===pid&&x.status==="Active").map(x=>x.productId)));
  const carryNote=carries.length?"":(known.length?"Planning uses the cakes this outlet has sold or holds. Set exactly which cakes it carries in Setup › Outlets.":"No sales yet: planning every cake with a price. Set which cakes this outlet carries in Setup › Outlets.");
  const lines=[];
  for(const id of [...ids].filter(id=>S.products[id]&&S.products[id].active!==false).sort((a,b)=>prod(a).name.localeCompare(prod(b).name))){

function driveErr(e){const c=e&&e.code;return c==="server_not_connected"?"Connect Google Drive in claude.ai Settings → Connectors, then try again.":c==="needs_reauth"?"Reconnect Google Drive in claude.ai Settings → Connectors.":c==="not_in_manifest"?"Google Drive access is turned off for this page — allow it and try again.":c==="selection_required"?"Choose which Google Drive account to use in the prompt, then try again.":c==="not_granted"||c==="capability_disabled"?"Drive filing isn't available in this view.":`Drive said: ${(e&&e.message)||"unknown error"}`}
async function driveFolder(parts){
  if(!S.mcp) throw {code:"capability_disabled"};
  let parent=cfg().driveRootId, path=""; const cache={...(S.drive.folders||{})}; let changed=false;
  for(const name of parts){ path+=(path?"/":"")+name; if(cache[path]){parent=cache[path];continue;}
    const q=`title = '${name.replace(/\\/g,"\\\\").replace(/'/g,"\\'")}' and parentId = '${parent}' and mimeType = 'application/vnd.google-apps.folder'`;
    const r=await S.mcp.callTool(DRIVE,"search_files",{query:q,excludeContentSnippets:true,pageSize:5},{cache:false});
    let id=((r.payload&&r.payload.files)||[])[0]?.id;
    if(!id){const c=await S.mcp.callTool(DRIVE,"create_file",{title:name,parentId:parent,contentMimeType:"application/vnd.google-apps.folder"}); id=c.payload&&c.payload.id;}
    if(!id) throw {code:"tool_error",message:"Drive did not return a folder id"};
    cache[path]=id; parent=id; changed=true;
  }
  if(changed){S.drive.folders=cache; await put("config/drive",{...S.drive,folders:cache});}
  return parent;
}

  return r.payload&&(r.payload.viewUrl||r.payload.id)||"";
}
async function driveUploadPhoto(pid,iso,title,assetId){
  const parent=await driveFolder(drivePath(pid,iso,"photo"));
  const blob=await (await fetch("/_blob/"+assetId)).blob();
  const b64=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(",")[1]);fr.onerror=rej;fr.readAsDataURL(blob);});
  const r=await S.mcp.callTool(DRIVE,"create_file",{title,parentId:parent,base64Content:b64,contentMimeType:blob.type||"image/jpeg",disableConversionToGoogleType:true});

const DBX={cache:{},subs:[]};
function snapFor(col){const docs=Object.entries(DBX.cache[col]||{}).map(([id,d])=>({id,exists:true,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}}));return {docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false},docChanges:()=>[]};}
function fire(col){for(const s of DBX.subs) if(!col||s.col===col) s.fn(snapFor(s.col));}
const shimDB={
  collection(col){return {onSnapshot(fn){DBX.subs.push({col,fn});setTimeout(()=>fn(snapFor(col)),0);return ()=>{};}};},
  doc(path){const [col,id]=path.split("/");return {
    get:async()=>{const d=(DBX.cache[col]||{})[id];return {id,exists:!!d,data:()=>d};},
    set:async(data)=>{const c=JSON.parse(JSON.stringify(data)), prev=(DBX.cache[col]||{})[id];(DBX.cache[col]=DBX.cache[col]||{})[id]=c;fire(col);let r; try{ r=await GS("dbPut",col,id,c); }catch(err){ if(prev===undefined) delete DBX.cache[col][id]; else DBX.cache[col][id]=prev; fire(col); throw err; }if(r&&typeof r==="object"&&r.rec){DBX.cache[col][id]=r.rec;fire(col);}},
    update:async(data)=>{const c={...((DBX.cache[col]||{})[id]||{}),...JSON.parse(JSON.stringify(data))};(DBX.cache[col]=DBX.cache[col]||{})[id]=c;fire(col);const r=await GS("dbPut",col,id,c);if(r&&typeof r==="object"&&r.rec){DBX.cache[col][id]=r.rec;fire(col);}},
    delete:async()=>{if(DBX.cache[col])delete DBX.cache[col][id];fire(col);await GS("dbDel",col,id);}
  };}
};
