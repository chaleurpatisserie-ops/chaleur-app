<style>

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.5}

.lede{color:var(--muted);margin:4px 0 0;max-width:70ch}

.btn.sm{padding:5px 9px;font-size:12px}

.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}

.item b{font-weight:600}

function sortLine(a,b){return prod(a.productId).name.localeCompare(prod(b.productId).name)||a.colour.localeCompare(b.colour)}
function buildSettlement(c,opts={}){

  photo:"Photos protect both sides if numbers are questioned. Ask for them, or Ignore if you don't need them for these days.",
  salesread:"Open the report, look at the sales photo and compare it with the count. If it matches, Ignore.",
  expiry:"Ask the outlet to take it off display now. Then record what happened: Wasted (thrown away but not entered), Sold (it sold) or Remaining (checked and still at the outlet).",
  last:"Ask the outlet to put it at the front and sell it first today.",
  extra:"The outlet counted more than we sent. Usually a delivery wasn't marked delivered (check Deliveries) or colour dots were mixed up. Fix the DO or the report, then Ignore.",
  variance:"The count differs from our records. Check Deliveries for an unconfirmed DO and the colour dots on the daily report.",
  bill:"Open Weekly billing, check the draft and tap Approve & issue (Alfred or Joscelyn).",
  ar:"Send a payment reminder, then record the payment in Weekly billing.",
  audit:"Share the audit photos with the outlet and ask them to fix it. It is checked again at the next audit.",
  late:"This report arrived after the week was billed, so it did not change the bill. Open the week and compare. If the bill is wrong, a manager can void and reissue it; otherwise Ignore."};
const plain=h=>String(h||"").replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim();
function missingCause(pid,date,productId,qty,rep){
  const life=+prod(productId).shelfDays||3;
  const dos=allDOs().filter(d=>d.partnerId===pid&&d.date<=date&&d.date>=add(date,-2)&&(d.lines||[]).some(l=>l.productId===productId&&+l.qty));
  const open=dos.filter(d=>d.status!=="delivered");
  if(open.length) return {kind:"do",text:`Delivery ${open.map(d=>esc(d.no)).join(", ")} is not marked delivered. Check the outlet really received all of them (Deliveries › Mark delivered with the accepted count).`};
  const c=calcWeek(pid,weekStartOf(date)), day=c.days.find(x=>x.date===date), exp=[];
  if(day) for(const l of day.lines){ if(l.productId!==productId) continue; const k=c.keys[l.productId+"|"+l.colour]; if(k&&k.batchDate&&diffDays(date,k.batchDate)>=life&&!(l.waste>0)) exp.push(l.colour); }
  if(exp.length) return {kind:"waste",text:`${exp.join(", ")} was past shelf life that day but no waste was entered, so it was probably thrown away. Choose Wasted.`};
  const odd=((rep&&rep.lines)||[]).filter(l=>l.productId===productId&&(()=>{const k=c.keys[l.productId+"|"+l.colour];return !k||!(k.open||k.recv);})());
  if(odd.length) return {kind:"colour",text:`${odd.map(l=>esc(l.colour)).join(", ")} was counted but we have no record of sending it. Colour dots may be mixed up; ask the outlet to recount by colour.`};
  return {kind:"none",none:true,text:"No clear cause found, so it is billed as sold."};
}
function attention(){
  if(S.loaded.size<NCOL) return [];
  const t=today(), items=[], HD=S.handled||{};
  const push=it=>{ if(!HD[it.key]) items.push({...it,tip:it.tip||TIPS[it.kind]||""}); };
  for(const p of partners()){
    const miss=[], noPhoto=[], now=new Date();
    for(let i=7;i>=0;i--){const d=add(t,-i); if(isClosed(p.id,d)) continue; if(i===0&&now<reportDueAt(p.id,d)) continue;
      const w=S.weeks[wid(p.id,weekStartOf(d))]; const r=w&&w.days&&w.days[d]; if(!r) miss.push(d); else if(!(r.photos||[]).length) noPhoto.push(d);}
    const first=Object.values(S.weeks).filter(w=>w.partnerId===p.id).map(w=>w.weekStart).sort()[0];
    const co=cfg().cutoffDate||"";
    const realMiss=first?miss.filter(d=>d>=first&&d>=co):[];
    if(noPhoto.length) push({sev:"warn",kind:"photo",key:`photo|${p.id}|${noPhoto.join(",")}`,pid:p.id,text:`<b>${esc(p.name)}</b> — closing report without photos: ${noPhoto.map(nice).join(", ")}`,action:`<a class="btn sm wa" href="${esc(wa(p.phone,`Hi ${p.contact||p.name} team, please send the closing photos (chiller + waste) for ${noPhoto.map(nice).join(", ")}. Thank you!`))}" target="_blank" rel="noopener">Ask for photos</a>`,go:{tab:"daily",date:noPhoto[noPhoto.length-1]}});
    if(realMiss.length) push({sev:"bad",kind:"report",key:`report|${p.id}|${realMiss.join(",")}`,pid:p.id,text:`<b>${esc(p.name)}</b> — no closing report for ${realMiss.map(nice).join(", ")} <span class="muted small">(closes ${hoursOf(p.id,realMiss[realMiss.length-1]).close})</span>`,action:`<a class="btn sm wa" href="${esc(wa(p.phone,chaseText(p,realMiss)))}" target="_blank" rel="noopener">Chase on WhatsApp</a>`});
    for(let i=7;i>=0;i--){const dd=add(t,-i); const ww=S.weeks[wid(p.id,weekStartOf(dd))]; const rr=ww&&ww.days&&ww.days[dd]; if(!rr||!rr.check) continue;
      if(rr.readOk){ for(const c of rr.check.filter(c=>c.diff)){ const nm=esc(prod(c.productId).name);
          if(c.diff>0){ const cause=missingCause(p.id,dd,c.productId,c.diff,rr);
            push({sev:"warn",kind:"missing",key:`miss|${p.id}|${dd}|${c.productId}`,pid:p.id,text:`<b>${esc(p.name)}</b> ${nice(dd)} — ${c.diff} × ${nm} not accounted for (sales photo vs count)`,tip:`<b>Likely cause:</b> ${cause.text} Choose where the ${c.diff>1?"cakes":"cake"} went: <b>Sold</b> (billed, the default), <b>Wasted</b> (thrown away but not entered) or <b>Remaining</b> (still in the chiller, miscounted).`,fix:{pid:p.id,date:dd,productId:c.productId,qty:c.diff,kind:"missing",opts:["sold","wasted","remaining"]},go:{tab:"daily",date:dd}}); }
          else push({sev:"info",kind:"extra",key:`extra|${p.id}|${dd}|${c.productId}`,pid:p.id,text:`<b>${esc(p.name)}</b> ${nice(dd)} — ${nm}: ${-c.diff} more counted than we sent`,go:{tab:"daily",date:dd}});
        } }
      else if((rr.salesPhotos||[]).length) push({sev:"info",kind:"salesread",key:`sread|${p.id}|${dd}`,pid:p.id,text:`<b>${esc(p.name)}</b> ${nice(dd)} — sales photo not read automatically: open the report and check it`,go:{tab:"daily",date:dd}});}
    const c=calcWeek(p.id,weekStartOf(t)); const lastDay=[...c.days].reverse().find(d=>d.date<=t);
    if(lastDay){ for(const k of Object.values(c.keys)){ const q=lastDay.stock[k.key]; if(!(q>0)||!k.batchDate) continue;
      const age=diffDays(t,k.batchDate), life=+prod(k.productId).shelfDays||3;
      if(age>=life) push({sev:"bad",kind:"expiry",key:`exp|${p.id}|${t}|${k.productId}|${k.colour}`,pid:p.id,text:`<b>${esc(p.name)}</b> — ${q} × ${esc(prod(k.productId).name)} ${dot(k.colour)} is day ${age+1} (shelf life ${life} days): remove from display and record as wastage`,fix:{pid:p.id,date:t,productId:k.productId,colour:k.colour,qty:q,kind:"expiry",opts:["wasted","sold","remaining"]}});
      else if(age===life-1) push({sev:"warn",kind:"last",key:`last|${p.id}|${t}|${k.productId}|${k.colour}`,pid:p.id,text:`<b>${esc(p.name)}</b> — ${q} × ${esc(prod(k.productId).name)} ${dot(k.colour)} on its last day: sell first`});
    }}
    for(const ws of [weekStartOf(add(t,-7)),weekStartOf(t)].filter((v,i,a)=>a.indexOf(v)===i)){
      for(const d of calcWeek(p.id,ws).days){ if(d.date<add(t,-7)||d.date>t) continue;
        for(const l of d.lines) if(l.close!=null&&l.var!==0) push({sev:l.var<0?"warn":"info",kind:l.var>0?"extra":"variance",key:`var|${p.id}|${d.date}|${l.productId}|${l.colour}`,pid:p.id,text:`<b>${esc(p.name)}</b> ${nice(d.date)} — ${esc(prod(l.productId).name)} ${dot(l.colour)} count ${l.var>0?"+":""}${l.var} vs expected`,go:{tab:"daily",date:d.date}});
      }
    }
    const cur=weekStartOf(t);
    for(const w of Object.values(S.weeks).filter(w=>w.partnerId===p.id)){
      if(w.weekStart<cur&&!w.settlement&&(Object.keys(w.dos||{}).length||Object.keys(w.days||{}).length))
        push({sev:"warn",kind:"bill",key:`bill|${p.id}|${w.weekStart}`,pid:p.id,text:`<b>${esc(p.name)}</b> — week ${nice(w.weekStart)}–${nice(add(w.weekStart,6))} ended: the bill is drafted and waiting for approval`,go:{tab:"billing",week:w.weekStart}});
      for(const lr of (w.lateReports||[]).filter(x=>x.date>=add(t,-30))) push({sev:"warn",kind:"late",key:`late|${p.id}|${lr.recId||lr.date}`,pid:p.id,text:`<b>${esc(p.name)}</b> — report for ${nice(lr.date)} arrived after the week was billed${lr.by?` (by ${esc(lr.by)})`:""}`,go:{tab:"billing",week:w.weekStart}});
      if(w.settlement&&!w.settlement.paid){const age=diffDays(t,w.settlement.issuedAt.slice(0,10)); if(age>=(+p.terms||14)) push({sev:"warn",kind:"ar",key:`ar|${p.id}|${w.weekStart}`,pid:p.id,text:`<b>${esc(p.name)}</b> — ${esc(w.settlement.invNo)} net RM ${fm(w.settlement.totals.net)} unpaid for ${age} days`,go:{tab:"billing",week:w.weekStart}});}
    }
  }
  for(const a of Object.values(S.audits)){ if(a.date<add(t,-14)) continue; const ev=evalAudit(a);
    if(ev.priceBad.length) push({sev:"warn",kind:"audit",key:`auditp|${a.id}`,pid:a.partnerId,text:`<b>${esc(partner(a.partnerId).name)}</b> audit ${nice(a.date)} — wrong sell price: ${ev.priceBad.map(x=>`${esc(x.name)} RM${fm(x.shown)} (should be RM${fm(x.approved)})`).join(", ")}`,go:{tab:"audits"}});
    if(ev.fails.length) push({sev:"warn",kind:"audit",key:`auditf|${a.id}`,pid:a.partnerId,text:`<b>${esc(partner(a.partnerId).name)}</b> audit ${nice(a.date)} — failed: ${ev.fails.map(esc).join(", ")}`,go:{tab:"audits"}});
  }
  const order={bad:0,warn:1,info:2}; return items.sort((a,b)=>order[a.sev]-order[b.sev]);
}
async function setHandled(key,val){const cur={...(S.handled||{})}; const lim=new Date(Date.now()-45*864e5).toISOString(); for(const k in cur) if(!cur[k]||String(cur[k].at||"")<lim) delete cur[k]; if(val) cur[key]={...val,by:AUTH.name||"",at:new Date().toISOString()}; else delete cur[key]; await put("config/handled",cur);}
function findRepLine(pid,productId,colour,upto,needB){
  for(let i=0;i<14;i++){const d=add(upto,-i), w=S.weeks[wid(pid,weekStartOf(d))], r=w&&w.days&&w.days[d]; if(!r) continue;
    const ls=(r.lines||[]).map((l,ix)=>({l,ix})).filter(x=>x.l.productId===productId&&(!colour||x.l.colour===colour)&&(!needB||+x.l.b>0));
    if(ls.length) return {w,date:d,ls};}
  return null;}
async function resolveAtt(a,as){
  const f=a.fix; if(!f) return false; if(as==="sold"&&f.kind==="missing") return true; if(as==="remaining"&&f.kind==="expiry") return true;
  const hit=f.kind==="expiry"?findRepLine(f.pid,f.productId,f.colour,f.date,true):findRepLine(f.pid,f.productId,null,f.date,false);
  if(!hit){toast("Couldn't find the report line to change — fix it in Daily reports");return false;}
  if(hit.w.settlement){toast("That week is already billed — note it on the next report instead");return false;}
  const w=clone(hit.w), r=w.days[hit.date], life=+prod(f.productId).shelfDays||3;
  const ages=hit.ls.map(x=>({ix:x.ix,age:(dow(hit.date)-cfg().colours.findIndex(c=>c.name===x.l.colour)+7)%7})).sort((a,b)=>b.age-a.age);
  const L=r.lines[ages[0].ix]; const q=+f.qty||0;
  if(f.kind==="expiry"){const take=Math.min(q,+L.b||0); if(as==="wasted"){L.w=(+L.w||0)+take;} L.b=(+L.b||0)-take;}
  else { if(as==="wasted") L.w=(+L.w||0)+q; else if(as==="remaining") L.b=(+L.b||0)+q; }
  r.history=[...(r.history||[]).slice(-4),{at:new Date().toISOString(),by:AUTH.name||"",change:`${as}: ${q} × ${prod(f.productId).name} ${L.colour} (from Needs attention)`}];
  r._reason=`Needs attention: booked as ${as}`;
  await saveWeek(w); return true;}

/* parse WhatsApp text */
function parseMsg(txt){
  const out={errors:[],lines:[],ok:false}; const T=txt.replace(/\r/g,"");
  const get=re=>{const m=T.match(re);return m?m[1].trim():""};
  const code=get(/Outlet:\s*([A-Za-z0-9-]+)/i).toUpperCase(), date=get(/Date:\s*(\d{4}-\d{2}-\d{2})/i), by=get(/By:\s*(.+)/i);
  const p=partners(true).find(x=>(x.code||"").toUpperCase()===code);
  if(!p) out.errors.push(code?`Outlet code "${code}" is not set up.`:"Couldn't find 'Outlet:' in the message.");
  if(!date) out.errors.push("Couldn't find 'Date: yyyy-mm-dd' in the message.");
  const bySku=sku=>products(true).find(x=>(x.sku||"").toUpperCase()===sku.toUpperCase());
  const colOk=c=>cfg().colours.some(x=>x.name===c.toUpperCase());
  out.partnerId=p&&p.id; out.date=date; out.by=by;
  out.note=get(/Note:\s*(.+)/i).replace(/^-$/,"");
  if(/#AU1|SPOT AUDIT/i.test(T)){
    out.type="audit"; const a={partnerId:out.partnerId,date,by,time:get(/Time:\s*(\S+)/i),checks:{},prices:{},counts:[],temp:get(/TEMP:\s*([\d.]+)/i),note:out.note,source:"whatsapp"};
    for(const m of T.matchAll(/CHECK\s+(\w+):\s*(PASS|FAIL|NA)/gi)) a.checks[m[1]]=m[2].toUpperCase();
    for(const m of T.matchAll(/PRICE\s+([A-Za-z0-9-]+):\s*([\d.]+)/gi)){const pr=bySku(m[1]); if(pr) a.prices[pr.id]=+m[2]; else out.errors.push(`Unknown cake code ${m[1]}`);}
    for(const m of T.matchAll(/COUNT\s+([A-Za-z0-9-]+)\s+([A-Za-z]+):\s*(\d+)/gi)){const pr=bySku(m[1]); if(pr&&colOk(m[2])) a.counts.push({productId:pr.id,colour:m[2].toUpperCase(),n:+m[3]}); else out.errors.push(`Couldn't read count line: ${m[0]}`);}
    out.audit=a; out.summary=`Spot audit · ${p?p.name:"?"} · ${date||"?"}`;
  } else {
    out.type="report";
    for(const m of T.matchAll(/^\s*([A-Za-z0-9-]+)\s*\|\s*([A-Za-z]+)\s*\|\s*(?:S\s*(\d+)\s*)?W\s*(\d+)\s*B\s*(\d+)/gim)){
      const pr=bySku(m[1]); if(!pr){out.errors.push(`Unknown cake code "${m[1]}" — add it in Setup › Products or fix the message.`);continue;}
      if(!colOk(m[2])){out.errors.push(`Unknown colour "${m[2]}".`);continue;}
      out.lines.push({productId:pr.id,colour:m[2].toUpperCase(),w:+m[4],b:+m[5],...(m[3]!=null?{s:+m[3]}:{})});
    }
    if(!out.lines.length&&!/no stock counted/i.test(T)) out.errors.push("No cake lines found (format: SKU | COLOUR | W0 B0).");
    out.summary=`Closing report · ${p?p.name:"?"} · ${date?nice(date):"?"} · ${out.lines.length} line(s)`;
    if(p&&date){const w=S.weeks[wid(p.id,weekStartOf(date))]; out.exists=!!(w&&w.days&&w.days[date]); out.locked=!!(w&&w.settlement); if(out.locked) out.errors.push("That week is already billed. Void the bill first to change its reports.");}
  }
  out.ok=!out.errors.length||(out.type==="report"&&out.lines.length&&p&&date&&!out.locked);
  return out;
}

/* ---- AUDITS ---- */
function evalAudit(a){
  const priceBad=[],fails=[],counts=[];
  for(const [pid,shown] of Object.entries(a.prices||{})){const ap=priceFor(a.partnerId,pid,a.date).retail; if(ap&&Math.abs(+shown-ap)>0.004) priceBad.push({name:prod(pid).name,shown:+shown,approved:ap});}
  const labels=Object.fromEntries(cfg().checks.map(c=>[c.k,c.l]));
  for(const [k,v] of Object.entries(a.checks||{})) if(v==="FAIL") fails.push(labels[k]||k);
  if(a.temp!==""&&a.temp!=null&&(+a.temp>5||+a.temp<0)) fails.push(`chiller at ${a.temp}°C`);
  const c=calcWeek(a.partnerId,weekStartOf(a.date)); const d=c.days.find(x=>x.date===a.date); const prevStock=d?(()=>{const i=c.days.indexOf(d);return i>0?c.days[i-1].stock:Object.fromEntries(c.opening.lines.map(l=>[l.productId+"|"+l.colour,l.qty]))})():{};
  for(const x of a.counts||[]){const recv=d?(d.lines.find(l=>l.productId===x.productId&&l.colour===x.colour)||{}).recv||0:0; const sys=(prevStock[x.productId+"|"+x.colour]||0)+recv; counts.push({...x,sys});}
  const n=Object.values(a.checks||{}).filter(v=>v!=="NA").length, pass=Object.values(a.checks||{}).filter(v=>v==="PASS").length;
  return {priceBad,fails,counts,score:n?Math.round(pass/n*100):null};
}
function suggestAudit(){
  const ps=partners(); if(!ps.length) return null;
  const last=pid=>Object.values(S.audits).filter(a=>a.partnerId===pid).map(a=>a.date).sort().pop()||"2000-01-01";
  const weights=ps.map(p=>Math.max(1,diffDays(today(),last(p.id))));
  let r=Math.random()*weights.reduce((a,b)=>a+b,0), pick=ps[0];
  for(let i=0;i<ps.length;i++){r-=weights[i]; if(r<=0){pick=ps[i];break;}}
  const pr=[...products()].sort(()=>Math.random()-.5).slice(0,3);
  return {partnerId:pick.id,products:pr.map(p=>p.id),lastDate:last(pick.id)};
}

/* ---------- planning engine: history → forecast → next delivery → kitchen prep ---------- */
const evList=()=>Object.values(S.calendar).sort((a,b)=>a.date.localeCompare(b.date));
const dayEvents=iso=>evList().filter(e=>iso>=e.date&&iso<=(e.end||e.date));
function dayFactor(iso){
  let f=1; const ev=dayEvents(iso); for(const e of ev) f*=1+(+e.uplift||0)/100;
  if(!ev.some(e=>e.type==="public")&&dayEvents(add(iso,1)).some(e=>e.type==="public")) f*=1+(+cfg().eveUplift||0)/100;
  return f;
}
const tradesLikeWeekend=iso=>[5,6,0].includes(dow(iso)); // Fri–Sun
function salesHistory(pid,days=28){
  const t=today(), from=add(t,-days), out={}, seen=new Set();
  for(let d=from; d<t; d=add(d,1)){ const ws=weekStartOf(d); if(seen.has(ws)) continue; seen.add(ws);
    for(const day of calcWeek(pid,ws).days){ if(day.date<from||day.date>=t||!day.rep) continue;
      const per={}; for(const l of day.lines){ if(l.close==null) continue; const x=per[l.productId]||(per[l.productId]={sold:0,waste:0,recv:0,close:0}); x.sold+=l.sold; x.waste+=l.waste; x.recv+=l.recv||0; x.close+=l.close; }
      for(const [pr,v] of Object.entries(per)) (out[pr]||(out[pr]=[])).push({date:day.date,...v,stockout:v.close===0&&v.sold>0});
    }}
  return out;
}
function forecastFor(pid,prodId,hist){
  const h=hist[prodId]||[], base=h.map(x=>({...x,b:x.sold/dayFactor(x.date)}));
  const avg=a=>a.length?a.reduce((s,x)=>s+x.b,0)/a.length:null;
  const all=avg(base); let aw=avg(base.filter(x=>!tradesLikeWeekend(x.date))), ae=avg(base.filter(x=>tradesLikeWeekend(x.date)));
  const par=+partner(pid).parDay||3, source=h.length>=5?"history":(h.length?"thin history":"starting par");
  if(aw==null) aw=all!=null?all/1.15:par; if(ae==null) ae=all!=null?all*1.25:par*1.3;
  if(h.length<5&&h.length){aw=(aw+par)/2; ae=(ae+par*1.3)/2;}
  const so=h.length?h.filter(x=>x.stockout).length/h.length:0;

const DRIVE="Google Drive";
const TYPE_FOLDER={inv:"Invoices",cf:"Carry Forward",cn:"Credit Notes",do:"Delivery Orders",daily:"Daily Reports",audit:"Audits",photo:"Photos"};
function driveErr(e){const c=e&&e.code;return c==="server_not_connected"?"Connect Google Drive in claude.ai Settings → Connectors, then try again.":c==="needs_reauth"?"Reconnect Google Drive in claude.ai Settings → Connectors.":c==="not_in_manifest"?"Google Drive access is turned off for this page — allow it and try again.":c==="selection_required"?"Choose which Google Drive account to use in the prompt, then try again.":c==="not_granted"||c==="capability_disabled"?"Drive filing isn't available in this view.":`Drive said: ${(e&&e.message)||"unknown error"}`}
async function driveFolder(parts){
  if(!S.mcp) throw {code:"capability_disabled"};
  let parent=cfg().driveRootId, path=""; const cache={...(S.drive.folders||{})}; let changed=false;
  for(const name of parts){ path+=(path?"/":"")+name; if(cache[path]){parent=cache[path];continue;}
    const q=`title = '${name.replace(/\\/g,"\\\\").replace(/'/g,"\\'")}' and parentId = '${parent}' and mimeType = 'application/vnd.google-apps.folder'`;
    const r=await S.mcp.callTool(DRIVE,"search_files",{query:q,excludeContentSnippets:true,pageSize:5},{cache:false});
    let id=((r.payload&&r.payload.files)||[])[0]?.id;
    if(!id){const c=await S.mcp.callTool(DRIVE,"create_file",{title:name,parentId:parent,contentMimeType:"application/vnd.google-apps.folder"}); id=c.payload&&c.payload.id;}
    if(!id) throw {code:"tool_error",message:"Drive did not return a folder id"};
    cache[path]=id; parent=id; changed=true;
  }
  if(changed){S.drive.folders=cache; await put("config/drive",{...S.drive,folders:cache});}
  return parent;
}
function drivePath(pid,iso,kind){const p=partner(pid);return [p.legalName||p.name,`${p.name} (${p.code})`,iso.slice(0,7),TYPE_FOLDER[kind]]}
async function driveUploadHtml(pid,iso,kind,title,html){
  const parent=await driveFolder(drivePath(pid,iso,kind));
  const r=await S.mcp.callTool(DRIVE,"create_file",{title,parentId:parent,textContent:`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title></head><body>${html}</body></html>`,contentMimeType:"text/html"});
  return r.payload&&(r.payload.viewUrl||r.payload.id)||"";
}
async function driveUploadPhoto(pid,iso,title,assetId){
  const parent=await driveFolder(drivePath(pid,iso,"photo"));
  const blob=await (await fetch("/_blob/"+assetId)).blob();
  const b64=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(",")[1]);fr.onerror=rej;fr.readAsDataURL(blob);});
  const r=await S.mcp.callTool(DRIVE,"create_file",{title,parentId:parent,base64Content:b64,contentMimeType:blob.type||"image/jpeg",disableConversionToGoogleType:true});
  return r.payload&&(r.payload.viewUrl||r.payload.id)||"";
}

async function shrink(file,max=900){
  const img=await createImageBitmap(file); const k=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);

}

  const rows=S.team.map(x=>`<tr><td><b>${esc(x.name)}</b>${x.notes?`<div class="small">${esc(x.notes)}</div>`:""}</td><td>${esc(x.code)}</td><td>${esc(roleTxt[x.role]||x.role)}</td>
    <td>${x.active?`<span class="pill ok">Active</span>`:`<span class="pill mute">Inactive</span>`}</td>
    <td class="r">${x.role==="owner"?`<span class="small">Owner</span>`:`<button class="btn sm" data-stedit="${x.row}">Edit</button> <button class="btn sm" data-sttog="${x.row}">${x.active?"Deactivate":"Activate"}</button>`}</td></tr>`).join("");
  return `<h1>Staff</h1><p class="lede">Who can sign in. Team members can view the desk (prep, deliveries, reports) and do spot audits; office staff can also edit; managers can also manage staff. Deactivate someone to stop their login — their past records stay.</p>
    ${form}<div class="panel"><div class="spread"><h2>Team</h2>${ed?"":`<button class="btn pri sm" data-stnew="1">+ Add staff</button>`}</div>
    <div class="tw"><table><thead><tr><th>Name</th><th>Code</th><th>Access</th><th>Status</th><th></th></tr></thead><tbody>${rows||`<tr><td colspan="5" class="small">No staff yet.</td></tr>`}</tbody></table></div></div>`;
}
async function stSave(rec){ try{ S.team=await GS("teamSave",rec); S.ui.stEdit=null; toast("Staff saved"); render(); }catch(e){ toast(e.message); } }
document.addEventListener("input",e=>{const k=e.target&&e.target.dataset&&e.target.dataset.st; if(k&&S.ui.stEdit) S.ui.stEdit[k]=e.target.value;});
async function reload(){try{DBX.cache=await GS("dbLoadAll");fire();}catch(e){toast("Couldn't refresh — "+e.message);}}
function showLogin(msg){
  $("#main").innerHTML=`<div class="panel" style="max-width:380px;margin:40px auto"><h1 style="font-size:30px">Office login</h1><p class="lede">Enter your office PIN. Outlet and audit staff use their own links.</p>
    <label class="f">PIN<input id="lg-pin" type="password" inputmode="numeric" autocomplete="off"></label>
    <div class="row"><button class="btn pri" id="lg-go">Sign in</button><span class="small neg">${esc(msg||"")}</span></div></div>`;
  const go=async()=>{AUTH.pin=$("#lg-pin").value.trim(); if(!AUTH.pin) return; $("#lg-go").disabled=true;
    try{const u=await GS("login"); AUTH.name=u.name; AUTH.role=u.role; try{sessionStorage.setItem("chaleur.pin",AUTH.pin)}catch(_){} start();}
    catch(e){AUTH.pin=null; showLogin(e.message);}};
  $("#lg-go").onclick=go; $("#lg-pin").addEventListener("keydown",e=>{if(e.key==="Enter")go();}); setTimeout(()=>{const x=$("#lg-pin");x&&x.focus()},50);
}
async function start(){
  $("#main").innerHTML=`<div class="empty">Loading consignment data…</div>`;
  try{DBX.cache=await GS("dbLoadAll");}catch(e){AUTH.pin=null;try{sessionStorage.removeItem("chaleur.pin")}catch(_){} return showLogin(e.message);}
  S.db=shimDB; S.assets=shimAssets; S.dl=null; S.mcp=null;
  const sub=(col,fn)=>shimDB.collection(col).onSnapshot(snap=>{fn(snap);S.loaded.add(col);render();});
  const into=(key)=>s=>{const o={};for(const d of s.docs)o[d.id]={...d.data(),id:d.data().id||d.id};S[key]=o;};
  sub("config",s=>{S.cfg={};S.counters={};S.drive={folders:{}};for(const d of s.docs){if(d.id==="settings")S.cfg=d.data()||{};if(d.id==="counters")S.counters=d.data()||{};if(d.id==="handled")S.handled=d.data()||{};if(d.id==="prep")S.prep=d.data()||{};}});
  sub("calendar",into("calendar"));
  sub("partners",into("partners")); sub("products",into("products")); sub("prices",into("prices"));
  sub("weeks",into("weeks")); sub("audits",into("audits"));
  sub("alerts",s=>{const d=s.docs.find(x=>x.id==="latest");S.alerts=d?d.data():null;});
  setInterval(()=>{const a=document.activeElement; if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)) return; reload();},90000);
  render();
}
(function boot(){
  let saved=null; try{saved=sessionStorage.getItem("chaleur.pin")}catch(_){}
  if(saved){AUTH.pin=saved; GS("login").then(u=>{AUTH.name=u.name;AUTH.role=u.role;start();}).catch(()=>{AUTH.pin=null;showLogin();});}
  else showLogin();
})();
</script>
