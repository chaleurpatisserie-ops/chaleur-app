<script>
/* Chaleur sign-in (phone + PIN, remember me, log out) and the in-app helper. Shared by the office desk, kitchen and audit pages. */
const CA=(function(){
  const K="chaleur.s", ROLE={owner:"Owner",manager:"Manager",office:"Office",supervisor:"Kitchen supervisor",kitchen:"Kitchen",auditor:"Team"};
  const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const rd=st=>{try{const v=st.getItem(K);return v?JSON.parse(v):null}catch(e){return null}};
  function clear(){try{localStorage.removeItem(K)}catch(e){} try{sessionStorage.removeItem(K)}catch(e){} try{sessionStorage.removeItem("chaleur.pin")}catch(e){}}
  function get(){const s=rd(sessionStorage)||rd(localStorage); if(s&&(!s.t||(s.exp&&Date.now()>s.exp))){clear();return null;} return s;}
  function save(s){clear(); try{(s.remember?localStorage:sessionStorage).setItem(K,JSON.stringify(s));}catch(e){}}
  const run=(fn,...a)=>new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e instanceof Error?e:new Error((e&&e.message)||String(e))))[fn](...a));
  const isAuthErr=e=>/sign in again|expired/i.test((e&&e.message)||"");
  function loginForm(el,opt,done){
    opt=opt||{}; let last=""; try{last=localStorage.getItem("chaleur.lastid")||"";}catch(e){}
    el.innerHTML=`<div class="ca-login"><h2>${esc(opt.title||"Sign in")}</h2><p>${esc(opt.lede||"Use your phone number and your staff PIN.")}</p>
      <label>Phone number (or name)<input id="ca-id" type="text" autocomplete="username" autocapitalize="characters" spellcheck="false" placeholder="012-345 6789" value="${esc(last)}"></label>
      <label>PIN<input id="ca-pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="6"></label>
      <label class="ca-rem"><input id="ca-rem" type="checkbox"> Remember me on this phone for 30 days</label>
      <button class="ca-go" id="ca-go" type="button">Sign in</button><div class="ca-err" id="ca-err" role="alert">${esc(opt.msg||"")}</div>
      <p style="font-size:12.5px;margin-top:8px">No phone number set up yet? Type your name instead. Don't tick "Remember me" on a shared phone or computer.</p></div>`;
    const q=s=>el.querySelector(s), btn=q("#ca-go"), err=q("#ca-err");
    const go=async()=>{const id=q("#ca-id").value.trim(), pin=q("#ca-pin").value.trim(), rem=q("#ca-rem").checked;
      if(!id||!pin){err.textContent="Enter your phone number and PIN.";return;}
      btn.disabled=true; err.textContent="Signing in…";
      try{const r=await run("login",id,pin,rem); const s={t:r.token,name:r.name,role:r.role,exp:r.exp,remember:!!r.remember}; save(s);
        try{ if(rem) localStorage.setItem("chaleur.lastid",id); else localStorage.removeItem("chaleur.lastid"); }catch(e){}
        el.innerHTML=""; done(s);}
      catch(e){btn.disabled=false; err.textContent=(e&&e.message)||"Couldn't sign in."; q("#ca-pin").value=""; q("#ca-pin").focus();}};
    btn.onclick=go; q("#ca-pin").addEventListener("keydown",e=>{if(e.key==="Enter")go();}); q("#ca-id").addEventListener("keydown",e=>{if(e.key==="Enter")q("#ca-pin").focus();});
    setTimeout(()=>{const x=q(last?"#ca-pin":"#ca-id"); x&&x.focus();},50);
  }
  const HOME="index.html";
  /* One sign-in page for everything: other pages send you to the home page and it brings you back. */
  function toLogin(msg){ const here=(location.pathname.split("/").pop()||HOME)+location.search+location.hash; location.replace(HOME+"?next="+encodeURIComponent(here)+(msg?"&msg="+encodeURIComponent(msg):"")); }
  function logout(){const s=get(); clear(); if(s){try{run("logout",s.t).catch(()=>{});}catch(e){}} setTimeout(()=>location.replace(HOME),150);}
  /* Owner: "View as" another role, to see each person's screens without signing out */
  const VA=[["owner","Owner (you)"],["manager","Manager"],["office","Office"],["supervisor","Kitchen supervisor"],["kitchen","Kitchen"],["auditor","Team"]];
  const canView=()=>{ const c=get(); return !!(c&&(c.as||c.role==="owner")); };
  const vaSelect=()=>{ const c=get()||{}; return `<select class="ca-va" data-ca-viewas="1" aria-label="See the app as">${VA.map(([v,l])=>`<option value="${v}" ${(c.as||"owner")===v?"selected":""}>${v==="owner"?l:"View as "+l}</option>`).join("")}</select>`; };
  const chip=s=>s?`<span class="ca-chip"><span class="ca-si">Signed in as </span><b>${esc(s.name)}</b><span class="ca-rl"> · ${esc(ROLE[s.role]||s.role)}</span>${canView()?" "+vaSelect():""} <button type="button" data-ca-logout="1">Log out</button></span>`:"";
  async function switchView(role){ const c=get(); if(!c) return; document.body.style.opacity=".5";
    try{ const r=await run("viewAs",c.t,role); save({t:r.token,name:r.name,role:r.role,exp:r.exp,remember:!!r.remember,as:r.as||""}); location.reload(); }
    catch(e){ document.body.style.opacity=""; alertBar((e&&e.message)||"Couldn't switch."); } }
  function alertBar(m){ const d=document.createElement("div"); d.className="ca-vabar"; d.setAttribute("role","alert"); d.textContent=m; document.body.prepend(d); setTimeout(()=>d.remove(),5000); }
  document.addEventListener("change",e=>{ const t=e.target; if(t&&t.matches&&t.matches("[data-ca-viewas]")) switchView(t.value); });
  document.addEventListener("click",e=>{ const b=e.target&&e.target.closest&&e.target.closest("[data-ca-viewback]"); if(b){ e.preventDefault(); switchView("owner"); } });
  /* While viewing as another role, a strip at the top of every page says so */
  function vaStrip(){ const c=get(); if(!c||!c.as||document.getElementById("ca-vastrip")) return; const d=document.createElement("div"); d.id="ca-vastrip"; d.className="ca-vabar";
    d.innerHTML=`<span>👁 You're seeing the app as <b>${esc(ROLE[c.as]||c.as)}</b>. Changes you make are recorded as ${esc(c.name)}.</span><span class="ca-vact">${vaSelect()}<button type="button" data-ca-viewback="1">Back to Owner</button></span>`; document.body.prepend(d); }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",vaStrip); else setTimeout(vaStrip,0);
  /* Where a "what to do next" item goes: page + tab (#hash) + kitchen team */
  const nextHref=g=>g?(g.page+(g.team?"?team="+encodeURIComponent(g.team):"")+(g.hash?"#"+g.hash:"")):"";
  const nextList=(items,links)=>`<ul class="ca-next">${(items||[]).map(x=>`<li><i class="${esc(x.sev)}"></i><span>${links&&x.go?`<a href="${esc(nextHref(x.go))}">${esc(x.text)}</a>`:esc(x.text)}</span></li>`).join("")}</ul>`;
  document.addEventListener("click",e=>{const b=e.target&&e.target.closest&&e.target.closest("[data-ca-logout]"); if(b){e.preventDefault(); b.disabled=true; logout();}});
  /* Report a problem: what's wrong (same list as the server). Short names are used in My reports. */
  const FBK=[["app","App not working","App problem"],["numbers","Wrong numbers","Wrong numbers"],["equipment","Equipment broken","Equipment"],["stock","Stock / ingredients","Stock"],["safety","Food safety","Food safety"],["idea","Idea / other","Idea"]];
  const fbl=k=>(FBK.find(x=>x[0]===k)||["","Other","Other"]);
  const FBS={open:"New",doing:"Being fixed",done:"✓ Done"};
  /* Photo for a report: made smaller (max 1280 px, JPEG) so it sends fast on a phone */
  const shrink=file=>new Promise((res,rej)=>{ const r=new FileReader(); r.onerror=()=>rej(new Error("Couldn't read the photo.")); r.onload=()=>{ const im=new Image(); im.onerror=()=>rej(new Error("Couldn't read the photo."));

  let openHelp=()=>{};

          <div style="font-size:15px;color:var(--muted,#6f5f62);line-height:1.5">Your report <b style="color:var(--ink,#2b1b1e)">#${esc(x.ref)}</b> went to the office. ${x.urgent?"Marked urgent: your supervisor gets a WhatsApp now.":"You'll see replies in My reports."}</div>

          <button type="button" class="ca-lnk" data-hv="mine">See my reports ›</button></div></div>
          <div class="ca-foot"><button type="button" class="ca-sec56" data-fbreset="1">Report something else</button><button type="button" class="ca-pri56" data-fbclose="1">Back to my work</button></div>`; }

        <div><div class="ca-eb">What's wrong?</div><div class="ca-types">${FBK.map(([k,l])=>`<button type="button" data-fbt="${k}" aria-pressed="${FB.type===k}">${esc(l)}</button>`).join("")}</div></div>
        <div><div class="ca-eb">Tell us in one line (any language)</div><textarea class="ca-ft" placeholder="e.g. Freezer 2 door doesn't close / Send button stuck" aria-label="What happened">${esc(FB.text)}</textarea></div>

        <button type="button" class="ca-urg" data-fburg="1" aria-pressed="${FB.urgent}"><i aria-hidden="true">${FB.urgent?"✓":""}</i><span><b>Urgent</b>: it stops my work right now</span></button>
        <p class="ca-note">We attach the page you were on (<b>${esc(pageName())}</b>) and your name, so you don't need to explain where.${lm?` We also attach the last message on your screen: “${esc(lm)}”.`:""}</p>
        ${FB.err?`<p class="ca-err" role="alert">${esc(FB.err)}</p>`:""}
        ${mc?`<button type="button" class="ca-lnk" data-hv="mine">My reports · ${esc(mc)} ›</button>`:""}</div>
        <div class="ca-foot"><button type="button" class="ca-go60" data-fbsend="1" ${!FB.type||FB.busy?"disabled":""}>${FB.busy?"Sending…":FB.type?"Send report":"Pick what's wrong first"}</button></div>`; }
    function mineHtml(){

        MINE.map(x=>`<div class="ca-rc ${x.status==="done"?"done":""}"><div class="ca-rt"><b>${esc(fbl(x.kind)[2])}${x.urgent?" · Urgent":""}</b><span class="ca-pill ${esc(x.status)}">${esc(FBS[x.status]||x.status)}</span></div>
          ${x.text?`<div class="ca-tx">${esc(x.text)}</div>`:""}${x.reply?`<div class="ca-rp"><b>${esc(cap(String(x.updBy||"Office").split(" ")[0]))}:</b> ${esc(x.reply)}</div>`:""}
          <div class="ca-mt">${x.ref?"#"+esc(x.ref)+" · ":""}${esc(dayTxt(x.at))}</div></div>`).join("");

<main id="main"><p class="hint">Loading…</p></main>
</div>
<div id="menu"></div>
<script>
const $=s=>document.querySelector(s), esc=CA.esc;
const QS=new URLSearchParams(location.search);
/* where to go back to after signing in (only our own pages) */
const NEXT=(()=>{ const n=QS.get("next")||""; return /^(office|kitchen|audit)\.html(\?[A-Za-z0-9_=&%.-]*)?(#[A-Za-z0-9_-]*)?$/.test(n)?n:""; })();
const ALL=["owner","manager","office","supervisor","kitchen","auditor"], KIT=["kitchen","supervisor","auditor","owner","manager","office"];
/* The sections each person sees, by their access (Staff tab). Pages still check access on the server. */
const TILES=[
 ["Kitchen","Morning / Decoration","Opening report, finish & decorate, pack deliveries, orders","kitchen.html?team=am#today",KIT],
 ["Kitchen","Noon / Production","Production list, prep reminders, closing report","kitchen.html?team=pm#today",KIT],
 ["Kitchen","Production plan","The lists for the coming days, add a list from a photo","kitchen.html#plan",KIT],
 ["Kitchen","Kitchen history","Past kitchen reports, temperatures and photos","kitchen.html#history",["supervisor","owner","manager","office","auditor"]],
 ["Kitchen","Kitchen setup","HQ display cakes, fridges and freezers, reminders","kitchen.html#lists",["supervisor","owner","manager"]],
 ["Outlets & deliveries","Deliveries","Delivery orders: check colours, mark delivered","office.html#deliveries",["kitchen","supervisor","office","owner","manager"]],
 ["Outlets & deliveries","Plan & prep","Tomorrow's deliveries per outlet, prep sheet, draft DOs","office.html#plan",["supervisor","office","owner","manager"]],
 ["Outlets & deliveries","Outlets today","Missing closing reports, cakes to take off display, chase on WhatsApp","office.html#today",["supervisor","office","owner","manager","auditor"]],
 ["Outlets & deliveries","Outlet reports","Each outlet's nightly closing report and corrections","office.html#daily",["office","owner","manager","auditor"]],
 ["Outlets & deliveries","Spot audit","Check an outlet: display, prices, chiller and stock","audit.html",["auditor","office","owner","manager"]],
 ["Office","Weekly billing","Monday bills: invoice, carry forward, credit note","office.html#billing",["office","owner","manager"]],
 ["Office","Spot audit results","Every audit with photos and the PDF","office.html#audits",["office","owner","manager","auditor"]],
 ["Office","Change log","Every correction: who, when and why","office.html#log",["office","owner","manager"]],
 ["Office","Setup","Outlets & links, cakes, shelf life, prices, WhatsApp","office.html#setup",["office","owner","manager"]],
 ["Office","Problem reports","What the team reported in ? Ask: reply and mark done","office.html#feedback",["office","owner","manager"]],
 ["Office","Staff","Who can sign in, PINs and access","office.html#staff",["owner","manager"]],
];
/* Help is for everyone: these open the ? Ask sheet */
const HELP=[["? Ask the helper","How-to questions, any language","ask"],["Report a problem","App, equipment, stock, safety","fb"],["My reports","See what happened and the office's reply","mine"]];
let S=null, NX=null, MINE=null, MENU=false, OPEN=(()=>{ try{ return localStorage.getItem("chaleur.menu")||""; }catch(e){ return ""; } })();
function hi(){ const h=+new Date().toLocaleString("en-GB",{hour:"2-digit",hour12:false,timeZone:"Asia/Kuala_Lumpur"}); return h<12?"Good morning":h<17?"Good afternoon":"Good evening"; }
const cap=w=>w?w.charAt(0).toUpperCase()+w.slice(1).toLowerCase():"";
function signIn(msg){ $("#mbw").innerHTML=""; $("#hsub").textContent="Chaleur Atelier · operations"; closeMenu();
  CA.loginForm($("#main"),{title:"Sign in",lede:"One sign-in for everything: your phone number and your staff PIN. You'll see the parts of the app for your job.",msg},s=>{ S=s; if(NEXT){ location.replace(NEXT); return; } history.replaceState(null,"",location.pathname); home(); loadNext(); });
  $("#main").insertAdjacentHTML("beforeend",`<div class="c" style="max-width:390px;margin:10px auto"><b>Partner outlet?</b><p class="hint" style="margin:4px 0 0">Use your outlet's own link or QR code from Chaleur. It doesn't need a sign-in.</p></div>
    <p class="tip" style="max-width:390px;margin:18px auto 0">Tip: add this page to your home screen. iPhone: Safari › Share › Add to Home Screen. Android: Chrome › ⋮ › Add to Home screen.</p>`); }
function nextHtml(){ if(!NX) return `<p class="hint" style="margin:0">Checking what's next for you…</p>`; if(NX.err) return `<p class="err" style="margin:0">${esc(NX.err)}</p>`;
  return `<ul class="nx">${NX.items.map(x=>`<li><i class="${esc(x.sev)}"></i><span>${esc(x.text)}</span>${x.go?`<a class="b ${x.sev==="info"?"lt":""}" href="${esc(CA.nextHref(x.go))}">${esc(x.btn||"Open")}</a>`:""}</li>`).join("")}</ul>`; }
function todayTxt(){ try{ return new Date().toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",timeZone:"Asia/Kuala_Lumpur"}).replace(",",""); }catch(e){ return ""; } }
function countTxt(){ if(!NX||NX.err) return todayTxt(); const n=(NX.items||[]).filter(x=>x.sev!=="ok").length; return todayTxt()+" · "+(n?n+(n===1?" thing":" things")+" for you":"all done for now"); }
function home(){ const s=S, role=s.role;
  $("#hsub").textContent=CA.ROLE[role]||role;
  $("#mbw").innerHTML=`<button class="mb" id="mb" type="button" aria-haspopup="true" aria-expanded="${MENU}" aria-controls="menu"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span><span id="mbl">${MENU?"Close":"Menu"}</span></button>`;
  $("#main").innerHTML=`<div class="hello"><h2>${esc(hi())}, ${esc(cap(String(s.name||"").split(" ")[0]))}</h2><div class="sub" id="cnt">${esc(countTxt())}</div></div>
    <div class="c" id="next"><h2>Next for you</h2>${nextHtml()}</div>
    <p class="tip">Everything else is in <b>Menu</b> at the top. Stuck? Tap <b>? Ask</b> at the bottom right, in English, Malay or Chinese. Urgent: WhatsApp Alfred 014-665 0928.</p>`;
  if(MENU) drawMenu(); }
/* ---------- 2a: the menu ---------- */
function sections(){ const role=S.role, tiles=TILES.filter(x=>x[4].includes(role)), secs=[...new Set(tiles.map(x=>x[0]))];
  const mc=MINE&&MINE.length?[MINE.filter(x=>x.status==="doing").length?MINE.filter(x=>x.status==="doing").length+" being fixed":"",MINE.filter(x=>x.status==="open").length?MINE.filter(x=>x.status==="open").length+" new":""].filter(Boolean).join(" · "):"";
  return secs.map(sec=>({name:sec,items:tiles.filter(x=>x[0]===sec).map(x=>({t:x[1],d:x[2],href:x[3]}))}))
    .concat([{name:"Help",items:HELP.map(([t,d,v])=>({t,d:v==="mine"&&mc?mc:d,help:v}))}]); }
function drawMenu(){ const m=$("#menu"); if(!MENU||!S){ m.innerHTML=""; return; }
  const hd=$("#hd").getBoundingClientRect(); document.documentElement.style.setProperty("--mt",Math.round(Math.max(0,hd.bottom))+"px");
  const secs=sections(); if(OPEN&&!secs.some(x=>x.name===OPEN)) OPEN="";
  m.innerHTML=`<div class="mbd" data-mclose="1"></div><nav class="mp" aria-label="Menu">${secs.map(sec=>{ const op=OPEN===sec.name;
      return `<div class="ms"><button type="button" data-msec="${esc(sec.name)}" aria-expanded="${op}"><span><b>${esc(sec.name)}</b><small>${sec.items.length} ${sec.items.length===1?"page":"pages"}</small></span><span class="chev" aria-hidden="true">${op?"▴":"▾"}</span></button>
        ${op?`<div class="mi">${sec.items.map(it=>it.help?`<button type="button" data-help="${it.help}"><span><b>${esc(it.t)}</b><small>${esc(it.d)}</small></span><span class="go" aria-hidden="true">›</span></button>`:`<a href="${esc(it.href)}"><span><b>${esc(it.t)}</b><small>${esc(it.d)}</small></span><span class="go" aria-hidden="true">›</span></a>`).join("")}</div>`:""}</div>`; }).join("")}
    <div class="mf"><button type="button" class="ask" data-help="fb">? Ask / Report</button><button type="button" class="out" data-ca-logout="1">Log out</button></div>
    ${CA.canView()?`<label class="mva"><span>Owner: see the app as</span>${CA.vaSelect()}</label>`:""}</nav>`; }
function setMenu(on){ MENU=!!on; const b=$("#mb"); if(b){ b.setAttribute("aria-expanded",String(MENU)); $("#mbl").textContent=MENU?"Close":"Menu"; } drawMenu(); if(MENU&&!MINE) loadMine(); }
function closeMenu(){ if(MENU) setMenu(false); }
document.addEventListener("click",e=>{ const t=e.target&&e.target.closest?e.target:null; if(!t) return;
  if(t.closest("#mb")){ setMenu(!MENU); return; }
  if(t.closest("[data-mclose]")){ setMenu(false); return; }
  const sb=t.closest("[data-msec]"); if(sb){ const n=sb.dataset.msec; OPEN=OPEN===n?"":n; try{ localStorage.setItem("chaleur.menu",OPEN); }catch(x){} drawMenu(); return; }
  const h=t.closest("[data-help]"); if(h){ setMenu(false); CA.openHelp(h.dataset.help); return; } });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&MENU){ setMenu(false); const b=$("#mb"); b&&b.focus(); } });
window.addEventListener("resize",()=>{ if(MENU) drawMenu(); });
async function loadMine(){ try{ MINE=await CA.run("feedbackMine",S.t); }catch(e){ MINE=[]; } if(MENU) drawMenu(); }
async function loadNext(){ try{ NX=await CA.run("myNext",S.t); }catch(e){ if(CA.isAuthErr(e)){ CA.clear(); S=null; return signIn(e.message); } NX={err:"Couldn't load your list ("+e.message+"). Pull down to refresh."}; }
  const n=$("#next"); if(n) n.innerHTML=`<h2>Next for you</h2>${nextHtml()}`; const c=$("#cnt"); if(c) c.textContent=countTxt(); }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&S){ loadNext(); MINE=null; } });
(function(){ CA.helper({auth:()=>S&&S.t,page:()=>"Home"});
  S=CA.get(); if(!S) return signIn(QS.get("msg")||"");
  if(NEXT){ location.replace(NEXT); return; }
  home(); loadNext(); })();
</script>
</body></html>
