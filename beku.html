<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFDFA">
<title>beku packing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2A1E2E;--milk:#FFFDFA;--sugar:#F6F1F3;--muted:#6B5E6E;--hair:#E8DFE3;
--pistachio-l:#D5F0B4;--pistachio-m:#9FDA6A;--pistachio-d:#2F6B12;--lemon-l:#FFF0A0;--lemon-m:#FFD93D;--lemon-d:#7A5A00;
--bubblegum-l:#FFC6DA;--bubblegum-m:#FF8DB6;--bubblegum-d:#A30F47;--baby-l:#CBE9F8;--baby-m:#8FCDF0;--baby-d:#17558C;
--tangerine-l:#FFD2A8;--tangerine-m:#FF9D4D;--tangerine-d:#943800;--lilac-l:#E3D6FF;--lilac-m:#BBA1FF;--lilac-d:#5232A8;
--cocoa-l:#EFD9C8;--cocoa-m:#D9AE8E;--cocoa-d:#6A3416}
*{box-sizing:border-box}
html,body{margin:0;background:var(--milk);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:40px}
a{color:var(--ink)}
.disp{font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:700;letter-spacing:-.01em}
.top{display:flex;align-items:center;gap:12px;padding:18px 20px 8px}
.top h1{margin:0;font-size:26px;line-height:1.05}
.top .t{flex:1;min-width:0}
.sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ib{width:44px;height:44px;flex:none;border-radius:999px;border:0;background:var(--sugar);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);text-decoration:none}
.ib svg{width:22px;height:22px}
.wrap{padding:0 20px;display:flex;flex-direction:column;gap:14px}
.eb{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.spec{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border-radius:999px;border:0;background:var(--ink);color:var(--milk);font:700 16px 'DM Sans',sans-serif;text-decoration:none;width:100%;cursor:pointer;padding:0 18px}
.btn.s{background:var(--sugar);color:var(--ink)}
.btn.w{background:#25D366;color:#fff}
.btn:disabled{opacity:.45}
.btn svg{width:20px;height:20px}
.card{border-radius:20px;background:var(--sugar);padding:14px 16px}
.line{border-radius:20px;border:1px solid var(--hair);padding:12px 16px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{height:128px;border-radius:20px;padding:16px;text-decoration:none;display:flex;flex-direction:column;justify-content:space-between;border:0;text-align:left;font-family:inherit;cursor:pointer}
.tile .n{font-family:'Fredoka',sans-serif;font-weight:600;font-size:22px}
.tile .st{font-size:12px;font-weight:700;letter-spacing:.08em}
.tile small{font-size:13px}
.tile[disabled]{opacity:.45}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{min-height:52px;padding:8px 12px;border-radius:16px;border:2px solid var(--hair);background:var(--milk);color:var(--ink);font:500 14px 'DM Sans',sans-serif;text-align:left;display:flex;align-items:center;gap:8px;cursor:pointer}
.chip .d{width:10px;height:10px;border-radius:99px;flex:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:999px;background:var(--sugar)}
.seg button{min-height:44px;border-radius:999px;border:0;background:transparent;font:500 14px 'DM Sans',sans-serif;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--ink);color:var(--milk);font-weight:700}
.stp{display:flex;align-items:center;gap:12px}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.stp input{-moz-appearance:textfield}.stp span{font-family:'Fredoka',sans-serif;font-weight:700;font-size:32px;min-width:56px;text-align:center}
input[type=tel],input[type=password],input[type=text],input[type=date],input[type=number]{width:100%;min-height:52px;border-radius:16px;border:2px solid var(--hair);background:var(--milk);font:500 17px 'DM Sans',sans-serif;padding:0 14px;color:var(--ink)}
label.lb{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.grid{display:grid;gap:8px}
.cell{height:52px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:14px;text-decoration:none;color:var(--muted);background:var(--sugar)}
.cell.ok{background:var(--pistachio-l);color:var(--pistachio-d)}
.cell.half{background:var(--baby-l);color:var(--baby-d)}
.cell.void{background:transparent;border:2px dashed var(--hair);text-decoration:line-through}
.bar{height:10px;border-radius:99px;background:var(--hair);overflow:hidden}.bar i{display:block;height:100%;background:var(--pistachio-m)}
.alert{border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45}
.alert.r{background:var(--bubblegum-l);color:var(--bubblegum-d)}.alert.y{background:var(--lemon-l);color:var(--lemon-d)}.alert.g{background:var(--pistachio-l);color:var(--pistachio-d)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tbl>div{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--hair);font-size:15px}.tbl>div:last-child{border-bottom:0}.tbl span{color:var(--muted)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{border-radius:20px;border:2px dashed var(--hair);min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;text-align:center;position:relative;overflow:hidden;cursor:pointer;background:var(--milk)}
.slot.done{border:2px solid var(--pistachio-m);background:var(--pistachio-l)}
.slot img{width:100%;height:120px;object-fit:cover;border-radius:12px}
.slot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.num{width:26px;height:26px;border-radius:99px;background:var(--ink);color:var(--milk);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sheet{position:fixed;inset:0;background:rgba(42,30,46,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet>div{background:var(--ink);color:var(--milk);width:100%;max-width:520px;border-radius:32px 32px 0 0;padding:20px 20px 28px;display:flex;flex-direction:column;gap:12px}
.sheet .btn.s{background:var(--milk)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.thumbs img{width:100%;border-radius:8px;border:1px solid var(--hair);background:#fff}
.read span{padding:3px 7px;border-radius:9px;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--milk);padding:12px 18px;border-radius:999px;font-size:14px;z-index:60;max-width:90vw}
.pend{position:fixed;right:12px;top:12px;background:var(--lemon-l);color:var(--lemon-d);font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px;z-index:40}
video{width:100%;border-radius:20px;background:#000;max-height:60vh;object-fit:cover}
.hide{display:none!important}
.pub .hero{margin:0 20px;padding:16px 16px 16px 20px;border-radius:32px;display:flex;align-items:center;gap:12px}
.pub .hero img{width:104px;height:104px;object-fit:contain;flex:none}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kv div{border-radius:16px;background:var(--sugar);padding:12px 14px}.kv small{display:block;font-size:12px;color:var(--muted)}.kv b{font-size:15px}
.txt{font-size:13px;line-height:1.5}
.temp{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:var(--ink);color:var(--milk);font-size:12px;font-weight:700}
.temp i{width:8px;height:8px;border-radius:99px;border:2px solid var(--pistachio-m)}
</style>
</head>

<script>
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';

/* ---------------- offline photo queue (IndexedDB) ---------------- */
const DB = { db: null };
function idb() { return DB.db ? Promise.resolve(DB.db) : new Promise((res, rej) => { const r = indexedDB.open('beku', 1); r.onupgradeneeded = () => r.result.createObjectStore('q', { keyPath: 'nonce' }); r.onsuccess = () => { DB.db = r.result; res(DB.db); }; r.onerror = () => rej(r.error); }); }
function qAll() { return idb().then(db => new Promise(res => { const out = []; const tx = db.transaction('q').objectStore('q').openCursor(); tx.onsuccess = e => { const c = e.target.result; if (c) { out.push(c.value); c.continue(); } else res(out); }; })); }
function qPut(x) { return idb().then(db => new Promise(res => { const tx = db.transaction('q', 'readwrite'); tx.objectStore('q').put(x); tx.oncomplete = res; })); }
function qDel(n) { return idb().then(db => new Promise(res => { const tx = db.transaction('q', 'readwrite'); tx.objectStore('q').delete(n); tx.oncomplete = res; })); }
let flushing = false;
async function flush() {
  if (flushing || !S.tok) return; flushing = true;
  try {
    const all = await qAll(); showPend(all.length);
    for (const x of all) {
      try { await api('photo', S.tok, x.cid, x.slot, x.data, x.nonce, x.at); await qDel(x.nonce);
        const cc = CC[x.cid]; if (cc && cc.staff) { cc.staff['p' + x.slot] = true; if (cc.staff.p1 && cc.staff.p2) cc.staff.status = 'packed'; if (location.hash === '#carton/' + encodeURIComponent(x.cid)) cartonView(x.cid, true); } }
      catch (e) { if (e.server) { await qDel(x.nonce); toast(x.cid + ': ' + e.message, 5000); } else break; }
      showPend((await qAll()).length);
    }
  } finally { flushing = false; }
}
function showPend(n) { const p = $('#pend'); if (n) { p.textContent = n + ' photo' + (n > 1 ? 's' : '') + ' waiting to upload'; p.classList.remove('hide'); } else p.classList.add('hide'); }
window.addEventListener('online', flush); setInterval(flush, 30000);

/* ---------------- router ---------------- */
async function route(force) {
  const q = new URLSearchParams(location.search), c = q.get('c');
  const h = location.hash.replace(/^#\/?/, ''), [v, a] = h.split('/');
  window.scrollTo(0, 0);
  try {
    if (c && !S.tok) return pub(c);
    if (!S.tok) return signin();
    if (c && !v) return cartonView(c);
    if (v === 'new') return newBatch();
    if (v === 'print') return printView(decodeURIComponent(a));
    if (v === 'batch') return batchView(decodeURIComponent(a));
    if (v === 'carton') return cartonView(decodeURIComponent(a));
    if (v === 'close') return closeView(decodeURIComponent(a));
    if (v === 'scan') return scanView();
    if (v === 'prints') return printsView();
    return home();
  } catch (e) { fail(e); }
}

/* ---------------- new batch ---------------- */
async function newBatch() {
  const c = await cat(); const st = { sku: '', ct: 'CTN', n: 20, made: nowParts().iso };
  const draw = () => {
    const p = c.find(x => x.sku === st.sku), cts = p ? p.ct : [{ t: 'CTN' }], today = nowParts().iso;
    if (p && !cts.find(x => x.t === st.ct)) st.ct = cts[0].t;
    const ctObj = p ? cts.find(x => x.t === st.ct) : null, changed = st.made !== today;
    app.innerHTML = hdr('new batch', '#') + '<div class="wrap">' +
      '<div class="eb">1 · Product</div><div class="chips">' + c.map(x => '<button class="chip" data-sku="' + x.sku + '" style="' + (x.sku === st.sku ? 'border-color:' + fc(x.fam, 1) + ';background:' + fc(x.fam, 0) + ';color:' + fc(x.fam, 1) + ';font-weight:700' : '') + '"><span class="d" style="background:' + fc(x.fam, x.sku === st.sku ? 1 : 2) + '"></span>' + esc(title(x.name)) + '</button>').join('') + '</div>' +

      (ctObj ? '<div class="sub" style="font-size:13px">' + esc(ctObj.pack) + ' · ' + esc(ctObj.net) + '</div>' : '') +
      '<div class="row"><div class="eb">3 · Cartons</div><div class="stp"><button class="ib" data-n="-1" aria-label="One less">' + ic('minus') + '</button><input id="cn" type="number" inputmode="numeric" min="1" max="200" value="' + st.n + '" aria-label="Number of cartons" style="width:84px;min-height:52px;text-align:center;font:700 28px Fredoka,sans-serif;border-radius:16px;border:2px solid var(--hair);background:var(--milk);color:var(--ink);padding:0"><button class="ib" data-n="1" aria-label="One more">' + ic('plus') + '</button></div></div>' +
      '<div class="line" style="padding:0"><div class="row" style="padding:12px 16px;border-bottom:1px solid var(--hair)"><div><div class="sub" style="font-size:13px">Production date</div><div style="font-weight:700;font-size:16px' + (changed ? ';color:var(--bubblegum-d)' : '') + '">' + (changed ? 'Changed to ' : 'Today · ') + dmy(st.made) + '</div></div><label class="btn s" style="width:auto;min-height:44px;font-size:14px;position:relative">Change<input type="date" id="md" max="' + today + '" value="' + st.made + '" style="position:absolute;inset:0;opacity:0"></label></div>' +
      '<div class="row" style="padding:12px 16px"><div><div class="sub" style="font-size:13px">Best before</div><div style="font-weight:700;font-size:16px">' + dmy(addMonths(st.made, 9)) + '</div></div><span class="spec" style="color:var(--muted)">AUTO · +9 MONTHS</span></div></div>' +
      '<button class="btn" id="mk"' + (p ? '' : ' disabled') + '>' + (p ? 'Make ' + st.n + ' stickers' : 'Pick a product first') + '</button></div>';
    app.querySelectorAll('[data-sku]').forEach(b => b.onclick = () => { st.sku = b.dataset.sku; draw(); });
    app.querySelectorAll('[data-ct]').forEach(b => b.onclick = () => { st.ct = b.dataset.ct; draw(); });
    app.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { st.n = Math.max(1, Math.min(200, st.n + +b.dataset.n)); draw(); });
    const cn = $('#cn');
    cn.onfocus = () => cn.select();
    cn.oninput = () => { const v = Math.floor(+cn.value); if (v >= 1 && v <= 200) { st.n = v; const mk = $('#mk'); if (mk && p) mk.textContent = 'Make ' + st.n + ' stickers'; } };
    cn.onchange = () => { const v = Math.floor(+cn.value); st.n = v >= 1 ? Math.min(200, v) : 1; if (!(v >= 1 && v <= 200)) toast('Cartons: 1 to 200'); draw(); };
    $('#md').onchange = e => {
      const v = e.target.value, t = nowParts().iso; if (!v) return;
      if (v > t) { toast('Production date cannot be in the future.'); return draw(); }
      const back = (Date.parse(t) - Date.parse(v)) / 864e5;
      if (back > 7 && !confirm('Made on ' + dmy(v) + '? That is ' + Math.round(back) + ' days ago.')) return draw();
      st.made = v; draw();
    };
    const mk = $('#mk'); if (mk) mk.onclick = async () => {

      catch (e) { fail(e); mk.disabled = false; mk.textContent = 'Make ' + st.n + ' stickers'; }
    };
  };

}

let LAYOUT = null;
async function layout() { if (!LAYOUT) LAYOUT = await fetch('beku/labels/layout.json').then(r => r.json()); return LAYOUT; }
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Label image missing: ' + src)); i.src = src; }); }
function fitText(ctx, txt, box, size, weight, align) {
  let s = size; ctx.font = weight + ' ' + s + 'px "DM Sans", Arial, Helvetica, sans-serif';
  while (ctx.measureText(txt).width > box[2] - 24 && s > 10) { s -= 1; ctx.font = weight + ' ' + s + 'px "DM Sans", Arial, Helvetica, sans-serif'; }
  ctx.textBaseline = 'middle'; ctx.textAlign = align || 'left';
  ctx.fillText(txt, align === 'center' ? box[0] + box[2] / 2 : box[0] + 14, box[1] + box[3] / 2 + 1);
}
async function sticker(b, c) {
  const L = (await layout())[b.sku], base = await loadImg('beku/labels/' + b.sku + '.png');

  app.innerHTML = hdr('carton ' + String(c.n).padStart(2, '0'), '#batch/' + encodeURIComponent(c.batch)) + '<div class="wrap">' +
    '<div class="row" style="justify-content:flex-start"><span class="temp" style="background:var(--pistachio-l);color:var(--pistachio-d)">' + ic('check', null, 14) + 'Matched</span><span class="spec" style="color:var(--muted)">' + esc(c.carton) + '</span></div>' +
    '<div class="card" style="background:' + fc(c.fam, 0) + ';color:' + fc(c.fam, 1) + '"><div class="disp" style="font-size:22px;font-weight:600">' + esc(title(c.name)) + '</div><div style="font-size:14px">Carton ' + c.n + ' of ' + c.of + ' · ' + esc(c.pack) + ' · best before ' + c.bestBefore + '</div></div>' +
    (c.void ? '<div class="alert r"><b>Void.</b> This carton number was cancelled. Do not use this sticker.</div>' : '') +
    (closed ? '<div class="alert y">This batch is closed. Photos can no longer be changed.</div>' : '') +
    '<div class="slots">' + slot(1, 'Cakes, from the top', 'Lid open, all cakes in the photo') + slot(2, 'Label side', 'Sticker readable, carton side') + '</div>' +
    (s.at ? '<div class="sub" style="font-size:13px">Last photo by ' + esc(title(s.by)) + ' · ' + esc(String(s.at).slice(0, 16)) + '</div>' : '') +
    '<a class="btn" href="#scan">' + ic('scan', '#FFFDFA') + 'Scan next carton</a><a class="btn s" href="#batch/' + encodeURIComponent(c.batch) + '">Back to the batch</a>' +
    (!closed && !c.void && s.status !== 'packed' ? '<button class="btn s" id="vd" style="min-height:44px;font-size:14px;color:var(--bubblegum-d)">Void this sticker (damaged / not used)</button>' : '') +
    (!closed && c.void ? '<button class="btn s" id="uv" style="min-height:44px;font-size:14px">Undo void</button>' : '') + '</div>';
  const vd = $('#vd'); if (vd) vd.onclick = async () => { if (!confirm('Void carton ' + c.n + '? Throw this sticker away. To replace it, reprint carton ' + c.n + ' from the print page.')) return; vd.disabled = true; try { await api('voidCartons', S.tok, c.batch, [id]); toast('Carton ' + c.n + ' voided'); cartonView(id); } catch (e) { fail(e); vd.disabled = false; } };
  const uv = $('#uv'); if (uv) uv.onclick = async () => { uv.disabled = true; try { await api('reopenCarton', S.tok, id); toast('Void undone'); cartonView(id); } catch (e) { fail(e); uv.disabled = false; } };
  app.querySelectorAll('input[data-slot]').forEach(inp => inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return; const k = +inp.dataset.slot;
    try {
      const data = await compress(f), nonce = id + '_' + k + '_' + Date.now();
      await qPut({ nonce: nonce, cid: id, slot: k, data: data, at: new Date().toLocaleString('sv-SE', { timeZone: TZ }) });
      toast('Photo ' + k + ' saved'); cartonView(id, true); flush();
    } catch (e) { toast('Could not read the photo: ' + e.message, 4000); }
  });
}

/* ---------------- close batch ---------------- */
async function closeView(id) {
  app.innerHTML = hdr('close batch', '#batch/' + encodeURIComponent(id)) + '<div class="wrap"><div class="card">Loading…</div></div>';
  await flush();
  const b = await api('batchGet', S.tok, id), live = b.list.filter(c => c.status !== 'void'), done = live.filter(c => c.status === 'packed'), miss = live.filter(c => c.status !== 'packed'), vd = b.list.filter(c => c.status === 'void');
  const pend = (await qAll()).length;
  app.innerHTML = hdr('close batch', '#batch/' + encodeURIComponent(id)) + '<div class="wrap"><div class="spec" style="color:var(--muted)">' + esc(b.batch) + ' · ' + esc(title(b.name)) + '</div>' +
    '<div class="line tbl" style="padding:0"><div><span>Packed with both photos</span><b>' + done.length + ' ' + esc(b.ctype) + '</b></div><div><span>Not packed yet</span><b>' + (miss.length ? 'Carton' + (miss.length > 1 ? 's ' : ' ') + miss.map(c => c.n).join(', ') : 'None ✓') + '</b></div><div><span>Void stickers</span><b>' + (vd.length ? 'Carton' + (vd.length > 1 ? 's ' : ' ') + vd.map(c => c.n).join(', ') : 'None') + '</b></div><div><span>Made · best before</span><b>' + b.madeDmy + ' · ' + b.bbDmy + '</b></div></div>' +
    (pend ? '<div class="alert y">' + pend + ' photo(s) still waiting to upload. Get signal first, then close.</div>' : '') +
    (miss.length ? '<div class="alert r">' + (miss.length > 1 ? 'Cartons ' + miss.map(c => c.n).join(', ') + ' have' : 'Carton ' + miss[0].n + ' has') + ' no full photos. If they were not packed, closing marks them <b>void</b>: throw those stickers away.</div>' : '') +
    '<button class="btn" id="cl"' + (pend || !done.length ? ' disabled' : '') + '>' + ic('check', '#FFFDFA') + (miss.length ? 'Void ' + miss.length + ' unused sticker' + (miss.length > 1 ? 's' : '') + ' &amp; close batch' : 'Close batch') + '</button>' + (!done.length ? '<div class="sub" style="font-size:13px">No carton has both photos yet. Nothing packed? Go back and use <b>Cancel this batch</b>.</div>' : '') + '<div id="rep"></div></div>';
  $('#cl').onclick = async () => {
    if (miss.length && !confirm('Void cartons ' + miss.map(c => c.n).join(', ') + ' and close the batch?')) return;
    $('#cl').disabled = true;
    try {
      const r = await api('closeBatch', S.tok, id, true);
      $('#cl').remove();
      $('#rep').innerHTML = '<div class="alert g"><b>Batch closed.</b> ' + r.packed + ' ' + esc(b.ctype) + ' in stock at HQ Freezer.</div><div class="eb" style="margin-top:12px">Report to the BEKU WhatsApp</div><div class="card txt" style="white-space:pre-line;border-radius:16px 16px 16px 4px">' + esc(r.report) + '</div><a class="btn w" href="' + r.wa + '" target="_blank" rel="noopener">' + ic('share', '#fff') + 'Send report on WhatsApp</a><a class="btn s" href="#">Home</a>';
      $('#rep').style.cssText = 'display:flex;flex-direction:column;gap:10px';
    } catch (e) { fail(e); $('#cl').disabled = false; }
  };
}

/* ---------------- public carton page (no sign-in) ---------------- */
async function pub(id) {
  app.innerHTML = '<div class="top"><div class="t">' + LOGO + '</div></div><div class="wrap"><div class="card">Loading…</div></div>';
  let c; try { c = await api('carton', id); } catch (e) { app.innerHTML = '<div class="top"><div class="t">' + LOGO + '</div></div><div class="wrap"><div class="alert r">' + esc(e.message) + '</div></div>'; return; }
  document.title = 'beku · ' + title(c.name);
  app.innerHTML = '<div class="pub"><div class="top" style="justify-content:space-between"><div>' + LOGO + '</div><span class="temp"><i></i>-18°C</span></div>' +
    '<div class="hero" style="background:' + fc(c.fam, 0) + ';color:' + fc(c.fam, 1) + '"><div style="flex:1;min-width:0"><div class="disp" style="font-size:32px;line-height:1">' + esc(c.name.toLowerCase()) + '</div><div class="spec" style="margin-top:6px">' + esc(c.sku) + ' · ' + esc(c.pack) + '</div></div><img src="beku/img/' + c.sku + '.png" alt="' + esc(title(c.name)) + '"></div>' +
    '<div class="wrap" style="margin-top:16px">' + (c.void ? '<div class="alert r">This carton number is not valid.</div>' : '') +
    '<div class="kv"><div><small>Batch</small><b>' + esc(c.batch) + '</b></div><div><small>Carton</small><b>' + String(c.n).padStart(2, '0') + ' of ' + c.of + '</b></div><div><small>Made</small><b>' + c.made + '</b></div><div><small>Best before</small><b>' + c.bestBefore + '</b></div></div>' +
    '<div><div class="eb">Ingredients</div><div class="txt">' + esc(c.ing || '—') + '</div></div>' +
    '<div><div class="eb">Allergens</div><div class="txt">' + (c.contains ? '<b>Contains:</b> ' + esc(c.contains) + '. ' : '') + 'May contain traces of ' + esc(c.may) + '.</div></div>' +
    '<div><div class="eb">To serve</div><div class="txt">Keep frozen at -18°C. ' + esc(c.serve) + ' Do not refreeze.</div></div>' +
    '<div class="sub" style="font-size:11.5px;line-height:1.45;border-top:1px solid var(--hair);padding-top:14px">Manufactured by Chaleur Atelier F&amp;B Sdn. Bhd. (202501028873) · 01-03, Zennith Suites Service Apartments, Jalan Kebun Teh 2, Larkin, 80250 Johor Bahru, Johor · Product of Malaysia</div></div></div>';
}

route(); flush();
</script>
