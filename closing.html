<script>
/* Chaleur sign-in (phone + PIN, remember me, log out) and the in-app helper. Shared by the office desk, kitchen and audit pages. */
const CA=(function(){
  const K="chaleur.s", ROLE={owner:"Owner",manager:"Manager",office:"Office",supervisor:"Kitchen supervisor",kitchen:"Kitchen",auditor:"Team"};

  const isAuthErr=e=>/sign in again|expired/i.test((e&&e.message)||"");

    opt=opt||{}; let last=""; try{last=localStorage.getItem("chaleur.lastid")||"";}catch(e){}

      <label>Phone number (or name)<input id="ca-id" type="text" autocomplete="username" autocapitalize="characters" spellcheck="false" placeholder="012-345 6789" value="${esc(last)}"></label>
      <label>PIN<input id="ca-pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="6"></label>

      <p style="font-size:12.5px;margin-top:8px">No phone number set up yet? Type your name instead. Don't tick "Remember me" on a shared phone or computer.</p></div>`;
    const q=s=>el.querySelector(s), btn=q("#ca-go"), err=q("#ca-err");

  const canView=()=>{ const c=get(); return !!(c&&(c.as||c.role==="owner")); };

  const chip=s=>s?`<span class="ca-chip"><span class="ca-si">Signed in as </span><b>${esc(s.name)}</b><span class="ca-rl"> · ${esc(ROLE[s.role]||s.role)}</span>${canView()?" "+vaSelect():""} <button type="button" data-ca-logout="1">Log out</button></span>`:"";

  const fbl=k=>(FBK.find(x=>x[0]===k)||["","Other","Other"]);
  const FBS={open:"New",doing:"Being fixed",done:"✓ Done"};
  /* Photo for a report: made smaller (max 1280 px, JPEG) so it sends fast on a phone */
  const shrink=file=>new Promise((res,rej)=>{ const r=new FileReader(); r.onerror=()=>rej(new Error("Couldn't read the photo.")); r.onload=()=>{ const im=new Image(); im.onerror=()=>rej(new Error("Couldn't read the photo."));

  let openHelp=()=>{};

          <div class="ca-foot"><button type="button" class="ca-sec56" data-fbreset="1">Report something else</button><button type="button" class="ca-pri56" data-fbclose="1">Back to my work</button></div>`; }

        <div><div class="ca-eb">Tell us in one line (any language)</div><textarea class="ca-ft" placeholder="e.g. Freezer 2 door doesn't close / Send button stuck" aria-label="What happened">${esc(FB.text)}</textarea></div>

        ${FB.err?`<p class="ca-err" role="alert">${esc(FB.err)}</p>`:""}
        ${mc?`<button type="button" class="ca-lnk" data-hv="mine">My reports · ${esc(mc)} ›</button>`:""}</div>
        <div class="ca-foot"><button type="button" class="ca-go60" data-fbsend="1" ${!FB.type||FB.busy?"disabled":""}>${FB.busy?"Sending…":FB.type?"Send report":"Pick what's wrong first"}</button></div>`; }

          ${x.text?`<div class="ca-tx">${esc(x.text)}</div>`:""}${x.reply?`<div class="ca-rp"><b>${esc(cap(String(x.updBy||"Office").split(" ")[0]))}:</b> ${esc(x.reply)}</div>`:""}

.status{flex-basis:100%;font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-weight:600}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.mute{background:var(--soft);color:var(--muted)}
.done{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:24px}
.done .ok{width:56px;height:56px;border-radius:50%;background:var(--go);color:#fff;display:grid;place-items:center;font-size:28px}
.sheet{position:fixed;inset:0;background:rgba(20,10,12,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--paper);width:100%;max-width:640px;max-height:85vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.pick{display:flex;align-items:center;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 2px;color:var(--ink);font:500 15px var(--body);cursor:pointer;text-align:left}
.pick .pic{width:40px;height:40px}
.cols{display:flex;gap:8px;flex-wrap:wrap}
.cols button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;cursor:pointer;font:500 11px var(--body);color:var(--muted)}
.cols button i{width:34px;height:34px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted);text-align:center}

async function shrink(file,max){
  const url=URL.createObjectURL(file);
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
  const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
  return c.toDataURL("image/jpeg",0.85);
}

  const shown=new Set(SHOWN);
  let body;
  if(false){const p=prod(pid); body=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">${pic(p)}<h2>${esc(p.name)}</h2></div><p class="hint" style="margin-bottom:10px">Which colour dot is on the cake?</p><div class="cols">${COL().map(c=>`<button type="button" data-addcol="${esc(pid)}|${esc(c.name)}"><i style="background:${esc(c.hex)}"></i>${esc(c.name.slice(0,1)+c.name.slice(1).toLowerCase())}<br>${esc(colDay(c.name))}</button>`).join("")}</div>`;}
  else{const cats={}; INFO.products.forEach(p=>(cats[p.category]=cats[p.category]||[]).push(p)); body=`<h2 style="margin-bottom:6px">Add a cake</h2>${Object.keys(cats).map(c=>`<div class="cat">${esc(CATL[c]||c)}</div>${cats[c].map(p=>`<button class="pick" type="button" data-addp="${esc(p.id)}">${pic(p)}<span>${esc(p.name)}${shown.has(p.id)?` <span class="tag mute">listed</span>`:""}</span></button>`).join("")}`).join("")}`;}
  $("#sheet").innerHTML=`<div class="sheet" data-close="1"><div class="box" role="dialog" aria-label="Add a cake">${body}<div style="margin-top:14px"><button class="btn" type="button" data-close="1" style="width:100%">Cancel</button></div></div></div>`;
}
function collect(){ WHO=($("#who")||{value:WHO}).value.trim(); NOTE=($("#note")||{value:NOTE}).value; store.set("chaleur.who",WHO);
  return {key:KEY,date:DATE,who:WHO,note:NOTE,lines:ORDER.map(k=>ROWS[k]).filter(r=>r.w!==""||r.b!==""||true).map(r=>({productId:r.productId,colour:r.colour,w:+r.w||0,b:+r.b||0})),photos:{sales:[...PH.sales],display:PH.display,waste:hasWaste()?PH.waste:null},baseAt:(INFO.existing&&INFO.existing.at)||""}; }
async function review(){
  const m=missing(); if(m.length){ status("Still needed: "+m.join(", ")+".",true); const first=!PH.sales.length?"#shot-sales":!PH.display?"#shot-display":hasWaste()&&!PH.waste?"#shot-waste":"#who"; const el=$(first); if(el){el.classList&&el.classList.add("need"); el.scrollIntoView({behavior:"smooth",block:"center"});} return; }
  const d=collect(); window.scrollTo(0,0);
  $("#app").innerHTML=`${head()}<div class="card" style="text-align:center;padding:26px"><span class="spin"></span><p style="margin:12px 0 0">Reading your sales photo and checking the numbers…</p><p class="hint">This takes a few seconds.</p></div>`;
  $("#bar").hidden=true;
  try{ PREV=await run("previewClosing",d); }catch(e){ const msg=(e&&e.message)||""; if(msg&&!/No connection|Server busy|taking too long|unexpected reply/i.test(msg)){ restoreBar(); render(); status(msg,true); return; } PREV={read:{ok:false,note:"Could not check the numbers right now. You can still send the report."},check:[]}; }
  renderPreview(d);
}
function renderPreview(d){
  const r=PREV.read||{}, ch=PREV.check||[], probs=ch.filter(c=>c.diff);
  const tot=f=>d.lines.reduce((s,l)=>s+(+l[f]||0),0);
  $("#app").innerHTML=`${head()}
  <div class="card stack"><h2>Check before sending</h2>
    <p class="hint">${esc(INFO.outlet.name)} · ${esc(niceDate(DATE))} · counted by <b>${esc(d.who)}</b></p>
    ${r.ok?(probs.length?`<div class="banner warn"><b>${probs.length} cake${probs.length>1?"s don't":" doesn't"} add up.</b> Please recount these, or tap <b>Edit</b>. If your count is right, send anyway and add a note.</div>`:`<div class="banner info">✓ Everything adds up with your sales report.</div>`)
      :`<div class="banner info">${esc(r.note||"The sales photo will be checked by the office.")}</div>`}
    ${(()=>{const bad=d.lines.filter(l=>l.b>0&&sfOf(l.productId,l.colour)==="bad");return bad.length?`<div class="banner warn">${bad.map(l=>`${esc(prod(l.productId).name)} ${esc(l.colour)}`).join(", ")}: counted as <b>Left</b> but past shelf life. Please throw them away and move them to <b>Waste</b> (tap Edit).</div>`:"";})()}
    <div style="overflow-x:auto"><table><thead><tr><th>Cake</th>${r.ok?"<th>Sold</th>":""}<th>Waste</th><th>Left</th>${r.ok?"<th>Check</th>":""}</tr></thead><tbody>
    ${(ch.length?ch:aggregate(d.lines)).map(c=>`<tr><td>${esc(c.name||prod(c.productId).name)}</td>${r.ok?`<td>${c.sold??0}</td>`:""}<td>${c.waste||""}</td><td>${c.balance||""}</td>${r.ok?`<td>${c.diff?`<span class="tag warn">${c.diff>0?c.diff+" missing":(-c.diff)+" extra"}</span>`:`<span class="tag ok">OK</span>`}</td>`:""}</tr>`).join("")||`<tr><td colspan="5" class="hint">No cakes counted.</td></tr>`}
    </tbody></table></div>
    <p class="hint">Total waste <b>${tot("w")}</b> · total left <b>${tot("b")}</b>${r.ok?` · sold <b>${Object.values(r.sold||{}).reduce((a,b)=>a+b,0)}</b>`:""}</p>
    ${r.ok&&(r.other||[]).length?`<p class="hint">Also on the sales report (not matched to our cakes): ${r.other.map(o=>esc(o.seen)+" ×"+o.qty).join(", ")}</p>`:""}
    ${r.ok&&r.note?`<p class="hint">Note from the reader: ${esc(r.note)}</p>`:""}
    ${(()=>{const bad=(PREV.photos||[]).filter(x=>!x.ok);return bad.length?`<div class="banner warn"><b>${bad.length===1?"This photo doesn't":"These photos don't"} look right:</b><br>${bad.map(x=>`${esc(x.label)}: ${esc(x.why)}`).join("<br>")}<br>Please tap <b>Edit</b> and take ${bad.length===1?"it":"them"} again. If the photo is right, you can still send; Chaleur will check it.</div>`:"";})()}
    ${r.ok&&r.date&&r.date!==DATE?`<div class="banner warn">The sales report looks like it's for <b>${esc(niceDate(r.date))}</b>, not ${esc(niceDate(DATE))}. Please check the photo.</div>`:""}
    <div class="thumbs">${d.photos.sales.concat([d.photos.display]).concat(d.photos.waste?[d.photos.waste]:[]).map(u=>`<img src="${u}" alt="">`).join("")}</div>
    ${d.note?`<p class="hint">Note: ${esc(d.note)}</p>`:""}
  </div>`;
  $("#bar").hidden=false; $("#bar .in").innerHTML=`<button class="btn" id="edit" type="button">Edit</button><button class="btn go" id="send" type="button">${(PREV.photos||[]).some(x=>!x.ok)?"Send anyway":"Confirm &amp; send"}</button><div class="status" id="status"></div>`;
  $("#edit").onclick=()=>{restoreBar();render();};
  $("#send").onclick=()=>send(d);
}
function aggregate(lines){const by={};lines.forEach(l=>{const x=by[l.productId]||(by[l.productId]={productId:l.productId,waste:0,balance:0});x.waste+=l.w;x.balance+=l.b;});return Object.values(by);}
function restoreBar(){$("#bar .in").innerHTML=`<button class="btn go" id="next" type="button">Review report</button><div class="status" id="status"></div>`;$("#next").onclick=review;}
async function send(d){
  if(SENDING) return; SENDING=true; $("#send").disabled=true; $("#edit").disabled=true; status("Sending report and photos… keep this page open.");
  try{
    const r=await run("submitClosing",{...d,token:PREV&&PREV.token}); clearDraft();
    $("#bar").hidden=true; window.scrollTo(0,0);
    const wa=r.wa?`https:\/\/wa.me/${esc(r.wa)}?text=${encodeURIComponent(r.summary)}`:"";
    $("#app").innerHTML=`${head()}<div class="done"><div class="ok">✓</div><h2>${r.mode==="replaced"?"Report updated":"Report sent"}</h2><p style="margin:0">Thank you, ${esc(d.who)}.<br>Reference <b style="font-family:var(--mono)">${esc(r.id)}</b></p>
      ${wa?`<a class="btn go" href="${wa}" target="_blank" rel="noopener" style="width:100%">Send summary to Chaleur on WhatsApp</a>`:""}
      <button class="btn" type="button" data-act="again" style="width:100%">Edit this report</button>
      <p class="hint">Made a mistake? Tap "Edit this report", fix it and send again. The newest report is the one that counts.</p></div>`;
    PH={sales:[],display:null,waste:null};
  }catch(e){ status(e.message||"Sending failed. Check your internet and try again.",true); $("#send").disabled=false; $("#edit").disabled=false; }
  SENDING=false;
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-close]"); if(!t) return; const d=t.dataset;
  if(d.close&&(e.target===t||t.tagName==="BUTTON")){$("#sheet").innerHTML="";return;}
  if(d.act==="retry"){load();return;}
  if(d.step){const k=d.step,f=d.sf,n=d.sn; const r=ROWS[k]; const v=Math.max(0,(+r[f]||0)+(+n)); r[f]=v?String(v):""; const inp=document.querySelector(`input[data-k="${CSS.escape(k)}"][data-f="${f}"]`); if(inp) inp.value=r[f]; if(f==="w") softRefresh(); saveDraft(); return;}
  if(d.rm){const [key,i]=d.rm.split("|"); if(key==="sales") PH.sales.splice(+i,1); else PH[key]=null; keep(); render(); return;}
  if(d.act==="add"){keep();openAdd();return;}
  if(d.addp){const p=d.addp; if(!SHOWN.includes(p)) SHOWN.push(p); $("#sheet").innerHTML=""; render(); setTimeout(()=>{const el=document.getElementById("cake-"+p); if(el) el.scrollIntoView({block:"center",behavior:"smooth"});},60); return;}
  if(d.cd){const k=d.cd, r=ROWS[k], y=window.scrollY; keep();
    if(!r){const [p,c]=k.split("|"); ROWS[k]={productId:p,colour:c,w:"",b:""}; ORDER.push(k);}
    else if(!EXP.has(k)&&r.w===""&&r.b===""){delete ROWS[k]; ORDER=ORDER.filter(x=>x!==k); render(); window.scrollTo(0,y); return;}
    render(); window.scrollTo(0,y); return;}
  if(d.act==="again"){restoreBar();load();return;}
});
function keep(){ if($("#who")) WHO=$("#who").value; if($("#note")) NOTE=$("#note").value; }
let wasW=false;
function softRefresh(){ const hw=hasWaste(), box=$("#shot-waste"); wasW=hw;
  const html=hw?shotBox("waste",`Waste photo (you entered ${wasteN()} wasted)`,"Needed only because you entered waste. Take a photo of the cakes you are throwing away."):"";
  if(box){ if(hw) box.outerHTML=html; else box.remove(); } else if(hw){ const dsp=$("#shot-display"); if(dsp) dsp.insertAdjacentHTML("afterend",html); }
  status(missing().length?"Still needed: "+missing().join(", ")+".":"Ready — tap Review report."); }
document.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.k){const v=t.value.replace(/[^0-9]/g,""); ROWS[t.dataset.k][t.dataset.f]=v===""?"":String(+v); if(t.dataset.f==="w") softRefresh(); saveDraft(); return;}
  if(t.id==="who"){WHO=t.value; status(missing().length?"Still needed: "+missing().join(", ")+".":"Ready — tap Review report.");}
  if(t.id==="note") NOTE=t.value;
  if(t.id==="who"||t.id==="note") saveDraft();
});
document.addEventListener("change",async e=>{const t=e.target;
  if(t.id==="date"&&t.value){keep();DATE=t.value;PH={sales:[],display:null,waste:null};NOTE="";PREV=null;PHSIG="";return load();}
  if(t.dataset.shot&&t.files&&t.files[0]){const key=t.dataset.shot; keep(); status("Processing photo…"); const nx=$("#next"); if(nx) nx.disabled=true;
    try{const u=await shrink(t.files[0],key==="sales"?2000:1400); if(key==="sales") PH.sales.push(u); else PH[key]=u;}catch(err){status("That photo couldn't be read. Please try again.",true);}
    const y=window.scrollY; render(); window.scrollTo(0,y);}
});
wasW=false;
document.getElementById("next").onclick=review;
load();
if(typeof CA!=="undefined") CA.helper({auth:()=>KEY&&INFO&&INFO.outlet?"o:"+KEY:"",page:()=>"Outlet closing form",hello:"Hi! Ask me anything about the closing form, for example: \u201cWhat do I do with a cake past its shelf life?\u201d or \u201cWhat does the colour dot mean?\u201d"});
</script>
