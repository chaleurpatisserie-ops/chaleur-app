  /* While viewing as another role, a strip at the top of every page says so */

  /* Where a "what to do next" item goes: page + tab (#hash) + kitchen team */

  const nextList=(items,links)=>`<ul class="ca-next">${(items||[]).map(x=>`<li><i class="${esc(x.sev)}"></i><span>${links&&x.go?`<a href="${esc(nextHref(x.go))}">${esc(x.text)}</a>`:esc(x.text)}</span></li>`).join("")}</ul>`;
  document.addEventListener("click",e=>{const b=e.target&&e.target.closest&&e.target.closest("[data-ca-logout]"); if(b){e.preventDefault(); b.disabled=true; logout();}});
  /* Report a problem: what's wrong (same list as the server). Short names are used in My reports. */
  const FBK=[["app","App not working","App problem"],["numbers","Wrong numbers","Wrong numbers"],["equipment","Equipment broken","Equipment"],["stock","Stock / ingredients","Stock"],["safety","Food safety","Food safety"],["idea","Idea / other","Idea"]];
  const fbl=k=>(FBK.find(x=>x[0]===k)||["","Other","Other"]);
  const FBS={open:"New",doing:"Being fixed",done:"✓ Done"};
  /* Photo for a report: made smaller (max 1280 px, JPEG) so it sends fast on a phone */
  const shrink=file=>new Promise((res,rej)=>{ const r=new FileReader(); r.onerror=()=>rej(new Error("Couldn't read the photo.")); r.onload=()=>{ const im=new Image(); im.onerror=()=>rej(new Error("Couldn't read the photo."));
    im.onload=()=>{ const k=Math.min(1,1280/Math.max(im.width,im.height)), c=document.createElement("canvas"); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext("2d").drawImage(im,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",.8)); };
    im.src=r.result; }; r.readAsDataURL(file); });
  let openHelp=()=>{};
  /* Sent with every report, so we know where it happened: the page, the link, the phone, and the last message on screen */
  const LAST={t:"",at:0};
  const note=t=>{ t=String(t||"").replace(/\s+/g," ").trim(); if(t&&!/^(Saving|Sending|Loading|Signing in|Checking)/i.test(t)){ LAST.t=t.slice(0,200); LAST.at=Date.now(); } };
  function watchMsgs(){ if(watchMsgs.on||!document.body) return; watchMsgs.on=1;
    window.addEventListener("error",e=>note("Error: "+(e.message||""))); window.addEventListener("unhandledrejection",e=>note("Error: "+((e.reason&&e.reason.message)||e.reason||"")));
    try{ new MutationObserver(ms=>{ for(const m of ms){ const n=m.target.nodeType===1?m.target:m.target.parentElement; const el=n&&n.closest&&n.closest("#toast,#status,[role=alert],[role=status],.err"); if(el&&!el.closest(".ca-hp")&&!el.hidden) note(el.textContent); } }).observe(document.body,{childList:true,subtree:true,characterData:true}); }catch(e){} }
  const device=()=>{ const u=navigator.userAgent||""; return [/iPhone|iPad|iPod/.test(u)?"iPhone/iPad":/Android/.test(u)?"Android":/Mac/.test(u)?"Mac":/Windows/.test(u)?"Windows":"Other",
    /Edg\//.test(u)?"Edge":/CriOS|Chrome\//.test(u)?"Chrome":/FxiOS|Firefox/.test(u)?"Firefox":/Safari/.test(u)?"Safari":"Browser", (window.innerWidth||0)+"px"].join(" · "); };
  const recent=()=>LAST.t&&Date.now()-LAST.at<15*60*1000?LAST.t:"";
  const cap=w=>w?w.charAt(0).toUpperCase()+w.slice(1).toLowerCase():"";
  const hm=iso=>{ try{ return new Date(iso).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:"Asia/Kuala_Lumpur"}); }catch(e){ return ""; } };
  const dayTxt=iso=>{ try{ const f=d=>d.toLocaleDateString("en-CA",{timeZone:"Asia/Kuala_Lumpur"}), d=new Date(iso), t=new Date(), y=new Date(Date.now()-864e5);
    return f(d)===f(t)?"today "+hm(iso):f(d)===f(y)?"yesterday "+hm(iso):d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",timeZone:"Asia/Kuala_Lumpur"}); }catch(e){ return ""; } };
  function helper(opt){
    if(document.getElementById("ca-hbtn")) return;
    watchMsgs();
    const b=document.createElement("button"); b.id="ca-hbtn"; b.className="ca-hbtn"; b.type="button"; b.textContent="? Ask"; b.setAttribute("aria-label","Ask the helper a question or report a problem"); b.setAttribute("aria-expanded","false");
    document.body.appendChild(b);
    let panel=null, bd=null, H=[], busy=false, VIEW="ask";
    const R0=()=>({type:"",text:"",photo:"",urgent:false,busy:false,err:"",sent:null});
    let FB=R0(), MINE=null, MINEB=false;
    const hi=opt.hello||"Hi! Ask me how to do anything in this app. For example: “How do I send the closing report?” or “Why can't I mark the delivery as delivered?” You can write in English, Malay or Chinese.";
    let NX=null, NXB=false;
    const tok=()=>{ const au=opt.auth&&opt.auth(); return au&&/^s1\./.test(String(au))?au:(au||""); };
    const plain=t=>String(t||"").replace(/\*\*(.+?)\*\*/g,"$1").replace(/^#+\s*/gm,"").replace(/^\s*[-*]\s+/gm,"• ").replace(/\n{3,}/g,"\n\n").trim();
    const first=()=>{ const s0=get(); return cap(String((s0&&s0.name)||(NX&&NX.name)||"").split(" ")[0]); };
    const pageName=()=>opt.page?opt.page():document.title;
    function loadMine(force){ const au=tok(); if(!au||MINEB||(MINE&&!force)) return; MINEB=true; run("feedbackMine",au).then(r=>{MINE=r||[];}).catch(()=>{MINE=MINE||[];}).then(()=>{MINEB=false; paint();}); }
    function mineCount(){ if(!MINE||!MINE.length) return ""; const d=MINE.filter(x=>x.status==="doing").length, n=MINE.filter(x=>x.status==="open").length; return [d?d+" being fixed":"",n?n+" new":""].filter(Boolean).join(" · ")||MINE.length+" done"; }
    function head(){ if(VIEW==="mine") return `<div class="ca-hd" style="justify-content:flex-start;gap:12px"><button type="button" class="ca-back" data-hv="fb" aria-label="Back">‹</button><div class="ca-ttl" style="flex:1"><small>Helper</small>My reports</div><button type="button" class="ca-x" aria-label="Close helper">✕</button></div>`;
      return `<div class="ca-hd"><span class="ca-ttl">Helper</span><button type="button" class="ca-x" aria-label="Close helper">✕</button></div>
        ${opt.noReport?"":`<div class="ca-tabs" role="tablist"><button type="button" role="tab" data-hv="ask" aria-selected="${VIEW==="ask"}">Ask a question</button><button type="button" role="tab" data-hv="fb" aria-selected="${VIEW==="fb"}">Report a problem</button></div>`}`; }
    function askHtml(){
      const nx=NX&&NX.items&&NX.items.length?`<div class="ca-m ca-a"><b>Hi ${esc(cap(String(NX.name||"").split(" ")[0]))}! Next for you:</b>${nextList(NX.items,true)}<div style="margin-top:6px">Tap an item to go there, or ask me how to do it.</div></div>`:(NXB?`<div class="ca-m ca-a">Checking what's next for you…</div>`:"");

        <div class="ca-foot"><form class="ca-askf"><textarea rows="1" placeholder="Ask a question…" aria-label="Your question"></textarea><button type="submit">Send</button></form></div>`; }
    function fbHtml(){
      if(FB.sent){ const x=FB.sent;
        return `<div class="ca-body"><div class="ca-done" role="status"><span class="ca-tick" aria-hidden="true">✓</span><div class="ca-thx">Thanks, ${esc(first()||"there")}. We got it.</div>
          <div style="font-size:15px;color:var(--muted,#6f5f62);line-height:1.5">Your report <b style="color:var(--ink,#2b1b1e)">#${esc(x.ref)}</b> went to the office. ${x.urgent?"Marked urgent: your supervisor gets a WhatsApp now.":"You'll see replies in My reports."}</div>
          <div class="ca-sum"><div style="font-weight:600">${esc(fbl(x.type)[1])}${x.urgent?" · Urgent":""}</div><div style="color:var(--muted,#6f5f62);margin-top:2px;white-space:pre-wrap">${esc(x.text||(x.photo?"No description, photo only":"No description"))}</div><div style="color:var(--muted,#6f5f62);font-size:12px;margin-top:6px">From: ${esc(x.page)} · ${esc(hm(x.at))}</div></div>
          <button type="button" class="ca-lnk" data-hv="mine">See my reports ›</button></div></div>
          <div class="ca-foot"><button type="button" class="ca-sec56" data-fbreset="1">Report something else</button><button type="button" class="ca-pri56" data-fbclose="1">Back to my work</button></div>`; }
      const lm=recent(), mc=mineCount();
      return `<div class="ca-body">
        <div><div class="ca-eb">What's wrong?</div><div class="ca-types">${FBK.map(([k,l])=>`<button type="button" data-fbt="${k}" aria-pressed="${FB.type===k}">${esc(l)}</button>`).join("")}</div></div>
        <div><div class="ca-eb">Tell us in one line (any language)</div><textarea class="ca-ft" placeholder="e.g. Freezer 2 door doesn't close / Send button stuck" aria-label="What happened">${esc(FB.text)}</textarea></div>
        <div class="ca-ph"><div class="ca-thumb">${FB.photo?`<img src="${esc(FB.photo)}" alt="Your photo"><button type="button" data-fbnophoto="1" aria-label="Remove photo">✕</button>`:"photo"}</div><label class="ca-phb">${FB.photo?"Change photo":"Add photo / screenshot"}<input type="file" accept="image/*" class="ca-fp" hidden></label></div>
        <button type="button" class="ca-urg" data-fburg="1" aria-pressed="${FB.urgent}"><i aria-hidden="true">${FB.urgent?"✓":""}</i><span><b>Urgent</b>: it stops my work right now</span></button>
        <p class="ca-note">We attach the page you were on (<b>${esc(pageName())}</b>) and your name, so you don't need to explain where.${lm?` We also attach the last message on your screen: “${esc(lm)}”.`:""}</p>
        ${FB.err?`<p class="ca-err" role="alert">${esc(FB.err)}</p>`:""}
        ${mc?`<button type="button" class="ca-lnk" data-hv="mine">My reports · ${esc(mc)} ›</button>`:""}</div>
        <div class="ca-foot"><button type="button" class="ca-go60" data-fbsend="1" ${!FB.type||FB.busy?"disabled":""}>${FB.busy?"Sending…":FB.type?"Send report":"Pick what's wrong first"}</button></div>`; }
    function mineHtml(){
      const list=MINE==null?`<p class="ca-note">Loading your reports…</p>`:!MINE.length?`<p class="ca-note">No reports yet. When you report a problem, you'll see here what happens to it.</p>`:
        MINE.map(x=>`<div class="ca-rc ${x.status==="done"?"done":""}"><div class="ca-rt"><b>${esc(fbl(x.kind)[2])}${x.urgent?" · Urgent":""}</b><span class="ca-pill ${esc(x.status)}">${esc(FBS[x.status]||x.status)}</span></div>
          ${x.text?`<div class="ca-tx">${esc(x.text)}</div>`:""}${x.reply?`<div class="ca-rp"><b>${esc(cap(String(x.updBy||"Office").split(" ")[0]))}:</b> ${esc(x.reply)}</div>`:""}
          <div class="ca-mt">${x.ref?"#"+esc(x.ref)+" · ":""}${esc(dayTxt(x.at))}</div></div>`).join("");
      return `<div class="ca-body">${list}</div><div class="ca-foot"><button type="button" class="ca-pri56" data-hv="fb" data-fbreset="1" style="min-height:60px;font-size:17px">Report a new problem</button></div>`; }
    function paint(){ if(!panel) return; const keep=panel.querySelector(".ca-ft"), kv=keep?keep.value:null;

          const auth=opt.auth(); if(!auth){H.push({q},{a:"Please sign in first, then ask again."}); paint(); return;}

          try{const r=await run("askHelp",auth,q,pageName(),H.slice(-7,-1)); H.push({a:r.answer||"Sorry, I don't know. Please ask your supervisor."});}

      const ft=panel.querySelector(".ca-ft"); if(ft) ft.oninput=()=>{FB.text=ft.value;};
      const fp=panel.querySelector(".ca-fp"); if(fp) fp.onchange=async e=>{ const fl=e.target.files&&e.target.files[0]; if(!fl) return; try{ FB.photo=await shrink(fl); FB.err=""; }catch(x){ FB.err=x.message; } paint(); };
    }

      if(d.fburg){ FB.urgent=!FB.urgent; paint(); return; }
      if(d.fbnophoto){ FB.photo=""; paint(); return; }

      if(d.fbreset){ paint(); return; }
      if(d.fbsend) send(); }
    async function send(){ const au=tok(); if(!au){ FB.err="Please sign in first."; paint(); return; } if(!FB.type||FB.busy) return;
      FB.busy=true; FB.err=""; paint();

      panel=document.createElement("div"); panel.className="ca-hp"; panel.setAttribute("role","dialog"); panel.setAttribute("aria-modal","true"); panel.setAttribute("aria-label","Helper");

    }

  }
  return {get,save,clear,run,isAuthErr,loginForm,logout,toLogin,chip,helper,openHelp:v=>openHelp(v),ROLE,esc,nextHref,nextList,HOME,canView,vaSelect,loadVA,permsOf,labelOf,areaOf,can,update};

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Jost:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Chaleur Brigade design system (design v2): shared by Kitchen HQ, the outlet closing form and the spot audit.

  --bad:#c0392b;--bad-tx:#a3261a;--bad-bg:#f8dcd8;--seg:#efe4de;--row:#fdf8f5;--night:#2b1b1e;--night2:#3a2a2d;

  --accent:#e4a1ac;--accent-ink:#1b1113;--acc-sh:#9c5a66;--seg:#2c2124;--row:#271c1f;--ok-bg:#16301f;--ok-tx:#8fd3a5;--warn-bg:#3a2a12;--warn-tx:#f0b85a;--bad-bg:#3d1b18;--bad-tx:#ff9a8c;--night:#0f0a0b;--night2:#2a1f21}}
*{box-sizing:border-box}html,body{margin:0}[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}

.w{max-width:560px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom,0px))}

.cb:disabled,.cb[aria-disabled="true"]{background:var(--line);color:#9a8f91;box-shadow:0 4px 0 var(--cline);cursor:default;transform:none}

.cb.ghost{background:var(--paper);color:var(--ink);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line)}.cb.ink{background:var(--ink);color:var(--paper);box-shadow:0 4px 0 #000}
.cb.sm{min-height:40px;padding:0 14px;border-radius:12px;font-size:13.5px;box-shadow:0 3px 0 var(--acc-sh)}.cb.sm.ghost{box-shadow:0 3px 0 var(--line)}.cb.full{width:100%}.cb.big{min-height:60px;font-size:17px}
.cb.dash{background:transparent;color:var(--muted);border:2px dashed var(--line);box-shadow:none}
.lnk{background:none;border:0;color:var(--accent);font:600 14px var(--body);padding:6px 0;cursor:pointer;text-align:left;min-height:36px}
/* cards */
.card{background:var(--paper);border:1.5px solid var(--cline);border-radius:20px;box-shadow:0 3px 0 var(--cline);padding:14px}
.card.flat{box-shadow:none}.card.hot{border:2px solid var(--accent);box-shadow:0 3px 0 var(--accent)}
.card h3{margin:0 0 6px;font-size:16px}

.ptitle{font:700 26px/1.05 var(--display);margin:0}

.qbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);font-weight:700;font-size:17px;flex:none}
/* pills */

function safetyBanner(){const bad=[],last=[]; for(const k of ORDER){const r=ROWS[k]; if(!EXP.has(k)) continue; const s=sfOf(r.productId,r.colour); if(s==="bad") bad.push(r); else if(s==="warn") last.push(r);}
  const nm=r=>`${esc(prod(r.productId).name)} ${esc(capw(r.colour))}`;
  return `${bad.length?`<div class="banner warn"><b>Safety check: take these off display now</b>, throw them away and enter them as <b>Waste</b> (past shelf life): ${bad.map(nm).join(", ")}.</div>`:""}${last.length?`<div class="banner info"><b>Last day today:</b> put these at the front and sell first: ${last.map(nm).join(", ")}.</div>`:""}`;}

async function load(){

  if(!KEY) return renderNeedLink();
  try{ INFO=await run("closingInfo",KEY,DATE); }
  catch(e){ $("#app").innerHTML=`<div class="empty err stack">${esc(e.message||"Could not load. Check your internet and try again.")}<button class="btn" type="button" data-act="retry">Try again</button></div>`; return; }
  if(!INFO.outlet){ if(!PRESET){try{localStorage.removeItem("chaleur.key")}catch(e){}} return renderNeedLink(); }
  store.set("chaleur.key",KEY);
  ROWS={}; ORDER=[]; SHOWN=[]; EXP=new Set(INFO.stock.map(s=>K(s.productId,s.colour)));
  const ex=INFO.existing;
  const add=(p,c)=>{const k=K(p,c); if(!SHOWN.includes(p)) SHOWN.push(p); if(!ROWS[k]){ROWS[k]={productId:p,colour:c,w:"",b:""};ORDER.push(k);} };
  INFO.stock.forEach(s=>add(s.productId,s.colour));
  if(ex){ ex.lines.forEach(l=>{add(l.productId,l.colour); const r=ROWS[K(l.productId,l.colour)]; r.w=l.w?String(l.w):""; r.b=l.b?String(l.b):"";}); if(!NOTE) NOTE=ex.note||""; }

const DK=()=>"chaleur.draft."+KEY+"."+DATE;
let PHSIG="";
function saveDraft(){ if(!INFO||!INFO.outlet) return; try{localStorage.setItem(DK(),JSON.stringify({at:new Date().toISOString(),who:($("#who")||{value:WHO}).value,note:($("#note")||{value:NOTE}).value,rows:ORDER.map(k=>[k,ROWS[k].w,ROWS[k].b]),shown:SHOWN}));}catch(e){} const sig=PH.sales.map(u=>u.length).join(",")+"|"+(PH.display||"").length+"|"+(PH.waste||"").length; if(sig!==PHSIG){ PHSIG=sig; try{sessionStorage.setItem(DK()+".ph",JSON.stringify(PH));}catch(e){ try{sessionStorage.removeItem(DK()+".ph");}catch(_){} } } }
function loadDraft(ex){ let d=null; try{d=JSON.parse(localStorage.getItem(DK())||"null");}catch(e){} if(!d||(ex&&ex.at&&d.at<ex.at)) return false;
  let changed=false; for(const [k,w,b] of d.rows||[]){ const [p,c]=k.split("|"); if(!ROWS[k]){ROWS[k]={productId:p,colour:c,w:"",b:""};ORDER.push(k);} if((w||"")!==ROWS[k].w||(b||"")!==ROWS[k].b) changed=true; ROWS[k].w=w||""; ROWS[k].b=b||""; if(!SHOWN.includes(p)) SHOWN.push(p); }
  for(const p of d.shown||[]) if(!SHOWN.includes(p)) SHOWN.push(p); if(d.who) WHO=d.who; if(d.note) NOTE=d.note;
  try{const ph=JSON.parse(sessionStorage.getItem(DK()+".ph")||"null"); if(ph&&((ph.sales||[]).length||ph.display)){PH=ph; changed=true;}}catch(e){}
  return changed; }

const canAdd=k=>k==="sales"?PH.sales.length<3:!PH[k];

function tile(key,title){ const v=PH[key], has=key==="sales"?v.length>0:!!v, first=key==="sales"?v[0]:v, n=key==="sales"?v.length:0;

function thumbs(){ const items=PH.sales.map((u,i)=>`<span class="tw"><img src="${u}" alt="Sales photo ${i+1}"><button type="button" data-rm="sales|${i}" aria-label="Remove photo">×</button></span>`);

const hasWaste=()=>ORDER.some(k=>+ROWS[k].w>0);
function missing(){const m=[]; if(((($("#who")||{}).value)||WHO).trim().length<2) m.push("your name"); if(!PH.sales.length) m.push("sales report photo"); if(!PH.display) m.push("chiller photo"); if(hasWaste()&&!PH.waste) m.push("waste photo"); return m;}
async function shrink(file,max){
  const url=URL.createObjectURL(file);
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
  const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
  return c.toDataURL("image/jpeg",0.85);
}

    ${d.note?`<p class="hint">Note: ${esc(d.note)}</p>`:""}
  </div>`;
  $("#bar").hidden=false; $("#bar .in").innerHTML=`<div class="st" id="status"></div><div class="row2"><button class="cb ghost" id="edit" type="button">Edit</button><button class="cb ok" id="send" type="button">${(PREV.photos||[]).some(x=>!x.ok)?"Send anyway":"Confirm &amp; send"}</button></div>`;

document.addEventListener("click",e=>{

  if(d.cd){const k=d.cd, r=ROWS[k], y=window.scrollY; keep();
    if(!r){const [p,c]=k.split("|"); ROWS[k]={productId:p,colour:c,w:"",b:""}; ORDER.push(k);}
    else if(!EXP.has(k)&&r.w===""&&r.b===""){delete ROWS[k]; ORDER=ORDER.filter(x=>x!==k); render(); window.scrollTo(0,y); return;}
    render(); window.scrollTo(0,y); return;}
  if(d.act==="again"){restoreBar();load();return;}
});
function keep(){ if($("#who")) WHO=$("#who").value; if($("#note")) NOTE=$("#note").value; }
function softRefresh(){ const hw=hasWaste(), box=$("#shot-waste"), tiles=$("#ptiles");
  if(tiles){ if(hw&&!box) tiles.insertAdjacentHTML("beforeend",tile("waste","Waste")); else if(!hw&&box) box.remove(); tiles.classList.toggle("two",!hw); const pl=$("#plinks"); if(pl) pl.innerHTML=plinks(); }
  setBtn(); }
document.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.k){const v=t.value.replace(/[^0-9]/g,""); ROWS[t.dataset.k][t.dataset.f]=v===""?"":String(+v); if(t.dataset.f==="w") softRefresh(); saveDraft(); return;}
  if(t.id==="who"){WHO=t.value; setBtn();}
  if(t.id==="note") NOTE=t.value;
  if(t.id==="who"||t.id==="note") saveDraft();
});
document.addEventListener("change",async e=>{const t=e.target;
  if(t.id==="date"&&t.value){keep();DATE=t.value;PH={sales:[],display:null,waste:null};NOTE="";PREV=null;PHSIG="";return load();}
  if(t.dataset.shot&&t.files&&t.files[0]){const key=t.dataset.shot; keep(); status("Processing photo…"); const nx=$("#next"); if(nx) nx.disabled=true;
    try{const u=await shrink(t.files[0],key==="sales"?2000:1400); if(key==="sales") PH.sales.push(u); else PH[key]=u;}catch(err){status("That photo couldn't be read. Please try again.",true);}
    const y=window.scrollY; render(); window.scrollTo(0,y);}
});
/* ---- First-time guide (step-by-step, auto-advances, skippable) ----
   Shows on its own the first few times an outlet opens the form; after that a small "Show me how" button brings it back.
   It never blocks the form: the spotlight is a box-shadow cut-out with pointer-events off, so people just do the step. */
const TOUR_AUTO_TIMES=3;
const tourKey=()=>"chaleur.tour."+(KEY||"x");
const tourSeenN=()=>+(store.get(tourKey())||0)||0;
let tourI=-1, tourHi=null, tourBub=null, tourBtn=null, tourIv=null, tourMo=null, tourTyped=0, tourManual=false;
const nameOk=()=>{const el=$("#who"); const v=((el&&el.value)||WHO||"").trim(); return v.length>=2&&(!el||document.activeElement!==el||Date.now()-tourTyped>1500);};
const tourSteps=[
  {sel:"#who",title:"Step 1 of 4 · Your name",text:"Type your name here, so Chaleur knows who counted tonight.",done:nameOk},
  {sel:"#app .cake, #app [data-act=add]",title:"Step 2 of 4 · Count the cakes",text:"For each cake and colour dot, type <b>Waste</b> (thrown away or damaged) and <b>Left</b> (still in the chiller). Empty box = 0. Missing a colour? Tap its dot on the cake.",done:()=>ORDER.some(k=>ROWS[k].w!==""||ROWS[k].b!=="")},
  {sel:"#ptiles",title:"Step 3 of 4 · Photos",text:"Tap each box to take a photo: today's <b>sales report</b> from the POS, the <b>chiller</b>, and the <b>waste</b> if there is any.",done:()=>PH.sales.length>0&&!!PH.display&&(!hasWaste()||!!PH.waste)},
  {sel:"#next",title:"Step 4 of 4 · Send",text:"Tap <b>Send tonight's count</b>. Check the numbers on the next screen, then <b>Confirm &amp; send</b>. You're done when you see “Sent. Thank you!”",done:()=>false,last:true}
];
function tourBuild(){
  if(tourHi) return;
  tourHi=document.createElement("div"); tourHi.className="tourhi off"; document.body.appendChild(tourHi);
  tourBub=document.createElement("div"); tourBub.className="tourbub off"; tourBub.setAttribute("role","status"); document.body.appendChild(tourBub);
  tourBtn=document.createElement("button"); tourBtn.type="button"; tourBtn.className="tourshow"; tourBtn.textContent="❔ Show me how"; tourBtn.onclick=()=>tourStart(true); document.body.appendChild(tourBtn);
  tourBub.addEventListener("click",e=>{const b=e.target.closest("[data-tour]"); if(!b) return; if(b.dataset.tour==="skip") tourSkip(); else tourNext();});
  document.addEventListener("input",e=>{if(e.target.id==="who") tourTyped=Date.now();});
  const re=()=>{if(tourI>=0) requestAnimationFrame(tourPlace);};
  window.addEventListener("scroll",re,{passive:true}); window.addEventListener("resize",re);
  tourMo=new MutationObserver(()=>{tourShowBtn(); if(tourI>=0) requestAnimationFrame(tourPlace);}); tourMo.observe($("#app"),{childList:true,subtree:true});
}
const tourOnForm=()=>!!$("#who")&&!!(INFO&&INFO.outlet);
function tourShowBtn(){ if(tourBtn) tourBtn.classList.toggle("on",tourI<0&&tourOnForm()); }
function tourPlace(){
  const st=tourSteps[tourI]; if(!st||!tourHi) return;
  const busy=!!document.querySelector("#sheet .sheet, .ca-hp");
  const el=document.querySelector(st.sel);
  if(!el||busy){ tourHi.classList.add("off"); tourBub.classList.add("off"); return; }
  const r=el.getBoundingClientRect(), p=8;
  Object.assign(tourHi.style,{top:(r.top-p)+"px",left:(r.left-p)+"px",width:(r.width+2*p)+"px",height:(r.height+2*p)+"px"});
  tourHi.classList.remove("off"); tourBub.classList.remove("off");
  const bw=tourBub.offsetWidth||280, bh=tourBub.offsetHeight||120, vw=window.innerWidth, vh=window.innerHeight;
  let top=r.bottom+p+10; if(st.last||top+bh>vh-150) top=r.top-p-10-bh; if(top<8&&!st.last) top=r.bottom+p+10;
  top=Math.max(8,Math.min(top,vh-bh-8));
  let left=r.left+r.width/2-bw/2; left=Math.max(14,Math.min(left,vw-bw-14));
  tourBub.style.top=top+"px"; tourBub.style.left=left+"px";
}
function tourShow(i){
  tourI=i; const st=tourSteps[i]; if(!st) return tourFinish();
  tourBub.innerHTML=`<div class="tn">${st.title}</div><div class="tx">${st.text}</div><div class="tb"><button class="tsk" type="button" data-tour="skip">Skip, I know this</button><button class="tsk go" type="button" data-tour="next">${st.last?"Got it":"Next →"}</button></div>`;
  const el=document.querySelector(st.sel);
  if(el&&!st.last) el.scrollIntoView({block:"center",behavior:"smooth"});
  tourShowBtn(); setTimeout(tourPlace,60); setTimeout(tourPlace,420);
}
function tourTick(){
  if(tourI<0) return;
  if(!tourOnForm()){ if(document.querySelector("#app .spin")){tourPlace();return;} /* reloading: just wait */
    if(tourSteps[tourI].last||tourI>=2) return tourFinish(); /* review or done screen: they made it to the end */ tourPlace(); return; }
  let i=tourI; while(i<tourSteps.length-1&&tourSteps[i].done()) i++;
  if(i!==tourI) tourShow(i); else tourPlace();
}
function tourNext(){ if(tourSteps[tourI]&&tourSteps[tourI].last) return tourFinish(); tourShow(tourI+1); }
function tourStop(){ tourI=-1; if(tourIv){clearInterval(tourIv); tourIv=null;} if(tourHi){tourHi.classList.add("off"); tourBub.classList.add("off");} tourShowBtn(); }
function tourFinish(){ if(!tourManual) store.set(tourKey(),String(tourSeenN()+1)); tourStop(); }
function tourSkip(){ store.set(tourKey(),String(Math.max(tourSeenN()+1,TOUR_AUTO_TIMES))); tourStop(); }
function tourStart(manual){
  if(!tourOnForm()) return; tourBuild(); tourManual=!!manual; tourTyped=0;
  let i=0; while(i<tourSteps.length-1&&tourSteps[i].done()) i++;
  tourShow(i); if(!tourIv) tourIv=setInterval(tourTick,400);
}
function tourMaybeStart(){ tourBuild(); tourShowBtn(); if(tourOnForm()&&tourSeenN()<TOUR_AUTO_TIMES) tourStart(false); }

document.getElementById("next").onclick=review;
load().then(()=>setTimeout(tourMaybeStart,400));
if(typeof CA!=="undefined") CA.helper({noReport:true,auth:()=>KEY&&INFO&&INFO.outlet?"o:"+KEY:"",page:()=>"Outlet closing form",hello:"Hi! Ask me anything about the closing form, for example: “What do I do with a cake past its shelf life?” or “What does the colour dot mean?”"});
</script>
</body></html>
