const DK=()=>"chaleur.draft."+KEY+"."+DATE;
function saveDraft(){ if(!INFO||!INFO.outlet) return; try{localStorage.setItem(DK(),JSON.stringify({at:new Date().toISOString(),who:($("#who")||{value:WHO}).value,note:($("#note")||{value:NOTE}).value,rows:ORDER.map(k=>[k,ROWS[k].w,ROWS[k].b]),shown:SHOWN}));}catch(e){} try{sessionStorage.setItem(DK()+".ph",JSON.stringify(PH));}catch(e){} }
function loadDraft(ex){ let d=null; try{d=JSON.parse(localStorage.getItem(DK())||"null");}catch(e){} if(!d||(ex&&ex.at&&d.at<ex.at)) return false;
  let changed=false; for(const [k,w,b] of d.rows||[]){ const [p,c]=k.split("|"); if(!ROWS[k]){ROWS[k]={productId:p,colour:c,w:"",b:""};ORDER.push(k);} if((w||"")!==ROWS[k].w||(b||"")!==ROWS[k].b) changed=true; ROWS[k].w=w||""; ROWS[k].b=b||""; if(!SHOWN.includes(p)) SHOWN.push(p); }
  for(const p of d.shown||[]) if(!SHOWN.includes(p)) SHOWN.push(p); if(d.who) WHO=d.who; if(d.note) NOTE=d.note;
  try{const ph=JSON.parse(sessionStorage.getItem(DK()+".ph")||"null"); if(ph&&((ph.sales||[]).length||ph.display)){PH=ph; changed=true;}}catch(e){}
  return changed; }
function clearDraft(){ try{localStorage.removeItem(DK()); sessionStorage.removeItem(DK()+".ph");}catch(e){} }
function renderNeedLink(){
  $("#bar").hidden=true;
  const wa=CONFIG.chaleurWhatsApp?`https:\/\/wa.me/${esc(CONFIG.chaleurWhatsApp)}?text=${encodeURIComponent("Hi Chaleur, please send us our outlet's closing report link.")}`:"";
  $("#app").innerHTML=`${head()}<div class="card stack"><h2>Please open your outlet's own link</h2>
    <p class="hint">Each outlet has its own closing form. Scan the QR code Chaleur gave your outlet, or open the link we sent you on WhatsApp.</p>
    ${wa?`<a class="btn go" href="${wa}" target="_blank" rel="noopener">Ask Chaleur on WhatsApp</a>`:""}</div>`;
}
const head=()=>`<header><div class="ca" aria-hidden="true">${MARK}</div><div><div class="brand">Chaleur Atelier · Outlet</div><h1>Closing count</h1></div></header>`;
function grouped(){
  const by={}; SHOWN.forEach(p=>by[p]=[]); ORDER.forEach(k=>{const r=ROWS[k]; (by[r.productId]=by[r.productId]||[]).push(k);});
  const cats={}; Object.keys(by).forEach(pid=>{const p=prod(pid); (cats[p.category]=cats[p.category]||[]).push(pid);});
  const catOrder=["Petit gâteau","Cheesecake","Whole cake"]; const names=Object.keys(cats).sort((a,b)=>(catOrder.indexOf(a)+99)%99-(catOrder.indexOf(b)+99)%99);
  return names.map(c=>({cat:c,items:cats[c].sort((a,b)=>INFO.products.findIndex(p=>p.id===a)-INFO.products.findIndex(p=>p.id===b)).map(pid=>({p:prod(pid),keys:by[pid].sort((x,y)=>COL().findIndex(c=>c.name===ROWS[x].colour)-COL().findIndex(c=>c.name===ROWS[y].colour))}))}));
}
function stepper(k,f,label){const v=ROWS[k][f];return `<div class="stp ${f}"><span class="lb">${label}</span><div class="ctl"><button type="button" data-step="${esc(k)}" data-sf="${f}" data-sn="-1" aria-label="${label} minus one">−</button><input type="number" inputmode="numeric" min="0" step="1" placeholder="0" value="${esc(v)}" data-k="${esc(k)}" data-f="${f}" aria-label="${label}"><button type="button" data-step="${esc(k)}" data-sf="${f}" data-sn="1" aria-label="${label} plus one">+</button></div></div>`;}
function render(){
  const ex=INFO.existing, g=grouped();
  $("#app").innerHTML=`${head()}
  <div class="card stack">
    <div class="g2"><label class="f">Outlet<span class="fixed">${esc(INFO.outlet.name)}</span></label>
    <label class="f">Date<input id="date" type="date" value="${esc(DATE)}"></label></div>
    <label class="f">Your name<input id="who" value="${esc(WHO)}" placeholder="e.g. Aina" autocomplete="name"></label>
  </div>
  ${ex?`<div class="banner ${ex.locked?"warn":"info"}" style="margin-top:12px">${ex.locked?"This week is already billed. Your changes will be sent to the office to review.":`A report for this day was already sent${ex.by?` by <b>${esc(ex.by)}</b>`:""}${ex.at?` at ${esc(new Date(ex.at).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}))}`:""}. Fix anything below and send again — the new report replaces the old one.`}</div>`:""}
  ${DRAFTED?`<div class="banner info" style="margin-top:12px">We kept the counts and photos you hadn't sent yet.</div>`:""}
  <section class="sec">
    <h2>Count the cakes</h2>
    <p class="hint">Colours we delivered are already open. Found another colour? Tap its dot to add it. For each colour: <b>Waste</b> = thrown away or damaged, <b>Left</b> = still in the chiller now. Leave a box empty if it's 0.</p>
    ${safetyBanner()}
    ${g.length?g.map(c=>`<div class="cat">${esc(c.cat)}</div>${c.items.map(({p,keys})=>`<div class="cake" id="cake-${esc(p.id)}"><div class="hd">${pic(p)}<div class="tt"><div class="nm">${esc(p.name)}</div><div class="sub">${keys.length?`${keys.length} colour${keys.length>1?"s":""}`:"Tap the colour dot on the cake"}</div></div>
      <div class="dots" role="group" aria-label="Colour dots for ${esc(p.name)}">${COL().map(c=>{const k=K(p.id,c.name), on=!!ROWS[k]; return `<button type="button" class="cd${on?" on":""}" data-cd="${esc(k)}" aria-pressed="${on}" aria-label="${esc(c.name)}, made ${esc(colDay(c.name))}"><i style="background:${esc(c.hex)}"></i><span>${esc(colDay(c.name))}</span></button>`;}).join("")}</div></div>
      ${keys.map(k=>{const r=ROWS[k];return `<div class="ln"><div class="dot"><i style="background:${esc(colHex(r.colour))}"></i><span>${esc(r.colour)}<small>made ${esc(colDay(r.colour))}</small>${(()=>{const q=sfOf(r.productId,r.colour);return q==="bad"?`<small class="sf bad">Past shelf life: throw away</small>`:q==="warn"?`<small class="sf warn">Last day: sell first</small>`:"";})()}</span></div>${stepper(k,"w","Waste")}${stepper(k,"b","Left")}</div>`}).join("")}</div>`).join("")}`).join("")
      :`<div class="empty">No cakes on record for this outlet today. Use the button below to add what you have.</div>`}
    <button class="link" type="button" data-act="add">+ Add a cake that's not listed</button>
  </section>
  <section class="sec">
    <h2>Photos</h2>
    ${shotBox("sales","Today's sales report","From your POS: the list of items sold today. Take more than one photo if it's long.",true)}
    ${shotBox("display","Chiller display","All the cakes left in the chiller now.")}
    ${hasWaste()?shotBox("waste",`Waste photo (you entered ${wasteN()} wasted)`,"Needed only because you entered waste. Take a photo of the cakes you are throwing away."):""}
  </section>
  <section class="sec"><label class="f">Anything else? (optional)<textarea id="note" rows="2" placeholder="Short delivery, damaged cake, chiller issue…">${esc(NOTE)}</textarea></label></section>`;
  saveDraft(); $("#bar").hidden=false; $("#next").textContent="Review report"; $("#next").disabled=false; status(missing().length?"Still needed: "+missing().join(", ")+".":"Ready — tap Review report.");
}
function shotBox(key,title,hint,multi){
  const v=PH[key], has=multi?v.length>0:!!v;
  const imgs=multi?v.map((u,i)=>`<span class="tw"><img src="${u}" alt="Sales photo ${i+1}"><button type="button" data-rm="${key}|${i}" aria-label="Remove photo">×</button></span>`).join(""):(v?`<span class="tw"><img src="${v}" alt=""><button type="button" data-rm="${key}|0" aria-label="Remove photo">×</button></span>`:"");
  const canAdd=multi?v.length<3:!v;
  return `<div class="shot ${has?"done":""}" id="shot-${key}"><div class="t"><b>Required:</b> ${esc(title)}<br><span class="hint">${esc(hint)}</span></div>
    <div class="thumbs">${imgs}${canAdd?`<label class="btn sm">📷 ${has?"Take another":"Take photo"}<input type="file" accept="image/*" capture="environment" data-shot="${key}" hidden></label><label class="btn sm">🖼 Choose from phone<input type="file" accept="image/*" data-shot="${key}" hidden></label>`:""}</div></div>`;
}
const hasWaste=()=>ORDER.some(k=>+ROWS[k].w>0);
function missing(){const m=[]; if(((($("#who")||{}).value)||WHO).trim().length<2) m.push("your name"); if(!PH.sales.length) m.push("sales report photo"); if(!PH.display) m.push("chiller photo"); if(hasWaste()&&!PH.waste) m.push("waste photo"); return m;}
async function shrink(file,max){
  const url=URL.createObjectURL(file);
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
  const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
  return c.toDataURL("image/jpeg",0.85);
}
function openAdd(step,pid){
  const shown=new Set(SHOWN);
  let body;
  if(false){const p=prod(pid); body=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">${pic(p)}<h2>${esc(p.name)}</h2></div><p class="hint" style="margin-bottom:10px">Which colour dot is on the cake?</p><div class="cols">${COL().map(c=>`<button type="button" data-addcol="${esc(pid)}|${esc(c.name)}"><i style="background:${esc(c.hex)}"></i>${esc(c.name.slice(0,1)+c.name.slice(1).toLowerCase())}<br>${esc(colDay(c.name))}</button>`).join("")}</div>`;}
  else{const cats={}; INFO.products.forEach(p=>(cats[p.category]=cats[p.category]||[]).push(p)); body=`<h2 style="margin-bottom:6px">Add a cake</h2>${Object.keys(cats).map(c=>`<div class="cat">${esc(c)}</div>${cats[c].map(p=>`<button class="pick" type="button" data-addp="${esc(p.id)}">${pic(p)}<span>${esc(p.name)}${shown.has(p.id)?` <span class="tag mute">listed</span>`:""}</span></button>`).join("")}`).join("")}`;}
  $("#sheet").innerHTML=`<div class="sheet" data-close="1"><div class="box" role="dialog" aria-label="Add a cake">${body}<div style="margin-top:14px"><button class="btn" type="button" data-close="1" style="width:100%">Cancel</button></div></div></div>`;
}
function collect(){ WHO=($("#who")||{value:WHO}).value.trim(); NOTE=($("#note")||{value:NOTE}).value; store.set("chaleur.who",WHO);
  return {key:KEY,date:DATE,who:WHO,note:NOTE,lines:ORDER.map(k=>ROWS[k]).filter(r=>r.w!==""||r.b!==""||true).map(r=>({productId:r.productId,colour:r.colour,w:+r.w||0,b:+r.b||0})),photos:{sales:PH.sales,display:PH.display,waste:hasWaste()?PH.waste:null}}; }
async function review(){
  const m=missing(); if(m.length){ status("Still needed: "+m.join(", ")+".",true); const first=!PH.sales.length?"#shot-sales":!PH.display?"#shot-display":hasWaste()&&!PH.waste?"#shot-waste":"#who"; const el=$(first); if(el){el.classList&&el.classList.add("need"); el.scrollIntoView({behavior:"smooth",block:"center"});} return; }
  const d=collect(); window.scrollTo(0,0);
  $("#app").innerHTML=`${head()}<div class="card" style="text-align:center;padding:26px"><span class="spin"></span><p style="margin:12px 0 0">Reading your sales photo and checking the numbers…</p><p class="hint">This takes a few seconds.</p></div>`;
  $("#bar").hidden=true;
  try{ PREV=await run("previewClosing",d); }catch(e){ PREV={read:{ok:false,note:"Could not check the numbers right now. You can still send the report."},check:[]}; }
  renderPreview(d);
}
function renderPreview(d){
  const r=PREV.read||{}, ch=PREV.check||[], probs=ch.filter(c=>c.diff);
  const tot=f=>d.lines.reduce((s,l)=>s+(+l[f]||0),0);
  $("#app").innerHTML=`${head()}
  <div class="card stack"><h2>Check before sending</h2>
    <p class="hint">${esc(INFO.outlet.name)} · ${esc(niceDate(DATE))} · counted by <b>${esc(d.who)}</b></p>
    ${r.ok?(probs.length?`<div class="banner warn"><b>${probs.length} cake${probs.length>1?"s don't":" doesn't"} add up.</b> Please recount these, or tap <b>Edit</b>. If your count is right, send anyway and add a note.</div>`:`<div class="banner info">✓ Everything adds up with your sales report.</div>`)
      :`<div class="banner info">${esc(r.note||"The sales photo will be checked by the office.")}</div>`}
    ${(()=>{const bad=d.lines.filter(l=>l.b>0&&sfOf(l.productId,l.colour)==="bad");return bad.length?`<div class="banner warn">${bad.map(l=>`${esc(prod(l.productId).name)} ${esc(l.colour)}`).join(", ")}: counted as <b>Left</b> but past shelf life. Please throw them away and move them to <b>Waste</b> (tap Edit).</div>`:"";})()}
    <div style="overflow-x:auto"><table><thead><tr><th>Cake</th>${r.ok?"<th>Sold</th>":""}<th>Waste</th><th>Left</th>${r.ok?"<th>Check</th>":""}</tr></thead><tbody>
    ${(ch.length?ch:aggregate(d.lines)).map(c=>`<tr><td>${esc(c.name||prod(c.productId).name)}</td>${r.ok?`<td>${c.sold??0}</td>`:""}<td>${c.waste||""}</td><td>${c.balance||""}</td>${r.ok?`<td>${c.diff?`<span class="tag warn">${c.diff>0?c.diff+" missing":(-c.diff)+" extra"}</span>`:`<span class="tag ok">OK</span>`}</td>`:""}</tr>`).join("")||`<tr><td colspan="5" class="hint">No cakes counted.</td></tr>`}
    </tbody></table></div>
    <p class="hint">Total waste <b>${tot("w")}</b> · total left <b>${tot("b")}</b>${r.ok?` · sold <b>${Object.values(r.sold||{}).reduce((a,b)=>a+b,0)}</b>`:""}</p>
    ${r.ok&&(r.other||[]).length?`<p class="hint">Also on the sales report (not matched to our cakes): ${r.other.map(o=>esc(o.seen)+" ×"+o.qty).join(", ")}</p>`:""}
    ${r.ok&&r.note?`<p class="hint">Note from the reader: ${esc(r.note)}</p>`:""}
    ${r.ok&&r.date&&r.date!==DATE?`<div class="banner warn">The sales report looks like it's for <b>${esc(niceDate(r.date))}</b>, not ${esc(niceDate(DATE))}. Please check the photo.</div>`:""}
    <div class="thumbs">${d.photos.sales.concat([d.photos.display]).concat(d.photos.waste?[d.photos.waste]:[]).map(u=>`<img src="${u}" alt="">`).join("")}</div>
    ${d.note?`<p class="hint">Note: ${esc(d.note)}</p>`:""}
  </div>`;
  $("#bar").hidden=false; $("#bar .in").innerHTML=`<button class="btn" id="edit" type="button">Edit</button><button class="btn go" id="send" type="button">Confirm &amp; send</button><div class="status" id="status"></div>`;
  $("#edit").onclick=()=>{restoreBar();render();};
  $("#send").onclick=()=>send(d);
}
function aggregate(lines){const by={};lines.forEach(l=>{const x=by[l.productId]||(by[l.productId]={productId:l.productId,waste:0,balance:0});x.waste+=l.w;x.balance+=l.b;});return Object.values(by);}
function restoreBar(){$("#bar .in").innerHTML=`<button class="btn go" id="next" type="button">Review report</button><div class="status" id="status"></div>`;$("#next").onclick=review;}
async function send(d){
  if(SENDING) return; SENDING=true; $("#send").disabled=true; $("#edit").disabled=true; status("Sending report and photos… keep this page open.");
  try{
    const r=await run("submitClosing",{...d,token:PREV&&PREV.token}); clearDraft();
    $("#bar").hidden=true; window.scrollTo(0,0);
    const wa=r.wa?`https:\/\/wa.me/${esc(r.wa)}?text=${encodeURIComponent(r.summary)}`:"";
    $("#app").innerHTML=`${head()}<div class="done"><div class="ok">✓</div><h2>${r.mode==="replaced"?"Report updated":"Report sent"}</h2><p style="margin:0">Thank you, ${esc(d.who)}.<br>Reference <b style="font-family:var(--mono)">${esc(r.id)}</b></p>
      ${wa?`<a class="btn go" href="${wa}" target="_blank" rel="noopener" style="width:100%">Send summary to Chaleur on WhatsApp</a>`:""}
      <button class="btn" type="button" data-act="again" style="width:100%">Edit this report</button>
      <p class="hint">Made a mistake? Tap "Edit this report", fix it and send again. The newest report is the one that counts.</p></div>`;
    PH={sales:[],display:null,waste:null};
  }catch(e){ status(e.message||"Sending failed. Check your internet and try again.",true); $("#send").disabled=false; $("#edit").disabled=false; }
  SENDING=false;
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-close]"); if(!t) return; const d=t.dataset;
  if(d.close&&(e.target===t||t.tagName==="BUTTON")){$("#sheet").innerHTML="";return;}
  if(d.act==="retry"){load();return;}
  if(d.step){const k=d.step,f=d.sf,n=d.sn; const r=ROWS[k]; const v=Math.max(0,(+r[f]||0)+(+n)); r[f]=v?String(v):""; const inp=document.querySelector(`input[data-k="${CSS.escape(k)}"][data-f="${f}"]`); if(inp) inp.value=r[f]; if(f==="w") softRefresh(); saveDraft(); return;}
  if(d.rm){const [key,i]=d.rm.split("|"); if(key==="sales") PH.sales.splice(+i,1); else PH[key]=null; keep(); render(); return;}
  if(d.act==="add"){keep();openAdd();return;}
  if(d.addp){const p=d.addp; if(!SHOWN.includes(p)) SHOWN.push(p); $("#sheet").innerHTML=""; render(); setTimeout(()=>{const el=document.getElementById("cake-"+p); if(el) el.scrollIntoView({block:"center",behavior:"smooth"});},60); return;}
  if(d.cd){const k=d.cd, r=ROWS[k], y=window.scrollY; keep();
    if(!r){const [p,c]=k.split("|"); ROWS[k]={productId:p,colour:c,w:"",b:""}; ORDER.push(k);}
    else if(!EXP.has(k)&&r.w===""&&r.b===""){delete ROWS[k]; ORDER=ORDER.filter(x=>x!==k); render(); window.scrollTo(0,y); return;}
    render(); window.scrollTo(0,y); return;}
  if(d.act==="again"){restoreBar();load();return;}
});
function keep(){ if($("#who")) WHO=$("#who").value; if($("#note")) NOTE=$("#note").value; }
let wasW=false;
function softRefresh(){ const hw=hasWaste(); if(hw!==wasW){wasW=hw; keep(); const y=window.scrollY; render(); window.scrollTo(0,y);} else status(missing().length?"Still needed: "+missing().join(", ")+".":"Ready — tap Review report."); }
document.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.k){const v=t.value.replace(/[^0-9]/g,""); ROWS[t.dataset.k][t.dataset.f]=v===""?"":String(+v); if(t.dataset.f==="w") softRefresh(); saveDraft(); return;}
  if(t.id==="who"){WHO=t.value; status(missing().length?"Still needed: "+missing().join(", ")+".":"Ready — tap Review report.");}
  if(t.id==="note") NOTE=t.value;
  if(t.id==="who"||t.id==="note") saveDraft();
});
document.addEventListener("change",async e=>{const t=e.target;
  if(t.id==="date"&&t.value){keep();DATE=t.value;return load();}
  if(t.dataset.shot&&t.files&&t.files[0]){const key=t.dataset.shot; keep(); status("Processing photo…");
    try{const u=await shrink(t.files[0],key==="sales"?2000:1400); if(key==="sales") PH.sales.push(u); else PH[key]=u;}catch(err){status("That photo couldn't be read. Please try again.",true);}
    const y=window.scrollY; render(); window.scrollTo(0,y);}
});
wasW=false;
document.getElementById("next").onclick=review;
load();
</script>
