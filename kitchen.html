  const LEG={owner:"kitchen kapprove todo qc deliv doedit chase audit view money reports setup bills problems staff admin",manager:"kitchen kapprove todo qc deliv doedit chase audit view money reports setup bills problems staff admin",
    office:"kitchen todo deliv doedit chase audit view money reports setup problems",supervisor:"kitchen kapprove todo qc deliv doedit chase",kitchen:"kitchen qc deliv",auditor:"kitchen audit view money"};
  const LEGA={owner:"office",manager:"office",office:"office",supervisor:"kitchen",kitchen:"kitchen",auditor:"outlets"};

  /* While viewing as another role, a strip at the top of every page says so */
  function vaStrip(){ const c=get(); if(!c||!c.as||document.getElementById("ca-vastrip")) return; const d=document.createElement("div"); d.id="ca-vastrip"; d.className="ca-vabar";
    d.innerHTML=`<span>👁 You're seeing the app as <b>${esc(c.as)}</b> (${esc(labelOf(c))}). Changes you make are recorded as ${esc(c.name)}.</span><span class="ca-vact">${vaSelect()}<button type="button" data-ca-viewback="1">Back to Owner</button></span>`; document.body.prepend(d);
    const fit=()=>document.documentElement.style.setProperty("--vah",d.offsetHeight+"px"); fit(); if(window.ResizeObserver) new ResizeObserver(fit).observe(d); window.addEventListener("resize",fit); }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",vaStrip); else setTimeout(vaStrip,0);
  /* Where a "what to do next" item goes: page + tab (#hash) + kitchen team */
  const nextHref=g=>g?(g.page+(g.team?"?team="+encodeURIComponent(g.team):"")+(g.hash?"#"+g.hash:"")):"";
  const nextList=(items,links)=>`<ul class="ca-next">${(items||[]).map(x=>`<li><i class="${esc(x.sev)}"></i><span>${links&&x.go?`<a href="${esc(nextHref(x.go))}">${esc(x.text)}</a>`:esc(x.text)}</span></li>`).join("")}</ul>`;
  document.addEventListener("click",e=>{const b=e.target&&e.target.closest&&e.target.closest("[data-ca-logout]"); if(b){e.preventDefault(); b.disabled=true; logout();}});
  /* Report a problem: what's wrong (same list as the server). Short names are used in My reports. */
  const FBK=[["app","App not working","App problem"],["numbers","Wrong numbers","Wrong numbers"],["equipment","Equipment broken","Equipment"],["stock","Stock / ingredients","Stock"],["safety","Food safety","Food safety"],["idea","Idea / other","Idea"]];
  const fbl=k=>(FBK.find(x=>x[0]===k)||["","Other","Other"]);
  const FBS={open:"New",doing:"Being fixed",done:"✓ Done"};
  /* Photo for a report: made smaller (max 1280 px, JPEG) so it sends fast on a phone */
  const shrink=file=>new Promise((res,rej)=>{ const r=new FileReader(); r.onerror=()=>rej(new Error("Couldn't read the photo.")); r.onload=()=>{ const im=new Image(); im.onerror=()=>rej(new Error("Couldn't read the photo."));
    im.onload=()=>{ const k=Math.min(1,1280/Math.max(im.width,im.height)), c=document.createElement("canvas"); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext("2d").drawImage(im,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",.8)); };
    im.src=r.result; }; r.readAsDataURL(file); });
  let openHelp=()=>{};
  /* Sent with every report, so we know where it happened: the page, the link, the phone, and the last message on screen */
  const LAST={t:"",at:0};
  const note=t=>{ t=String(t||"").replace(/\s+/g," ").trim(); if(t&&!/^(Saving|Sending|Loading|Signing in|Checking)/i.test(t)){ LAST.t=t.slice(0,200); LAST.at=Date.now(); } };
  function watchMsgs(){ if(watchMsgs.on||!document.body) return; watchMsgs.on=1;
    window.addEventListener("error",e=>note("Error: "+(e.message||""))); window.addEventListener("unhandledrejection",e=>note("Error: "+((e.reason&&e.reason.message)||e.reason||"")));
    try{ new MutationObserver(ms=>{ for(const m of ms){ const n=m.target.nodeType===1?m.target:m.target.parentElement; const el=n&&n.closest&&n.closest("#toast,#status,[role=alert],[role=status],.err"); if(el&&!el.closest(".ca-hp")&&!el.hidden) note(el.textContent); } }).observe(document.body,{childList:true,subtree:true,characterData:true}); }catch(e){} }
  const device=()=>{ const u=navigator.userAgent||""; return [/iPhone|iPad|iPod/.test(u)?"iPhone/iPad":/Android/.test(u)?"Android":/Mac/.test(u)?"Mac":/Windows/.test(u)?"Windows":"Other",
    /Edg\//.test(u)?"Edge":/CriOS|Chrome\//.test(u)?"Chrome":/FxiOS|Firefox/.test(u)?"Firefox":/Safari/.test(u)?"Safari":"Browser", (window.innerWidth||0)+"px"].join(" · "); };
  const recent=()=>LAST.t&&Date.now()-LAST.at<15*60*1000?LAST.t:"";
  const cap=w=>w?w.charAt(0).toUpperCase()+w.slice(1).toLowerCase():"";
  const hm=iso=>{ try{ return new Date(iso).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:"Asia/Kuala_Lumpur"}); }catch(e){ return ""; } };
  const dayTxt=iso=>{ try{ const f=d=>d.toLocaleDateString("en-CA",{timeZone:"Asia/Kuala_Lumpur"}), d=new Date(iso), t=new Date(), y=new Date(Date.now()-864e5);
    return f(d)===f(t)?"today "+hm(iso):f(d)===f(y)?"yesterday "+hm(iso):d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",timeZone:"Asia/Kuala_Lumpur"}); }catch(e){ return ""; } };
  function helper(opt){
    if(document.getElementById("ca-hbtn")) return;
    watchMsgs();
    const b=document.createElement("button"); b.id="ca-hbtn"; b.className="ca-hbtn"; b.type="button"; b.textContent="? Ask"; b.setAttribute("aria-label","Ask the helper a question or report a problem"); b.setAttribute("aria-expanded","false");
    document.body.appendChild(b);
    let panel=null, bd=null, H=[], busy=false, VIEW="ask";
    const R0=()=>({type:"",text:"",photo:"",urgent:false,busy:false,err:"",sent:null});
    let FB=R0(), MINE=null, MINEB=false;
    const hi=opt.hello||"Hi! Ask me how to do anything in this app. For example: “How do I send the closing report?” or “Why can't I mark the delivery as delivered?” You can write in English, Malay or Chinese.";
    let NX=null, NXB=false;
    const tok=()=>{ const au=opt.auth&&opt.auth(); return au&&/^s1\./.test(String(au))?au:(au||""); };
    const plain=t=>String(t||"").replace(/\*\*(.+?)\*\*/g,"$1").replace(/^#+\s*/gm,"").replace(/^\s*[-*]\s+/gm,"• ").replace(/\n{3,}/g,"\n\n").trim();
    const first=()=>{ const s0=get(); return cap(String((s0&&s0.name)||(NX&&NX.name)||"").split(" ")[0]); };
    const pageName=()=>opt.page?opt.page():document.title;
    function loadMine(force){ const au=tok(); if(!au||MINEB||(MINE&&!force)) return; MINEB=true; run("feedbackMine",au).then(r=>{MINE=r||[];}).catch(()=>{MINE=MINE||[];}).then(()=>{MINEB=false; paint();}); }
    function mineCount(){ if(!MINE||!MINE.length) return ""; const d=MINE.filter(x=>x.status==="doing").length, n=MINE.filter(x=>x.status==="open").length; return [d?d+" being fixed":"",n?n+" new":""].filter(Boolean).join(" · ")||MINE.length+" done"; }
    function head(){ if(VIEW==="mine") return `<div class="ca-hd" style="justify-content:flex-start;gap:12px"><button type="button" class="ca-back" data-hv="fb" aria-label="Back">‹</button><div class="ca-ttl" style="flex:1"><small>Helper</small>My reports</div><button type="button" class="ca-x" aria-label="Close helper">✕</button></div>`;
      return `<div class="ca-hd"><span class="ca-ttl">Helper</span><button type="button" class="ca-x" aria-label="Close helper">✕</button></div>
        ${opt.noReport?"":`<div class="ca-tabs" role="tablist"><button type="button" role="tab" data-hv="ask" aria-selected="${VIEW==="ask"}">Ask a question</button><button type="button" role="tab" data-hv="fb" aria-selected="${VIEW==="fb"}">Report a problem</button></div>`}`; }
    function askHtml(){
      const nx=NX&&NX.items&&NX.items.length?`<div class="ca-m ca-a"><b>Hi ${esc(cap(String(NX.name||"").split(" ")[0]))}! Next for you:</b>${nextList(NX.items,true)}<div style="margin-top:6px">Tap an item to go there, or ask me how to do it.</div></div>`:(NXB?`<div class="ca-m ca-a">Checking what's next for you…</div>`:"");
      return `<div class="ca-body"><div class="ca-msgs" aria-live="polite">${nx}<div class="ca-m ca-a">${esc(hi)}${opt.noReport?"":`<div style="margin-top:6px"><a class="ca-lnk" href="index.html#guide">Open the how-to guide ›</a></div>`}</div>${H.map(x=>x.q!=null?`<div class="ca-m ca-q">${esc(x.q)}</div>`:`<div class="ca-m ca-a" style="white-space:pre-wrap">${esc(plain(x.a))}</div>`).join("")}${busy?`<div class="ca-m ca-a">Thinking…</div>`:""}</div></div>
        <div class="ca-foot"><form class="ca-askf"><textarea rows="1" placeholder="Ask a question…" aria-label="Your question"></textarea><button type="submit">Send</button></form></div>`; }
    function fbHtml(){
      if(FB.sent){ const x=FB.sent;
        return `<div class="ca-body"><div class="ca-done" role="status"><span class="ca-tick" aria-hidden="true">✓</span><div class="ca-thx">Thanks, ${esc(first()||"there")}. We got it.</div>
          <div style="font-size:15px;color:var(--muted,#6f5f62);line-height:1.5">Your report <b style="color:var(--ink,#2b1b1e)">#${esc(x.ref)}</b> went to the office. ${x.urgent?"Marked urgent: your supervisor gets a WhatsApp now.":"You'll see replies in My reports."}</div>
          <div class="ca-sum"><div style="font-weight:600">${esc(fbl(x.type)[1])}${x.urgent?" · Urgent":""}</div><div style="color:var(--muted,#6f5f62);margin-top:2px;white-space:pre-wrap">${esc(x.text||(x.photo?"No description, photo only":"No description"))}</div><div style="color:var(--muted,#6f5f62);font-size:12px;margin-top:6px">From: ${esc(x.page)} · ${esc(hm(x.at))}</div></div>
          <button type="button" class="ca-lnk" data-hv="mine">See my reports ›</button></div></div>
          <div class="ca-foot"><button type="button" class="ca-sec56" data-fbreset="1">Report something else</button><button type="button" class="ca-pri56" data-fbclose="1">Back to my work</button></div>`; }
      const lm=recent(), mc=mineCount();
      return `<div class="ca-body">
        <div><div class="ca-eb">What's wrong?</div><div class="ca-types">${FBK.map(([k,l])=>`<button type="button" data-fbt="${k}" aria-pressed="${FB.type===k}">${esc(l)}</button>`).join("")}</div></div>
        <div><div class="ca-eb">Tell us in one line (any language)</div><textarea class="ca-ft" placeholder="e.g. Freezer 2 door doesn't close / Send button stuck" aria-label="What happened">${esc(FB.text)}</textarea></div>
        <div class="ca-ph"><div class="ca-thumb">${FB.photo?`<img src="${esc(FB.photo)}" alt="Your photo"><button type="button" data-fbnophoto="1" aria-label="Remove photo">✕</button>`:"photo"}</div><label class="ca-phb">${FB.photo?"Change photo":"Add photo / screenshot"}<input type="file" accept="image/*" class="ca-fp" hidden></label></div>
        <button type="button" class="ca-urg" data-fburg="1" aria-pressed="${FB.urgent}"><i aria-hidden="true">${FB.urgent?"✓":""}</i><span><b>Urgent</b>: it stops my work right now</span></button>
        <p class="ca-note">We attach the page you were on (<b>${esc(pageName())}</b>) and your name, so you don't need to explain where.${lm?` We also attach the last message on your screen: “${esc(lm)}”.`:""}</p>
        ${FB.err?`<p class="ca-err" role="alert">${esc(FB.err)}</p>`:""}
        ${mc?`<button type="button" class="ca-lnk" data-hv="mine">My reports · ${esc(mc)} ›</button>`:""}</div>
        <div class="ca-foot"><button type="button" class="ca-go60" data-fbsend="1" ${!FB.type||FB.busy?"disabled":""}>${FB.busy?"Sending…":FB.type?"Send report":"Pick what's wrong first"}</button></div>`; }
    function mineHtml(){
      const list=MINE==null?`<p class="ca-note">Loading your reports…</p>`:!MINE.length?`<p class="ca-note">No reports yet. When you report a problem, you'll see here what happens to it.</p>`:
        MINE.map(x=>`<div class="ca-rc ${x.status==="done"?"done":""}"><div class="ca-rt"><b>${esc(fbl(x.kind)[2])}${x.urgent?" · Urgent":""}</b><span class="ca-pill ${esc(x.status)}">${esc(FBS[x.status]||x.status)}</span></div>
          ${x.text?`<div class="ca-tx">${esc(x.text)}</div>`:""}${x.reply?`<div class="ca-rp"><b>${esc(cap(String(x.updBy||"Office").split(" ")[0]))}:</b> ${esc(x.reply)}</div>`:""}
          <div class="ca-mt">${x.ref?"#"+esc(x.ref)+" · ":""}${esc(dayTxt(x.at))}</div></div>`).join("");
      return `<div class="ca-body">${list}</div><div class="ca-foot"><button type="button" class="ca-pri56" data-hv="fb" data-fbreset="1" style="min-height:60px;font-size:17px">Report a new problem</button></div>`; }
    function paint(){ if(!panel) return; const keep=panel.querySelector(".ca-ft"), kv=keep?keep.value:null;
      panel.innerHTML=`<div class="ca-grab" aria-hidden="true"><span></span></div>${head()}${VIEW==="ask"?askHtml():VIEW==="mine"?mineHtml():fbHtml()}`;
      if(kv!=null&&panel.querySelector(".ca-ft")) panel.querySelector(".ca-ft").value=FB.text;
      const m=panel.querySelector(".ca-body"); if(VIEW==="ask"&&m) m.scrollTop=m.scrollHeight;
      wire(); }
    function wire(){
      panel.querySelector(".ca-x").onclick=close;
      const ta=panel.querySelector(".ca-askf textarea");
      if(ta){ ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();panel.querySelector(".ca-askf").dispatchEvent(new Event("submit",{cancelable:true}));}});
        panel.querySelector(".ca-askf").onsubmit=async e=>{e.preventDefault(); const q=ta.value.trim(); if(!q||busy) return;
          const auth=opt.auth(); if(!auth){H.push({q},{a:"Please sign in first, then ask again."}); paint(); return;}
          H.push({q}); busy=true; paint();
          try{const r=await run("askHelp",auth,q,pageName(),H.slice(-7,-1)); H.push({a:r.answer||"Sorry, I don't know. Please ask your supervisor."});}
          catch(err){H.push({a:(err&&err.message)||"The helper is not available right now."});}
          busy=false; paint(); const t2=panel&&panel.querySelector(".ca-askf textarea"); t2&&t2.focus(); }; }
      const ft=panel.querySelector(".ca-ft"); if(ft) ft.oninput=()=>{FB.text=ft.value;};
      const fp=panel.querySelector(".ca-fp"); if(fp) fp.onchange=async e=>{ const fl=e.target.files&&e.target.files[0]; if(!fl) return; try{ FB.photo=await shrink(fl); FB.err=""; }catch(x){ FB.err=x.message; } paint(); };
    }
    function onClick(e){ const t=e.target.closest("button"); if(!t||!panel||!panel.contains(t)) return; const d=t.dataset;
      if(d.fbreset){ FB=R0(); }
      if(d.hv){ setView(d.hv); return; }

      if(d.fburg){ FB.urgent=!FB.urgent; paint(); return; }
      if(d.fbnophoto){ FB.photo=""; paint(); return; }
      if(d.fbclose){ FB=R0(); close(); return; }
      if(d.fbreset){ paint(); return; }
      if(d.fbsend) send(); }
    async function send(){ const au=tok(); if(!au){ FB.err="Please sign in first."; paint(); return; } if(!FB.type||FB.busy) return;
      FB.busy=true; FB.err=""; paint();
      const pg=pageName();
      try{ const r=await run("feedbackSend",au,{kind:FB.type,text:FB.text.trim(),page:pg,photo:FB.photo,urgent:FB.urgent,url:(location.pathname.split("/").pop()||"index.html")+location.search+location.hash,dev:device(),last:recent()});
        FB.sent={ref:r.ref||r.id,type:FB.type,text:FB.text.trim(),photo:!!FB.photo,urgent:FB.urgent,page:pg,at:r.at||new Date().toISOString()}; FB.busy=false; MINE=null; loadMine(true); }
      catch(x){ FB.busy=false; FB.err=(x&&x.message)||"Couldn't send. Please try again."; }
      paint(); }
    function setView(v){ VIEW=opt.noReport?"ask":(v==="mine"?"mine":v==="fb"?"fb":"ask"); if(VIEW==="mine") loadMine(true); else if(VIEW==="fb") loadMine(); paint();
      const f=panel&&panel.querySelector(VIEW==="ask"?".ca-askf textarea":VIEW==="fb"?".ca-types button":".ca-back"); if(f&&VIEW!=="fb") f.focus(); }

    function open(v){

      panel=document.createElement("div"); panel.className="ca-hp"; panel.setAttribute("role","dialog"); panel.setAttribute("aria-modal","true"); panel.setAttribute("aria-label","Helper");

      const au=tok(); if(au&&/^s1\./.test(String(au))&&!NX&&!NXB){ NXB=true; run("myNext",au).then(r=>{NX=r;}).catch(()=>{}).then(()=>{NXB=false; if(VIEW==="ask") paint();}); }
      setView(v||VIEW);
    }
    b.onclick=()=>{ if(panel){close();return;} open(); };
    openHelp=v=>open(v);
  }
  return {get,save,clear,run,isAuthErr,loginForm,logout,toLogin,chip,helper,openHelp:v=>openHelp(v),ROLE,esc,nextHref,nextList,HOME,canView,vaSelect,loadVA,permsOf,labelOf,areaOf,can,update};
})();
</script>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --ground:#f7f2ec; --paper:#ffffff; --ink:#2b1b1e; --muted:#6f5f62; --line:#e8dcd6;
  --accent:#7b1c2b; --accent-ink:#ffffff; --soft:#f3e4e5; --ok:#2f6b45; --warn:#9a5a12;
  --display:"Cormorant Garamond","Times New Roman",Georgia,serif;
  --body:"Jost",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#161012; --paper:#201719; --ink:#f2e9e6; --muted:#b9a8aa; --line:#3a2c2f;
  --accent:#e4a1ac; --accent-ink:#1b1113; --soft:#3a2227; --ok:#7fd1a0; --warn:#f0b46a; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#161012; --paper:#201719; --ink:#f2e9e6; --muted:#b9a8aa; --line:#3a2c2f;
  --accent:#e4a1ac; --accent-ink:#1b1113; --soft:#3a2227; --ok:#7fd1a0; --warn:#f0b46a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:18px 120px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.tabs{display:flex;gap:6px;margin:16px 0;background:var(--soft);padding:4px;border-radius:10px}
.tabs button{flex:1;border:0;background:transparent;color:var(--ink);font:600 14px var(--body);padding:10px;border-radius:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
label.f input,label.f select,label.f textarea,.num input{font-size:16px;text-transform:none;letter-spacing:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sec{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.sec h2{font-family:var(--display);font-weight:600;font-size:22px;margin:0}
.hint{color:var(--muted);font-size:13px;margin:0}
.prod{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.prod .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.prod .name{font-weight:600}
.id{display:flex;align-items:center;gap:10px}
.pic{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;background:var(--soft)}
.pic.ph{display:grid;place-items:center;font:600 18px var(--display);color:var(--muted)}
.sku{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{width:30px;height:30px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line);cursor:pointer;position:relative}
.chip[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.chip[aria-pressed="true"]::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;text-shadow:0 0 2px rgba(0,0,0,.6)}
.row{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:end;border-top:1px dashed var(--line);padding-top:10px}
.dot{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding-bottom:10px}
.dot i{width:14px;height:14px;border-radius:50%;display:inline-block}
.num{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.num input{text-align:center;font-family:var(--mono);font-variant-numeric:tabular-nums;padding:9px 4px}
.check{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--paper);color:var(--ink);padding:7px 10px;font:600 12px var(--body);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].p{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"].x{background:#b3261e;color:#fff}

<style>

document.addEventListener("click",e=>{ if(e.target.classList&&e.target.classList.contains("sheet")){ const h=e.target.parentElement; if(h) h.innerHTML=""; if(h&&h.id==="tksheet") TK=null; if(h&&h.id==="sheet"&&EQE!=null){ EQE=null; render(); } } });
document.addEventListener("input",e=>{ const t=e.target, d=t.dataset; if(t.closest&&t.closest(".ca-hp,.ca-login")) return;
  if(d.temp){ const [k,id]=d.temp.split("|"); if(/[-−]/.test(t.value)){ st(k).equip[id].neg=true; document.querySelectorAll(`[data-sign^="${k}|${id}|"]`).forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.sign.endsWith("|1")))); } let v=t.value.replace(/[^0-9.,]/g,""); if(v!==t.value) t.value=v; st(k).equip[id].t=v; saveDraft(k); refresh(); return; }
  if(d.kv){ const a=d.kv.split("|"), f=a.pop(), k=a.shift(), key=a.join("|"), s=st(k), r=key.indexOf("ev")===0&&key.indexOf("|")<0?s.ev[+key.slice(2)]:s.rows[key]; if(!r) return; const v=t.value.replace(/[^0-9]/g,"").slice(0,3); if(v!==t.value) t.value=v; r[f]=v; saveDraft(k); if(f==="w") wasteBox(k); refresh(); return; }
  if(d.evn){ const [k,i]=d.evn.split("|"), s=st(k); if(s.ev[+i]){ s.ev[+i].name=t.value.slice(0,40); saveDraft(k); refresh(); } return; }
  if(d.pnote){ const [k,p]=d.pnote.split("|"); st(k).notes[p]=t.value; saveDraft(k); return; }
  if(d.tk&&TK){ TK[d.tk]=t.value; return; }
  if(d.pli!=null&&PLE){ PLE.lines[+d.pli]=t.value; return; }
  if(d.plewhy&&PLE){ PLE.why=t.value; return; }
  if(d.ru){ RU[d.ru]=t.value; return; }
  if(d.eqi!=null&&LED){ LED.eq[+d.eqi][d.k]=t.value; LED.dirty=true; return; }
  if(t.id==="ls-why"&&LED){ LED.why=t.value; LED.dirty=true; return; }
  if(d.rcvv&&RCV){ const dd=doOf(RCV.id), l=((dd&&dd.lines)||[]).find(x=>x.productId+"|"+x.colour===d.rcvv); const v=String(t.value).replace(/[^0-9]/g,""); RCV.acc[d.rcvv]=v===""?"":Math.min(l?l.qty:99,+v); return; }
  if(d.rcvnote&&RCV){ RCV.note=t.value; return; }
});
document.addEventListener("change",async e=>{ const t=e.target, d=t.dataset; if(t.closest&&t.closest(".ca-hp,.ca-login")) return;
  if(d.kshot&&t.files&&t.files[0]){ const k=d.kshot, sp=document.getElementById("mi-"+k); if(sp) sp.insertAdjacentHTML("beforeend",' <span class="hint">processing…</span>'); if(TAB==="opening"||TAB==="closing"){ const b=$("#send"); b.disabled=true; }
    let bad=false; try{ P2[k]=await shrink(t.files[0],k==="plan_read"?1600:1200); savePh(k); }catch(err){ bad=true; }
    t.value=""; if(bad){ const el=document.getElementById("mi-"+k); if(el){ el.querySelectorAll(".hint").forEach(x=>x.remove()); el.insertAdjacentHTML("beforeend",' <span class="err">Photo not taken. Please try again.</span>'); } if(TAB==="opening"||TAB==="closing") refresh(); return; }
    const y=window.scrollY; render(); window.scrollTo(0,y); if(TAB==="opening"||TAB==="closing") refresh(); return; }
  if(d.tk&&TK){ TK[d.tk]=t.value; return; }
  if(d.tkday!=null&&TK){ const i=+d.tkday; TK.days=TK.days.filter(x=>x!==i); if(t.checked) TK.days.push(i); return; }
  if(d.tdone){ const id=d.tdone, on=t.checked; t.disabled=true;
    try{ const r=await run("hqSave","taskDone",{date:DATE,id,done:on}); const td=INFO.todo; const rec=on?{by:(INFO.me||{}).name||"",at:new Date().toISOString()}:null; if(rec) td.done[id]=rec; else delete td.done[id]; const x=td.tasks.find(y=>y.id===id); if(x) x.done=rec; if(on&&r.pts) xp(r.pts); else toast(r.msg);
      /* the last cake line of Finish & decorate ticks the whole job */
      if(on&&/^auto_d_/.test(id)){ const rows=decoRows(); if(rows.length&&rows.every(z=>doneOf(dId(z.pid)))&&!doneOf("auto_decorate")){ try{ const r2=await run("hqSave","taskDone",{date:DATE,id:"auto_decorate",done:true}); td.done.auto_decorate={by:(INFO.me||{}).name||"",at:new Date().toISOString()}; if(r2.pts) setTimeout(()=>xp(r2.pts),400); confetti(); }catch(_){ } } }
      render(); }
    catch(err){ t.checked=!on; t.disabled=false; toast(err.message); } return; }
  if(d.made){ const pid=d.made, v=String(t.value).replace(/[^0-9]/g,"").slice(0,4);
    try{ const r=await run("hqSave","made",{date:DATE,productId:pid,made:v}); if(v==="") delete INFO.todo.made[pid]; else INFO.todo.made[pid]=+v; toast(r.msg); const row=decoRows().find(x=>x.pid===pid); t.classList.toggle("short",v!==""&&row&&+v<row.qty); const cd=t.closest(".card"), nb=cd&&cd.querySelector(".dkt:not(.on) b"); if(nb&&row) nb.textContent=v===""?row.qty:v; }
    catch(err){ toast(err.message); } return; }
  if(d.door){ const [k,id]=d.door.split("|"); st(k).equip[id].door=t.checked; saveDraft(k); refresh(); return; }
  if(d.later){ st("opening").later[d.later]=t.checked; saveDraft("opening"); render(); return; }
  if(d.newd){ NEWD=t.value; render(); return; }
  if(d.rdate&&t.value){ RESULT=null; PART=null; K.opening=K.closing=null; await reload(t.value); return; }
  if(d.evc){ const [k,i]=d.evc.split("|"), s=st(k); if(s.ev[+i]){ s.ev[+i].colour=t.value; saveDraft(k); } return; }
  if(d.car){ if(t.checked) LED.carries.add(d.car); else LED.carries.delete(d.car); LED.dirty=true; return; }
  if(d.eqi!=null&&LED){ LED.eq[+d.eqi][d.k]=t.value; LED.dirty=true; render(); const pt=document.querySelector("#sheet .ptitle"); if(pt) pt.textContent=LED.eq[+d.eqi].name||"New unit"; return; }
});
$("#send").onclick=send;
window.addEventListener("hashchange",()=>{ const h=(location.hash||"").slice(1); if(TABS.some(([k])=>k===h)&&h!==TAB&&INFO){ TAB=h; RESULT=null; PART=null; V2=""; render(); } });
(function(){ CA.helper({auth:()=>TOK,page:()=>"Kitchen HQ › "+(V2==="deco"?"Finish & decorate":/^do:|^chk:|^rcv:/.test(V2)?"Delivery order":PART?partName(TAB,PART):((TABS.find(([k])=>k===TAB)||["",""])[1]))});
  const qt=new URLSearchParams(location.search).get("team"); if(qt==="am"||qt==="pm") teamSet(qt);
  const s=CA.get(); if(!s) return signIn(); TOK=s.t; boot2(); })();
</script>
