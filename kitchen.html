<script>
/* Chaleur sign-in (phone + PIN, remember me, log out) and the in-app helper. Shared by the office desk, kitchen and audit pages. */
const CA=(function(){
  const K="chaleur.s", ROLE={owner:"Owner",manager:"Manager",office:"Office",supervisor:"Kitchen supervisor",kitchen:"Kitchen",auditor:"Team"};
  const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const rd=st=>{try{const v=st.getItem(K);return v?JSON.parse(v):null}catch(e){return null}};
  function clear(){try{localStorage.removeItem(K)}catch(e){} try{sessionStorage.removeItem(K)}catch(e){} try{sessionStorage.removeItem("chaleur.pin")}catch(e){}}
  function get(){const s=rd(sessionStorage)||rd(localStorage); if(s&&(!s.t||(s.exp&&Date.now()>s.exp))){clear();return null;} return s;}
  function save(s){clear(); try{(s.remember?localStorage:sessionStorage).setItem(K,JSON.stringify(s));}catch(e){}}
  const run=(fn,...a)=>new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e instanceof Error?e:new Error((e&&e.message)||String(e))))[fn](...a));
  const isAuthErr=e=>/sign in again|expired/i.test((e&&e.message)||"");
  function loginForm(el,opt,done){
    opt=opt||{}; let last=""; try{last=localStorage.getItem("chaleur.lastid")||"";}catch(e){}
    el.innerHTML=`<div class="ca-login"><h2>${esc(opt.title||"Sign in")}</h2><p>${esc(opt.lede||"Use your phone number and your staff PIN.")}</p>
      <label>Phone number (or name)<input id="ca-id" type="text" autocomplete="username" autocapitalize="characters" spellcheck="false" placeholder="012-345 6789" value="${esc(last)}"></label>
      <label>PIN<input id="ca-pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="6"></label>
      <label class="ca-rem"><input id="ca-rem" type="checkbox"> Remember me on this phone for 30 days</label>
      <button class="ca-go" id="ca-go" type="button">Sign in</button><div class="ca-err" id="ca-err" role="alert">${esc(opt.msg||"")}</div>
      <p style="font-size:12.5px;margin-top:8px">No phone number set up yet? Type your name instead. Don't tick "Remember me" on a shared phone or computer.</p></div>`;
    const q=s=>el.querySelector(s), btn=q("#ca-go"), err=q("#ca-err");
    const go=async()=>{const id=q("#ca-id").value.trim(), pin=q("#ca-pin").value.trim(), rem=q("#ca-rem").checked;
      if(!id||!pin){err.textContent="Enter your phone number and PIN.";return;}
      btn.disabled=true; err.textContent="Signing in…";
      try{const r=await run("login",id,pin,rem); const s={t:r.token,name:r.name,role:r.role,exp:r.exp,remember:!!r.remember}; save(s);
        try{ if(rem) localStorage.setItem("chaleur.lastid",id); else localStorage.removeItem("chaleur.lastid"); }catch(e){}
        el.innerHTML=""; done(s);}
      catch(e){btn.disabled=false; err.textContent=(e&&e.message)||"Couldn't sign in."; q("#ca-pin").value=""; q("#ca-pin").focus();}};
    btn.onclick=go; q("#ca-pin").addEventListener("keydown",e=>{if(e.key==="Enter")go();}); q("#ca-id").addEventListener("keydown",e=>{if(e.key==="Enter")q("#ca-pin").focus();});
    setTimeout(()=>{const x=q(last?"#ca-pin":"#ca-id"); x&&x.focus();},50);
  }
  function logout(){const s=get(); clear(); if(s){try{run("logout",s.t).catch(()=>{});}catch(e){}} setTimeout(()=>location.replace(location.pathname),150);}
  const chip=s=>s?`<span class="ca-chip">Signed in as <b>${esc(s.name)}</b> · ${esc(ROLE[s.role]||s.role)} <button type="button" data-ca-logout="1">Log out</button></span>`:"";
  document.addEventListener("click",e=>{const b=e.target&&e.target.closest&&e.target.closest("[data-ca-logout]"); if(b){e.preventDefault(); b.disabled=true; logout();}});
  function helper(opt){
    if(document.getElementById("ca-hbtn")) return;
    const b=document.createElement("button"); b.id="ca-hbtn"; b.className="ca-hbtn"; b.type="button"; b.textContent="? Ask"; b.setAttribute("aria-label","Ask the helper a question"); b.setAttribute("aria-expanded","false");
    document.body.appendChild(b);
    let panel=null, H=[], busy=false;
    const hi=opt.hello||"Hi! Ask me how to do anything in this app. For example: “How do I send the closing report?” or “Why can't I mark the delivery as delivered?” You can write in English, Malay or Chinese.";
    function draw(){ if(!panel) return; const m=panel.querySelector(".ca-msgs");
      m.innerHTML=`<div class="ca-m ca-a">${esc(hi)}</div>`+H.map(x=>x.q!=null?`<div class="ca-m ca-q">${esc(x.q)}</div>`:`<div class="ca-m ca-a">${esc(x.a)}</div>`).join("")+(busy?`<div class="ca-m ca-a">Thinking…</div>`:"");
      m.scrollTop=m.scrollHeight; }
    function close(){ if(panel){panel.remove();panel=null;} b.setAttribute("aria-expanded","false"); b.focus(); }
    b.onclick=()=>{ if(panel){close();return;}
      panel=document.createElement("div"); panel.className="ca-hp"; panel.setAttribute("role","dialog"); panel.setAttribute("aria-label","Helper");
      panel.innerHTML=`<div class="ca-hd"><b>Helper</b><button type="button" class="ca-x" aria-label="Close helper">✕</button></div><div class="ca-msgs" aria-live="polite"></div><form><textarea rows="1" placeholder="Ask a question…" aria-label="Your question"></textarea><button type="submit">Send</button></form>`;
      document.body.appendChild(panel); b.setAttribute("aria-expanded","true"); draw();
      const ta=panel.querySelector("textarea"); ta.focus();
      panel.querySelector(".ca-x").onclick=close;
      panel.addEventListener("keydown",e=>{if(e.key==="Escape")close();});
      ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();panel.querySelector("form").dispatchEvent(new Event("submit",{cancelable:true}));}});
      panel.querySelector("form").onsubmit=async e=>{e.preventDefault(); const q=ta.value.trim(); if(!q||busy) return;
        const auth=opt.auth(); if(!auth){H.push({q},{a:"Please sign in first, then ask again."}); ta.value=""; draw(); return;}
        H.push({q}); ta.value=""; busy=true; draw();
        try{const r=await run("askHelp",auth,q,opt.page?opt.page():"",H.slice(-7,-1)); H.push({a:r.answer||"Sorry, I don't know. Please ask your supervisor."});}
        catch(err){H.push({a:(err&&err.message)||"The helper is not available right now."});}
        busy=false; draw(); };
    };
  }
  return {get,save,clear,run,isAuthErr,loginForm,logout,chip,helper,ROLE,esc};
})();
</script>

<script>

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function todayISO(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
const PH={};
async function shrink(file,max=1400){
  const url=URL.createObjectURL(file);
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
  const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
  return c.toDataURL("image/jpeg",0.82);
}
function shotHTML(key,title,hint){

}

  window.onShot&&window.onShot();});

<script>
const TABS=[["today","Today"],["opening","Opening"],["closing","Closing"],["plan","Plan"],["lists","Lists"],["history","History"]];
let TOK=null, INFO=null, INFO_AT=0, TAB=(location.hash||"#today").slice(1), DATE=null, SENDING=false, RESULT=null, HIST=null, HISTERR="", PLE=null, NEWD=null, PHWARN=false, RU={m:"",r:"",l:"1"};
if(!TABS.some(([k])=>k===TAB)) TAB="today";
const K={opening:null,closing:null}, P2={};
const WDL=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const dw=iso=>new Date(iso+"T00:00:00Z").getUTCDay();
const addD=(iso,n)=>{const d=new Date(iso+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};
const niceD=iso=>{const d=new Date(iso+"T00:00:00Z");return WDL[d.getUTCDay()]+" "+d.getUTCDate()+" "+MON[d.getUTCMonth()];};
const colOf=iso=>CONFIG.colours[dw(iso)];
const TZO={timeZone:"Asia/Kuala_Lumpur"};
const hmOf=at=>{ if(!at) return ""; try{return new Date(at).toLocaleTimeString("en-GB",Object.assign({hour:"2-digit",minute:"2-digit"},TZO));}catch(e){return "";} };
const dtOf=at=>{ if(!at) return ""; try{return new Date(at).toLocaleString("en-GB",Object.assign({day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"},TZO));}catch(e){return "";} };
const hex=n=>(CONFIG.colours.find(c=>c.name===n)||{}).hex||"#999";
const dotH=n=>`<span class="dot" style="padding:0"><i style="background:${hex(n)}"></i>${esc(n)} · ${esc(WDL[CONFIG.colours.findIndex(c=>c.name===n)]||"")}</span>`;
const prodOf=id=>((INFO&&INFO.products)||[]).find(p=>p.id===id)||{id,name:id,category:"",shelfDays:3};
const ageOf=(colour,iso)=>{const i=CONFIG.colours.findIndex(c=>c.name===colour); return i<0?0:(dw(iso)-i+7)%7;};
const okCols=iso=>{const out=[]; for(let i=Math.max(0,(INFO&&INFO.maxAge)||1);i>=0;i--) out.push(colOf(addD(iso,-i)).name); return out;};
const CATS=["Petit gâteau","Cheesecake","Whole cake","Whole cheesecake"], CATL={"Petit gâteau":"Petit gâteau","Cheesecake":"Cheesecake (slice)","Whole cake":"Whole cake (entremet)","Whole cheesecake":"Whole cheesecake"};
const SUP=()=>INFO&&INFO.me&&INFO.me.sup;
const run=(fn,...a)=>CA.run(fn,TOK,...a).catch(e=>{ if(CA.isAuthErr(e)){CA.clear(); TOK=null; signIn(e.message);} throw e; });
const nonce=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const dkey=(kind)=>"kh."+kind+"."+DATE;
function saveDraft(kind){ try{localStorage.setItem(dkey(kind),JSON.stringify(K[kind]));}catch(e){} }
function loadDraft(kind){ try{const v=localStorage.getItem(dkey(kind)); return v?JSON.parse(v):null;}catch(e){return null;} }
const IDB={p:null,open(){ return this.p||(this.p=new Promise((res,rej)=>{ try{ const r=indexedDB.open("chaleur-kitchen",1); r.onupgradeneeded=()=>r.result.createObjectStore("ph",{keyPath:"k"}); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){rej(e);} })); },
  async tx(mode,fn){ const db=await this.open(); return new Promise((res,rej)=>{ const t=db.transaction("ph",mode), out=fn(t.objectStore("ph")); t.oncomplete=()=>res(out&&out.v); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); },
  put(key,v){ return this.tx("readwrite",st=>{ if(v) st.put({k:key,d:key.slice(0,10),v}); else st.delete(key); }); },
  all(){ return this.tx("readonly",st=>{ const o={v:[]}; const rq=st.openCursor(); rq.onsuccess=()=>{const c=rq.result; if(c){o.v.push(c.value); c.continue();}}; return o; }); } };
function savePh(k){ const key=DATE+"|"+k, v=P2[k]; IDB.put(key,v).then(()=>{ if(PHWARN&&v){ PHWARN=false; const w=document.getElementById("phwarn"); if(w) w.remove(); } }).catch(()=>{ if(v&&!PHWARN){ PHWARN=true; const h=document.querySelector("#main h2"); if(h&&!document.getElementById("phwarn")) h.insertAdjacentHTML("afterend",phWarn()); } }); }
const phWarn=()=>`<p class="err" id="phwarn">This phone could not keep the photos. Don't close this page until you have sent the report.</p>`;
async function loadPhs(){ try{ const t0=todayISO(), all=await IDB.all(); for(const x of all||[]){ if(x.d===DATE){ const k=x.k.slice(11); if(!P2[k]) P2[k]=x.v; } else if(x.d<addD(t0,-2)) IDB.put(x.k,null).catch(()=>{}); } }catch(e){} }
function clearDraft(kind){ try{localStorage.removeItem(dkey(kind));}catch(e){} const pre=kind==="opening"?"op_":"cl_"; Object.keys(P2).forEach(k=>{ if(k.indexOf(pre)===0){ delete P2[k]; savePh(k);} }); K[kind]=null; }

function signIn(msg){ $("#tabs").hidden=true; $("#bar").hidden=true; $("#acct").innerHTML=""; CA.loginForm($("#main"),{title:"Kitchen HQ",lede:"Sign in with your phone number and staff PIN.",msg},s=>{TOK=s.t; boot2();}); }

  try{ INFO=await run("hqInfo",DATE||undefined); INFO_AT=Date.now(); DATE=DATE||INFO.today; await loadPhs(); render(); }catch(e){ if(TOK) $("#main").innerHTML=`<div class="card"><p class="err">${esc(e.message)}</p><button class="btn" type="button" data-act="reload">Try again</button></div>`; } }
async function reload(date){ if(date&&date!==DATE){ Object.keys(P2).forEach(k=>delete P2[k]); DATE=date; HIST=null; await loadPhs(); } try{ INFO=await run("hqInfo",DATE); INFO_AT=Date.now(); if(LED&&!LED.dirty) LED=null; render(); }catch(e){ toast(e.message); } }
async function freshen(){ if(!INFO||SENDING||!TOK) return; const t=todayISO(); if(t!==INFO.today&&DATE===INFO.today){ K.opening=K.closing=null; RESULT=null; await reload(t); } else if(Date.now()-INFO_AT>120000) await reload(); }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") freshen(); });

function toast(m){ const s=$("#status"); if(s) s.textContent=m; if($("#bar").hidden){ const t=document.createElement("div"); t.className="card"; t.setAttribute("role","status"); t.style.cssText="position:fixed;left:16px;right:16px;bottom:80px;z-index:70;max-width:560px;margin:auto"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),4000);} }

function repCard(kind){ const r=INFO.day[kind], due=kind==="opening"?INFO.conf.openBy:INFO.conf.closeBy, late=!r&&DATE===INFO.today&&INFO.now>due;
  return `<div class="card"><div class="st"><h3>${kind==="opening"?"Opening report":"Closing report"} <span class="muted" style="font-weight:400">· due ${esc(due)}</span></h3>${r?`<span class="pill ok">✓ Sent by ${esc(r.by)} ${esc(hmOf(r.at))}</span>`:late?`<span class="pill bad">Late</span>`:`<span class="pill">Not sent yet</span>`}</div>
    ${r&&(r.issues||[]).length?`<ul class="iss">${r.issues.map(i=>`<li class="${esc(i.sev)}">${esc(i.text)}</li>`).join("")}</ul>`:""}
    <div class="row" style="border:0;display:flex;gap:8px;padding-top:8px;flex-wrap:wrap"><button class="btn sm ${r?"":"pri"}" type="button" data-tab="${kind}">${r?"Send again":"Open "+kind+" report"}</button>${!r&&SUP()&&DATE===INFO.today&&INFO.now>due?`<button class="btn sm" type="button" data-chase="${kind}">Remind the group on WhatsApp</button>`:""}</div></div>`; }
function vToday(){
  const t=INFO.today, rem=INFO.reminders||[], r0=rem.filter(r=>r.date===t), r1=rem.filter(r=>r.date===addD(t,1));
  const out=INFO.dos.filter(d=>!d.internal);
  const planDays=[]; for(let i=0;i<=INFO.conf.planDays;i++) planDays.push(addD(t,i));

      <label class="f">For which day?<select data-newd="1">${days.map(d=>`<option value="${d}" ${d===nd?"selected":""}>${esc(niceD(d))}${d===t?" · today":d===addD(t,1)?" · tomorrow":""}${INFO.plan[d]?" · has "+(INFO.plan[d].lists||[]).length+" list"+((INFO.plan[d].lists||[]).length===1?"":"s"):""}</option>`).join("")}</select></label>
      <div class="pv" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">${mini("plan_read","Photo of the list")}<button class="btn sm pri" type="button" data-act="readPlan" ${P2.plan_read?"":"disabled"}>Read it</button><button class="btn sm" type="button" data-act="typePlan">Type it instead</button></div>
      <p class="hint" style="margin-top:6px">The photo is saved, and the AI writes the list out line by line, the way it is written.</p></div>
    ${vPlanEd()}
    ${days.slice(0,Math.max(3,INFO.conf.planDays)+1).map(d=>{const p=INFO.plan[d], ls=(p&&p.lists)||[]; return `<div class="card"><div class="st"><h3>${esc(niceD(d))}${d===t?" · today":""}</h3>${p?`<span class="pill ${p.approvedBy?"ok":"warn"}">${p.approvedBy?"Checked by "+esc(p.approvedBy):"Not checked yet"}</span>`:`<span class="pill bad">No plan</span>`}</div>
      ${ls.map((l,n)=>`<div class="plist"><div class="st"><b>List ${n+1}</b><span class="hint">${esc(l.by||"")} · ${esc(dtOf(l.editedAt||l.at))}</span></div>
        <div class="plbody">${l.photo&&l.photo.id?`<a href="${viewOf(l.photo.id)}" target="_blank" rel="noopener" class="plph sm"><img src="${thumbOf(l.photo.id)}" alt="Photo of list ${n+1}" loading="lazy"></a>`:""}<ul class="items">${(l.items||[]).map(it=>`<li>${esc(it.name)}${it.qty?" · <b>"+esc(it.qty)+"</b>":""}${it.note?` <span class="muted">(${esc(it.note)})</span>`:""}</li>`).join("")||`<li class="muted">Photo only</li>`}</ul></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px"><button class="btn sm" type="button" data-ple="${d}|${esc(l.id)}">${SUP()?"Edit":"Propose a change"}</button>${SUP()?`<button class="btn sm" type="button" data-plrm="${d}|${esc(l.id)}">Remove</button>`:""}</div></div>`).join("")}
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><button class="btn sm" type="button" data-plan="${d}">+ Add a list for this day</button>${p&&!p.approvedBy&&SUP()?`<button class="btn sm pri" type="button" data-pok="${d}">Mark as checked</button>`:""}</div></div>`;}).join("")}
    ${vRules()}</div>`; }
function vRules(){ const rs=INFO.rules||[];
  return `<div class="card" id="rules"><h3>Prep reminders the system has learned</h3><p class="hint">When an item in the plan contains these words, everyone is reminded to do this, so many days before. The AI suggests new ones from the plans; a supervisor approves them.</p>
    ${rs.length?rs.map(r=>`<div class="st" style="padding:6px 0;border-top:1px dashed var(--line)"><span>${r.active===false?`<s>`:""}“${esc((r.match||[]).join("” / “"))}” → ${esc(r.remind)} <span class="muted">(${+r.lead||0} day${+r.lead===1?"":"s"} before${r.src==="ai"?", AI":""})</span>${r.active===false?`</s>`:""}</span><span style="display:flex;gap:6px"><button class="btn sm" type="button" data-rtog="${esc(r.id)}">${r.active===false?"Turn on":"Turn off"}</button><button class="btn sm" type="button" data-rdel="${esc(r.id)}" aria-label="Delete reminder">✕</button></span></div>`).join(""):`<p class="hint">None yet.</p>`}
    <div class="grid" style="margin-top:10px"><label class="f">Words in the item<input id="ru-m" data-ru="m" value="${esc(RU.m)}" placeholder="e.g. mango, mango serai"></label><label class="f">What to do<input id="ru-r" data-ru="r" value="${esc(RU.r)}" placeholder="e.g. Defrost mango puree"></label><label class="f">Days before<input id="ru-l" data-ru="l" inputmode="numeric" value="${esc(RU.l)}"></label></div>
    <button class="btn sm" type="button" data-act="ruleAdd" style="margin-top:8px">${SUP()?"Add reminder":"Suggest reminder"}</button></div>`; }

/* ---------- LISTS ---------- */
let LED=null;
function vLists(){ if(!LED) LED={carries:new Set(INFO.hq.carries.length?INFO.hq.carries:(INFO.products||[]).map(p=>p.id)),eq:INFO.conf.equipment.map(e=>({...e})),why:""};
  return `<div class="cards" style="margin-top:12px"><h2 style="font-family:var(--display);margin:0;font-size:26px">Lists</h2>
    <p class="hint">${SUP()?"You can change these lists.":"Changes you make here go to a kitchen supervisor to approve."}</p>
    <div class="card"><h3>Cakes on the HQ display chiller</h3><p class="hint">Same as the Orderla menu. Used by the opening report and the Plan &amp; prep suggestion for HQ.</p>
      ${CATS.map(c=>{const ps=(INFO.products||[]).filter(x=>x.category===c); return ps.length?`<div class="grpt">${esc(CATL[c])}</div><div>${ps.map(x=>`<label class="chk2"><input type="checkbox" data-car="${esc(x.id)}" ${LED.carries.has(x.id)?"checked":""}>${esc(x.name)}</label>`).join("")}</div>`:"";}).join("")}
      <button class="btn sm pri" type="button" data-act="saveCarries" style="margin-top:8px">${SUP()?"Save":"Send for approval"}</button></div>
    <div class="card"><h3>Fridges and freezers</h3><p class="hint">Checked in every opening and closing report. “Max” is the warmest allowed temperature.</p>
      ${LED.eq.map((e,i)=>`<div class="pl" style="grid-template-columns:1fr 110px 70px 36px"><input data-eqi="${i}" data-k="name" value="${esc(e.name)}" aria-label="Name"><select data-eqi="${i}" data-k="type" aria-label="Type">${[["freezer","Freezer"],["chiller","Chiller"],["display","Display"]].map(([v,l])=>`<option value="${v}" ${e.type===v?"selected":""}>${l}</option>`).join("")}</select><input data-eqi="${i}" data-k="max" value="${esc(e.max)}" inputmode="text" aria-label="Max °C"><button type="button" class="btn sm" data-eqrm="${i}" aria-label="Remove">✕</button></div>`).join("")}
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn sm" type="button" data-act="eqAdd">+ Add</button><button class="btn sm pri" type="button" data-act="saveEq">${SUP()?"Save":"Send for approval"}</button></div></div>
    ${!SUP()?`<label class="f">Why the change? (for the supervisor)<input id="ls-why" value="${esc(LED.why)}"></label>`:""}
    ${INFO.me.office?`<p class="hint">Report times, WhatsApp reminders and closed days are in the office desk › Setup › Kitchen HQ &amp; WhatsApp.</p>`:""}</div>`; }

/* ---------- HISTORY ---------- */
const thumb=id=>"https:\/\/drive.google.com/thumbnail?id="+encodeURIComponent(id)+"&sz=w300", view=id=>"https:\/\/drive.google.com/file/d/"+encodeURIComponent(id)+"/view";
function vHistory(){ if(!HIST){ if(HISTERR){ const m=HISTERR; HISTERR=""; return `<div class="card" style="margin-top:12px"><p class="err">${esc(m)}</p><button class="btn sm" type="button" data-tab="history">Try again</button></div>`; } run("hqHistory",14).then(h=>{HIST=h; if(TAB==="history") render();}).catch(e=>{HIST=null; HISTERR=e.message; if(TAB==="history") render();}); return `<p class="hint" style="margin-top:12px">Loading…</p>`; }
  const rep=(r,k)=>!r?`<p class="hint">${k==="opening"?"Opening":"Closing"}: not sent.</p>`:`<details><summary><b>${k==="opening"?"Opening":"Closing"}</b> · ${esc(r.by)} ${esc(hmOf(r.at))} · ${(r.issues||[]).length?`<span class="pill ${(r.issues||[]).some(i=>i.sev==="bad")?"bad":"warn"}">${r.issues.length} issue${r.issues.length>1?"s":""}</span>`:`<span class="pill ok">OK</span>`}</summary>
    <table class="t"><tbody>${(r.equip||[]).map(e=>`<tr><td>${esc(e.name)}</td><td class="r">${esc(e.t)}°C</td><td>${e.door?"door closed":"<b>door open</b>"}</td><td>${e.photo?`<a href="${view(e.photo)}" target="_blank" rel="noopener">photo</a>`:""}</td></tr>`).join("")}</tbody></table>
    ${(r.issues||[]).length?`<ul class="iss">${r.issues.map(i=>`<li class="${esc(i.sev)}">${esc(i.text)}</li>`).join("")}</ul>`:""}
    <div class="ph-grid" style="margin-top:6px">${[].concat(r.photos.setup||[],r.photos.display||[],r.photos.waste||[],r.photos.mep||[],r.photos.next||[],(r.deliveries||[]).map(x=>x.photo).filter(Boolean)).map(id=>`<a href="${view(id)}" target="_blank" rel="noopener"><img src="${thumb(id)}" alt="Report photo" loading="lazy"></a>`).join("")}</div>
    ${r.note?`<p class="hint">Note: ${esc(r.note)}</p>`:""}</details>`;
  return `<div class="cards" style="margin-top:12px"><h2 style="font-family:var(--display);margin:0;font-size:26px">Last 14 days</h2>${HIST.length?HIST.map(h=>`<div class="card"><h3>${esc(niceD(h.date))}</h3>${rep(h.opening,"opening")}${rep(h.closing,"closing")}</div>`).join(""):`<p class="hint">No reports yet.</p>`}
    <p class="hint">Every temperature is also logged in the Google Sheet (tab “HQ temps”).</p></div>`; }

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const b=e.target.closest("button"); if(!b||b.closest(".ca-hp,.ca-login")||b.id==="ca-hbtn") return; const d=b.dataset;
  if(d.tab){ go(d.tab); return; }
  if(d.act==="zeroLeft"){ const s=st("closing"); clKeys().forEach(k=>{ const x=s.rows[k]||(s.rows[k]={}); if(x.b===undefined||x.b==="") x.b="0"; }); saveDraft("closing"); render(); return; }
  if(d.act==="reload"){ boot2(); return; }
  if(d.chase){ b.disabled=true; try{ const r=await run("hqChaseNow",d.chase); toast(r.ok?"Reminder sent to the kitchen group.":"The WhatsApp message could not be sent. Check Setup › Kitchen HQ & WhatsApp."); }catch(err){ toast(err.message); b.disabled=false; } return; }
  if(d.date){ RESULT=null; K.opening=K.closing=null; await reload(d.date); return; }
  if(d.sign){ const [k,id,neg]=d.sign.split("|"); st(k).equip[id].neg=neg==="1"; saveDraft(k); b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); refresh(); return; }
  if(d.prm!=null){ const s=st("opening"); s.putOut.splice(+d.prm,1); saveDraft("opening"); render(); return; }
  if(d.xadd){ const pid=$("#xa-p").value, c=$("#xa-c").value; if(!pid) return; const s=st("closing"), k=pid+"|"+c; if(!s.extra.includes(k)) s.extra.push(k); saveDraft("closing"); render(); return; }
  if(d.plan){ NEWD=d.plan; if(TAB!=="plan") go("plan"); else render(); setTimeout(()=>{const x=$("#pladd"); x&&x.scrollIntoView({behavior:"smooth"});},50); return; }
  if(d.act==="pleCancel"){ PLE=null; render(); return; }
  if(d.act==="pleAdd"){ PLE.lines.push(""); render(); setTimeout(()=>{const x=document.querySelector(`[data-pli="${PLE.lines.length-1}"]`); x&&x.focus();},30); return; }
  if(d.plirm!=null){ PLE.lines.splice(+d.plirm,1); render(); return; }
  if(d.act==="typePlan"){ const nd=($("[data-newd]")||{}).value||addD(INFO.today,1); PLE={date:nd,listId:"",token:"",photoId:"",lines:["","",""],why:"",fromAi:false}; render(); setTimeout(()=>{const y=$("#planed"); y&&y.scrollIntoView({behavior:"smooth"});},50); return; }
  if(d.ple){ const [dt,id]=d.ple.split("|"), l=(((INFO.plan[dt]||{}).lists)||[]).find(x=>x.id===id); if(!l) return; PLE={date:dt,listId:id,token:"",photoId:(l.photo&&l.photo.id)||"",lines:(l.items||[]).map(x=>[x.name,x.qty,x.note].filter(Boolean).join(" ")),why:"",fromAi:false}; render(); setTimeout(()=>{const y=$("#planed"); y&&y.scrollIntoView({behavior:"smooth"});},50); return; }
  if(d.plrm){ if(b.dataset.sure!=="1"){ b.dataset.sure="1"; b.textContent="Tap again to remove"; setTimeout(()=>{ if(b.isConnected){ b.dataset.sure=""; b.textContent="Remove"; } },4000); return; }
    const [dt,id]=d.plrm.split("|"); b.disabled=true; try{ const r=await run("hqSave","planList",{date:dt,listId:id,remove:true},""); toast(r.msg); await reload(); }catch(err){ toast(err.message); b.disabled=false; } return; }
  if(d.act==="pleSave"){ const lines=PLE.lines.map(x=>String(x).trim()).filter(Boolean); if(!lines.length&&!PLE.photoId){ toast("Add at least one line"); return; } if(!lines.length&&PLE.listId){ toast("Keep at least one line, or remove the list"); return; }
    b.disabled=true; try{ const r=await run("hqSave","planList",{date:PLE.date,listId:PLE.listId,token:PLE.token,lines},PLE.why||""); toast(r.msg); PLE=null; await reload(); }catch(err){ toast(err.message); b.disabled=false; } return; }
  if(d.pok){ b.disabled=true; try{ const r=await run("hqSave","approvePlan",{date:d.pok}); toast(r.msg); await reload(); }catch(err){ toast(err.message); b.disabled=false; } return; }
  if(d.act==="readPlan"){ if(!P2.plan_read) return; const nd=($("[data-newd]")||{}).value||addD(INFO.today,1); b.disabled=true; b.textContent="Saving and reading… (up to 30 seconds)";
    try{ const r=await run("hqReadPlan",nd,P2.plan_read); delete P2.plan_read; savePh("plan_read"); PLE={date:r.date,listId:"",token:r.token,photoId:(r.photo&&r.photo.id)||"",lines:r.lines.length?r.lines.slice():[""],why:"",fromAi:!!r.lines.length,aiError:r.aiError||"",unclear:r.unclear||[]}; render(); setTimeout(()=>{const y=$("#planed"); y&&y.scrollIntoView({behavior:"smooth"});},50); }
    catch(err){ toast(err.message); render(); } return; }
  if(d.act==="ruleAdd"){ const m=$("#ru-m").value, r=$("#ru-r").value, l=$("#ru-l").value; if(!m.trim()||!r.trim()){ toast("Fill in the words and what to do"); return; }
    b.disabled=true; try{ const x=await run("hqSave","rule",{rule:{match:m,remind:r,lead:l}},""); toast(x.msg); RU={m:"",r:"",l:"1"}; await reload(); }catch(err){ toast(err.message); b.disabled=false; } return; }
  if(d.rtog||d.rdel){ const r=(INFO.rules||[]).find(x=>x.id===(d.rtog||d.rdel)); if(!r) return; b.disabled=true;
    try{ const x=await run("hqSave","rule",{rule:d.rdel?{id:r.id,remove:true,remind:r.remind,match:r.match}:{...r,active:r.active===false}},""); toast(x.msg); await reload(); }catch(err){ toast(err.message); b.disabled=false; } return; }
  if(d.dec){ b.disabled=true; try{ const x=await run("hqDecide",d.dec,d.ok==="1",""); toast(x.msg); await reload(); }catch(err){ toast(err.message); b.disabled=false; } return; }
  if(d.act==="saveCarries"){ b.disabled=true; try{ const x=await run("hqSave","carries",{carries:[...LED.carries]},(($("#ls-why")||{}).value||"")); toast(x.msg); LED=null; await reload(); }catch(err){ toast(err.message); b.disabled=false; } return; }
  if(d.act==="eqAdd"){ LED.eq.push({id:"",name:"",type:"chiller",max:5}); LED.dirty=true; render(); return; }
  if(d.eqrm!=null){ LED.eq.splice(+d.eqrm,1); LED.dirty=true; render(); return; }
  if(d.act==="saveEq"){ b.disabled=true; try{ const x=await run("hqSave","equipment",{equipment:LED.eq.map(e=>({...e,max:String(e.max).replace("−","-")}))},(($("#ls-why")||{}).value||"")); toast(x.msg); LED=null; K.opening=K.closing=null; await reload(); }catch(err){ toast(err.message); b.disabled=false; } return; }
});
document.addEventListener("input",e=>{ const t=e.target, d=t.dataset; if(t.closest&&t.closest(".ca-hp,.ca-login")) return;
  if(d.temp){ const [k,id]=d.temp.split("|"); if(/[-−]/.test(t.value)){ st(k).equip[id].neg=true; document.querySelectorAll(`[data-sign^="${k}|${id}|"]`).forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.sign.endsWith("|1")))); } let v=t.value.replace(/[^0-9.,]/g,""); if(v!==t.value) t.value=v; st(k).equip[id].t=v; saveDraft(k); refresh(); return; }
  if(d.pq!=null){ const v=t.value.replace(/[^0-9]/g,""); if(v!==t.value) t.value=v; const s=st("opening"); s.putOut[+d.pq].qty=v; saveDraft("opening");
    const need=s.putOut.some(l=>+l.qty>0), box=document.getElementById("sb-op_display"); if(need&&!box){ const c=document.getElementById("po-card"); if(c) c.insertAdjacentHTML("afterend",shotBox("op_display","HQ display chiller","After putting the cakes out.")); } if(!need&&box) box.remove(); refresh(); return; }
  if(d.cw!=null||d.cb!=null){ const v=t.value.replace(/[^0-9]/g,""); if(v!==t.value) t.value=v; const s=st("closing"), k=d.cw??d.cb; s.rows[k]=s.rows[k]||{}; s.rows[k][d.cw!=null?"w":"b"]=v; saveDraft("closing");
    const needW=Object.values(s.rows).some(x=>+x.w>0), has=!!document.getElementById("sb-cl_waste"); if(needW!==has){ const box=document.getElementById("sb-cl_display"); if(needW&&box) box.insertAdjacentHTML("afterend",shotBox("cl_waste","Cakes thrown away","")); if(!needW&&has) document.getElementById("sb-cl_waste").remove(); } refresh(); return; }
  if(d.note){ st(d.note).note=t.value; saveDraft(d.note); return; }
  if(d.pli!=null&&PLE){ PLE.lines[+d.pli]=t.value; return; }
  if(d.plewhy&&PLE){ PLE.why=t.value; return; }
  if(d.ru){ RU[d.ru]=t.value; return; }
  if(d.eqi!=null&&LED){ LED.eq[+d.eqi][d.k]=t.value; LED.dirty=true; return; }
  if(t.id==="ls-why"&&LED){ LED.why=t.value; LED.dirty=true; return; }
});
document.addEventListener("change",async e=>{ const t=e.target, d=t.dataset; if(t.closest&&t.closest(".ca-hp,.ca-login")) return;
  if(d.kshot&&t.files&&t.files[0]){ const k=d.kshot, sp=document.getElementById("mi-"+k); if(sp) sp.insertAdjacentHTML("beforeend",' <span class="hint">processing…</span>'); if(TAB==="opening"||TAB==="closing"){ const b=$("#send"); b.disabled=true; }
    let bad=false; try{ P2[k]=await shrink(t.files[0],k==="plan_read"?1600:1200); savePh(k); }catch(err){ bad=true; }
    t.value=""; if(bad){ const el=document.getElementById("mi-"+k); if(el){ el.querySelectorAll(".hint").forEach(x=>x.remove()); el.insertAdjacentHTML("beforeend",' <span class="err">Photo not taken. Please try again.</span>'); } if(TAB==="opening"||TAB==="closing") refresh(); return; } if(/^(op|cl)_(mep|next)\d|^(op|cl)_display|^(op|cl)_waste|^op_(setup|do_)|^plan_read/.test(k)) render(); else { const el=document.getElementById("mi-"+k); if(el) el.outerHTML=mini(k); } if(TAB==="opening"||TAB==="closing") refresh(); return; }
  if(d.door){ const [k,id]=d.door.split("|"); st(k).equip[id].door=t.checked; saveDraft(k); refresh(); return; }
  if(d.setup){ st("opening").setupOk=t.checked; saveDraft("opening"); refresh(); return; }
  if(d.later){ st("opening").later[d.later]=t.checked; saveDraft("opening"); render(); return; }
  if(d.pc!=null){ st("opening").putOut[+d.pc].colour=t.value; saveDraft("opening"); return; }
  if(d.padd){ if(!t.value) return; const s=st("opening"); s.putOut.push({productId:t.value,colour:colOf(DATE).name,qty:"1"}); saveDraft("opening"); render(); return; }
  if(d.newd){ NEWD=t.value; return; }
  if(d.rdate&&t.value){ RESULT=null; K.opening=K.closing=null; await reload(t.value); return; }
  if(d.car){ if(t.checked) LED.carries.add(d.car); else LED.carries.delete(d.car); LED.dirty=true; return; }
  if(d.eqi!=null&&LED){ LED.eq[+d.eqi][d.k]=t.value; LED.dirty=true; return; }
});
$("#send").onclick=send;
window.addEventListener("hashchange",()=>{ const h=(location.hash||"").slice(1); if(TABS.some(([k])=>k===h)&&h!==TAB&&INFO){ TAB=h; RESULT=null; render(); } });
(function(){ CA.helper({auth:()=>TOK,page:()=>"Kitchen HQ › "+((TABS.find(([k])=>k===TAB)||["",""])[1])});
  const s=CA.get(); if(!s) return signIn(); TOK=s.t; boot2(); })();
</script>
</body></html>
